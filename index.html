      } else {
        html += `<div style="background:rgba(245,158,11,0.12);border:1.5px solid #F59E0B;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12.5px;color:#92400E;line-height:1.45;">
          📦 <b>Inactive &amp; Historical Vault:</b> These students have completed their term or were removed from the active schedule. All historical attendance, evaluations, and photos are 100% preserved. Tap <b>♻️ Restore</b> to return any student to the active roster!
        </div>`;
        html += archivedStudentsData.map(s => {
          const b = batchById(s.batchId);
          const att = s.attendance || { conducted: 0, present: 0, pct: null };
          const photoSrc = s.photo || DEFAULT_STUDENT_AVATAR;
          return `
            <div class="student-row" style="background:var(--card);border:1.5px dashed var(--line);margin-bottom:12px;opacity:0.95;">
              <div style="display:flex;align-items:center;gap:12px;">
                <img src="${photoSrc}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--accent-warm);" onerror="this.src='/itma-logo.png'" />
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:700;font-size:15px;color:var(--text);">${escapeHtml(s.name)} <span class="badge" style="background:#FEF3C7;color:#92400E;font-size:10px;">📦 Inactive Vault</span></div>
                  <div class="muted" style="font-size:12px;margin-top:2px;">📞 ${s.mobile} · Past Batch: <b>${b ? b.name : s.batchId}</b> (${fmtTime(s.time_slot || s.time)})</div>
                  <div style="font-size:11.5px;color:var(--accent-deep);font-weight:600;margin-top:3px;">📊 Past Attendance: ${att.present || 0} Present / ${att.conducted || 0} Classes (${att.pct != null ? att.pct + '%' : '—'})</div>
                </div>
              </div>
              <div class="actionrow" style="margin-top:10px;display:flex;gap:8px;">
                <button class="btn primary sm" data-restore-student="${s.id}" style="flex:1;justify-content:center;background:linear-gradient(180deg,#10B981 0%,#059669 100%);border:none;color:#fff;font-weight:700;padding:8px;">♻️ Restore to Active Roster</button>
                <button class="btn ghost sm" data-rep="${s.id}" style="flex:1;justify-content:center;font-weight:700;padding:8px;">📄 View Past Attendance</button>
              </div>
            </div>`;
        }).join("");
      }
    } else if (displayedList.length === 0) {
      if (studentViewMode === 'today') {
        html += `<div class="empty"><div class="big">📅</div>No batch classes scheduled for today (${todayName}).<br/><span class="muted" style="font-size:12px;">Switch to "All" or "Regular" to see all enrolled students.</span></div>`;
      } else if (studentViewMode === 'regular') {
        html += `<div class="empty"><div class="big">🎓</div>No regular batch students found.</div>`;
      } else if (studentViewMode === 'flexible') {
        html += `<div class="empty"><div class="big">⚡</div>No flexible session students found.<br/><span class="muted" style="font-size:12px;">You can set or convert any student to Flexible from "Change Timing &amp; Type".</span></div>`;
      } else if (studentViewMode === 'solo') {
        html += `<div class="empty"><div class="big">👤</div>No individual solo students enrolled yet.</div>`;
      } else if (studentViewMode === 'group') {
        html += `<div class="empty"><div class="big">👫</div>No combined sibling or group classes enrolled yet.<br/><span class="muted" style="font-size:12px;">Click "+ Enroll" or "🔗 Group" to combine individual students into a group.</span></div>`;
      } else {
        html += `<div class="empty"><div class="big">🎻</div>No students enrolled yet.</div>`;
      }
    } else {
      // Strict chronological sorting by class time slot (05:00 AM -> 11:00 PM)
      const sorted = displayedList.slice().sort((a, b) => {
        const timeDiff = (a.time || '').localeCompare(b.time || '');
        if (timeDiff !== 0) return timeDiff;
        return (a.name || '').localeCompare(b.name || '');
      });

      html += sorted.map(s => {
        const b = batchById(s.batchId);
        const att = s.attendance || { conducted: 0, present: 0, pct: null, totalScheduled: 12 };
        const isGroup = s.slotType && s.slotType !== 'solo';
        const isFlex = s.studentType === 'flexible';
        const typeBadge = isFlex ? '<span class="badge occasional" style="font-weight:700;">⚡ Flex</span>' : '<span class="badge regular" style="font-weight:700;">🎓 Regular</span>';
        const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(s.slotType)}</span>` : '';
        const durBadge = (s.durationHours && s.durationHours > 1) ? `<span class="badge duration">⏱️ ${s.durationHours}h</span>` : '';
        const instBadges = (s.instruments || []).map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ");
        
        let mems = "";
        if (isGroup && s.groupMembers && s.groupMembers.length > 0) {
          mems = `<div style="background:rgba(14,165,233,0.08);padding:8px 12px;border-radius:10px;margin:8px 0 6px;font-size:12px;border:1px solid rgba(14,165,233,0.25);">
            <div style="color:var(--accent-deep);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:4px;">
              👥 Group Members (${s.groupMembers.length}):
            </div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${s.groupMembers.map(m => `
                <span style="background:var(--card-solid);padding:3px 8px;border-radius:8px;border:1px solid var(--line);font-size:11.5px;font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:6px;">
                  <img src="${m.photo || s.photo || DEFAULT_STUDENT_AVATAR}" style="width:20px;height:20px;border-radius:50%;object-fit:cover;border:1px solid var(--accent);" onerror="this.src='/itma-logo.png'" />
                  ${escapeHtml(m.name)}${m.instruments && m.instruments.length > 0 ? ` <span class="muted" style="font-weight:400;">(${m.instruments.join(', ')})</span>` : ''}
                </span>
              `).join('')}
            </div>
          </div>`;
        }

        const photoSrc = s.photo || DEFAULT_STUDENT_AVATAR;

        return `
          <div class="student-row" data-open-student-id="${s.id}" style="cursor:pointer;position:relative;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);transition:all var(--transition-smooth);margin-bottom:12px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <!-- Profile Photo Avatar (Single or Multi-Duo/Trio Cluster) -->
              ${isGroup ? renderGroupAvatars(s.groupMembers, s.photo, 48) : `
                <div style="position:relative;flex-shrink:0;">
                  <img src="${photoSrc}" alt="${escapeHtml(s.name)}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:var(--glow);background:var(--card-solid);display:block;" onerror="this.src='/itma-logo.png'" />
                </div>
              `}

              <div style="flex:1;min-width:0;">
                <div class="row between" style="margin-bottom:2px;">
                  ${isGroup ? `<div class="name" style="margin:0;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);">👥 ${escapeHtml(s.groupName || s.name)}</div>` : `<div class="name" style="margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);">${escapeHtml(s.name)}</div>`}
                  <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">${typeBadge} ${durBadge} ${groupBadge}</div>
                </div>

                <div style="color:var(--accent-warm);font-weight:600;font-size:12px;display:flex;align-items:center;gap:4px;">
                  ⏱️ ${fmtTimeRange(s.time, s.durationHours || 1)} · <span class="muted" style="font-weight:400;">${b ? b.name : '—'}</span>
                </div>
                <div class="phone" style="font-size:11.5px;color:var(--muted);">${s.mobile}</div>
              </div>
            </div>

            ${mems}
            ${instBadges ? `<div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:4px;">${instBadges}</div>` : ''}
            ${s.currentLesson ? `<div class="muted" style="font-size:11.5px;margin-top:5px;">🎼 Lesson: <b style="color:var(--text);">${escapeHtml(s.currentLesson)}</b></div>` : ''}

            ${(att.conducted > 0) ? `
              <div class="attendance-bar"><div class="attendance-fill" style="width:${att.pct}%"></div></div>
              <div class="muted" style="font-size:10.5px;margin-top:5px;display:flex;justify-content:space-between;align-items:center;">
                <span>📅 <b>${att.month || 'This Month'}:</b> ${att.pct}% (${att.present}/${att.conducted} classes)</span>
                <span style="color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:2px;">Manage ➔</span>
              </div>`
              : `<div class="muted" style="font-size:10.5px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;">
                  <span>📅 0/${att.totalScheduled || 12} classes attended</span>
                  <span style="color:var(--accent);font-weight:700;display:inline-flex;align-items:center;gap:2px;">Manage ➔</span>
                </div>`}
          </div>`;
      }).join("");
    }

    main.innerHTML = html;
    document.getElementById("addStudentBtn").onclick = openAddStudentSheet;
    const mergeTopBtn = document.getElementById("mergeStudentsBtn");
    if (mergeTopBtn) mergeTopBtn.onclick = () => openMergeGroupModal(null);

    main.querySelectorAll("[data-svm]").forEach(btn => {
      btn.onclick = () => {
        studentViewMode = btn.getAttribute("data-svm");
        renderCoachTab();
      };
    });

    // Tap-to-expand: clicking any student card opens the Apple iOS Frosted Action Sheet
    main.querySelectorAll("[data-open-student-id]").forEach(card => {
      card.onclick = (e) => {
        const studentId = card.getAttribute("data-open-student-id");
        openStudentActionSheet(studentId);
      };
    });
  }

  // ---------- APPLE IOS FROSTED ACTION SHEET FOR INDIVIDUAL STUDENT ----------
  function openStudentActionSheet(studentId) {
    const s = (studentsData || []).find(st => st.id === studentId);
    if (!s) { showToast("Student not found"); return; }

    const b = batchById(s.batchId);
    const att = s.attendance || { conducted: 0, present: 0, pct: null, totalScheduled: 12 };
    const isGroup = s.slotType && s.slotType !== 'solo';
    const isFlex = s.studentType === 'flexible';
    const photoSrc = s.photo || DEFAULT_STUDENT_AVATAR;

    const sheetHtml = `
      <div class="sheethead" style="margin-bottom:12px;">
        <span class="badge ${isFlex ? 'occasional' : 'regular'}" style="font-size:11px;">${isFlex ? '⚡ Flexible Student' : '🎓 Regular Batch'}</span>
        <button class="close" data-close>✕</button>
      </div>

      <!-- Centered High-Res Profile Photo(s) & Student Identity -->
      <div style="text-align:center;padding:10px 0 16px;border-bottom:1px solid var(--line);margin-bottom:16px;">
        ${isGroup && s.groupMembers && s.groupMembers.length > 0 ? `
          <div style="display:flex;justify-content:center;gap:14px;margin-bottom:12px;flex-wrap:wrap;">
            ${s.groupMembers.map((m, idx) => `
              <div style="text-align:center;">
                <div style="position:relative;display:inline-block;">
                  <img id="groupMemberPhoto_${idx}" src="${m.photo || s.photo || DEFAULT_STUDENT_AVATAR}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid var(--accent);box-shadow:0 4px 12px rgba(2,132,199,0.25);display:block;background:var(--card-solid);" onerror="this.src='/itma-logo.png'" />
                  <label style="position:absolute;bottom:-2px;right:-2px;background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.4);" title="Update photo for ${escapeHtml(m.name)}">
                    📷
                    <input type="file" class="groupMemberPhotoInput" data-member-idx="${idx}" accept="image/*" style="display:none;" />
                  </label>
                </div>
                <div style="font-weight:700;font-size:12px;margin-top:4px;color:var(--text);">${escapeHtml(m.name)}</div>
                <div class="muted" style="font-size:10.5px;">${m.instruments && m.instruments.length > 0 ? m.instruments.join(', ') : 'All Instruments'}</div>
              </div>
            `).join('')}
          </div>
        ` : `
          <div style="position:relative;display:inline-block;margin-bottom:8px;">
            <img id="sheetStudentPhoto" src="${photoSrc}" alt="${escapeHtml(s.name)}" style="width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:var(--glow-accent);background:var(--card-solid);display:block;" onerror="this.src='/itma-logo.png'" />
            <label style="position:absolute;bottom:0;right:0;background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.5);">
              📷
              <input type="file" id="sheetPhotoUploadInput" accept="image/*" style="display:none;" />
            </label>
          </div>
        `}
        <h3 style="margin:0;font-size:20px;font-weight:800;color:var(--text);">${escapeHtml(s.groupName || s.name)}</h3>
        <div style="color:var(--accent-warm);font-weight:600;font-size:13.5px;margin-top:2px;">
          ⏱️ ${fmtTimeRange(s.time, s.durationHours || 1)} · <span class="muted" style="font-weight:400;">${b ? b.name : '—'}</span>
        </div>
        <div class="phone" style="font-size:13px;color:var(--muted);margin-top:2px;">📱 +91 ${s.mobile}</div>
        ${s.instruments && s.instruments.length > 0 ? `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;">${s.instruments.map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ")}</div>` : ''}
      </div>

      <!-- Quick Action Buttons -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
        <button class="btn ghost" id="sheetBtnCall" style="justify-content:center;padding:12px;font-weight:700;">📞 Call Student</button>
        <button class="btn primary" id="sheetBtnWa" style="justify-content:center;padding:12px;font-weight:700;">💬 WhatsApp</button>
      </div>

      <!-- Attendance & Progress Section -->
      <div class="card" style="padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;">
        <div class="row between" style="margin-bottom:6px;">
          <span style="font-size:12px;font-weight:700;color:var(--accent-warm);text-transform:uppercase;">📅 Monthly Attendance</span>
          <span style="font-size:12px;font-weight:700;color:var(--text);">${att.pct !== null ? att.pct + '%' : '0%'}</span>
        </div>
        <div class="attendance-bar" style="margin:4px 0 8px;"><div class="attendance-fill" style="width:${att.pct || 0}%"></div></div>
        <div class="muted" style="font-size:11.5px;">${att.present} of ${att.conducted} classes attended this month (${att.totalScheduled || 12} total scheduled).</div>
      </div>

      <!-- Full Management Action List -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn good block" id="sheetBtnMarkAtt">📅 Mark / View Attendance</button>
        <button class="btn ghost block" id="sheetBtnPerf" style="border-color:rgba(245,158,11,0.3);color:var(--accent-warm);">⭐ Performance Notes &amp; Homework</button>
        <button class="btn ghost block" id="sheetBtnEdit">🕒 Change Timing &amp; Enrollment Format</button>
        <button class="btn ghost block" id="sheetBtnGroup">🔗 Group with Sibling</button>
        <button class="btn ghost block" id="sheetBtnReport">📊 Download Monthly PDF Report</button>
        <button class="btn warn block" id="sheetBtnDelete" style="margin-top:6px;">🗑️ Remove Student from Academy</button>
      </div>`;

    openSheet(sheetHtml, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      ov.querySelector("#sheetBtnCall").onclick = () => { window.location.href = telLink(s.mobile); };
      ov.querySelector("#sheetBtnWa").onclick = () => {
        const msg = `Hi ${s.name} 🎵 This is Thomas Sir from Thomas International Music Academy.`;
        window.open(waLink(s.mobile, msg), "_blank");
      };

      ov.querySelector("#sheetBtnMarkAtt").onclick = () => {
        ov.remove();
        openMarkStudentAttendanceModal(s.id);
      };

      ov.querySelector("#sheetBtnPerf").onclick = () => {
        ov.remove();
        openPerformanceModal(s.id);
      };

      ov.querySelector("#sheetBtnEdit").onclick = () => {
        ov.remove();
        openEditStudentSheet(s.id);
      };

      ov.querySelector("#sheetBtnGroup").onclick = () => {
        ov.remove();
        openMergeGroupModal(s.id);
      };

      ov.querySelector("#sheetBtnReport").onclick = () => {
        ov.remove();
        openAttendanceReportModal(s.id, true);
      };

      ov.querySelector("#sheetBtnDelete").onclick = async () => {
        if (confirm(`Remove student "${s.name}"? Slot will become free.`)) {
          try {
            await api.delete('/api/students/' + s.id);
            showToast(`${s.name} removed`);
            ov.remove();
            refreshStudents();
          } catch (e) {
            showToast("Error removing student");
          }
        }
      };

      // Photo upload directly from Action Sheet (With Interactive Position Adjusting)
      const photoInput = ov.querySelector("#sheetPhotoUploadInput");
      if (photoInput) {
        photoInput.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          openPhotoCropModal(file, async (compressedBase64) => {
            try {
              await api.post('/api/students/' + s.id + '/photo', { photo: compressedBase64 });
              showToast("Photo updated successfully! 📷");
              const photoEl = ov.querySelector("#sheetStudentPhoto");
              if (photoEl) photoEl.src = compressedBase64;
              s.photo = compressedBase64;
              await loadDataForRole();
              renderCoachTab();
            } catch (err) {
              showToast("Failed to upload photo: " + (err.message || "Try again"));
            }
          });
        };
      }

      // Sibling / Group Individual Member Photo Upload Handlers
      ov.querySelectorAll(".groupMemberPhotoInput").forEach(input => {
        input.onchange = (e) => {
          const idx = parseInt(input.getAttribute("data-member-idx"));
          const file = e.target.files && e.target.files[0];
          if (!file || isNaN(idx)) return;
          openPhotoCropModal(file, async (compressedBase64) => {
            try {
              if (s.groupMembers && s.groupMembers[idx]) {
                s.groupMembers[idx].photo = compressedBase64;
                await api.put('/api/students/' + s.id, {
                  groupMembers: s.groupMembers,
                  photo: s.groupMembers[0].photo || s.photo
                });
                showToast(`Photo updated for ${s.groupMembers[idx].name}! 📷`);
                const photoEl = ov.querySelector(`#groupMemberPhoto_${idx}`);
                if (photoEl) photoEl.src = compressedBase64;
                await loadDataForRole();
                renderCoachTab();
              }
            } catch (err) {
              showToast("Failed to update sibling photo");
            }
          });
        };
      });
    });
  }

  // ---------- SIBLING / STUDENT GROUP MERGE MODAL (SIR SETS FINAL SLOT FOR ALL) ----------
  function openMergeGroupModal(initialStudentId) {
    const cfg = configData;
    const allSlots = (cfg.slots || []).slice().sort();
    const batches = cfg.batches || DEFAULT_BATCHES;
    const allStudents = studentsData || [];

    const selectedStudentIds = new Set();
    if (initialStudentId) selectedStudentIds.add(initialStudentId);

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">🔗 Combine / Group Students</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="muted" style="font-size:12.5px;line-height:1.45;margin-bottom:12px;background:var(--bg-deep);padding:10px 12px;border-radius:8px;border:1px solid var(--line);">
        Select 2 or more students (e.g. siblings who enrolled individually). When you merge them, <b>Music Sir's assigned Batch &amp; Time Slot becomes final</b> for all members, and instant notifications will be sent to their phones.
      </div>

      <div class="field">
        <label>Select Students to Group Together (Pick 2+)</label>
        <div id="mergeStudentPicker" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card-solid);">
          ${allStudents.map(s => {
            const isChecked = selectedStudentIds.has(s.id);
            return `
              <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;background:${isChecked ? 'rgba(14, 165, 233,0.08)' : 'transparent'};">
                <input type="checkbox" value="${s.id}" class="merge-chk" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent);" />
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:13.5px;color:var(--text);">${escapeHtml(s.name)}</div>
                  <div class="muted" style="font-size:11.5px;">${s.mobile} · Current: ${s.batchId} (${fmtTime(s.time)})</div>
                </div>
              </label>`;
          }).join("")}
        </div>
      </div>

      <div class="field">
        <label>Assign Shared Batch Schedule</label>
        <div id="mergeBatchPicker">
          ${batches.map((b, i) => `
            <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
              <div class="name" style="margin:0;">${b.name}</div>
              <div class="muted" style="font-size:12px;">${b.sub}</div>
            </div>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Assigned Final Class Time Slot (5 AM – 11 PM)</label>
        <select id="mergeTimeSelect">
          ${allSlots.map(t => `<option value="${t}" ${t === '17:00' ? 'selected' : ''}>${fmtTime(t)}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Class Duration for Group</label>
        <select id="mergeDurationSelect">
          <option value="1">⏱️ 1 Hour (Standard Class Slot)</option>
          <option value="2" selected>⏱️ 2 Hours (Double Slot — Recommended for 2 Siblings)</option>
          <option value="3">⏱️ 3 Hours (Triple Slot — Recommended for 3 Siblings)</option>
        </select>
      </div>

      <div class="field">
        <label>Group Format Type</label>
        <select id="mergeTypeSelect">
          <option value="sibling_duo">👫 Sibling Duo (2 Members)</option>
          <option value="sibling_trio">👨‍👩‍👧 Sibling Trio (3 Members)</option>
          <option value="group">👥 Small Group Class (4 Members)</option>
        </select>
      </div>

      <button class="btn primary block" id="btnConfirmMerge" style="margin-top:14px;">Confirm &amp; Apply Final Slot to All Members</button>`;

    openSheet(html, (ov) => {
      let chosenBatch = (batches[0]) ? batches[0].id : 'batchA';

      function updateMergeTimes() {
        const dur = parseInt(ov.querySelector("#mergeDurationSelect").value) || 2;
        const available = getAvailableSlotsForBatch(chosenBatch, dur);
        const sel = ov.querySelector("#mergeTimeSelect");
        const btn = ov.querySelector("#btnConfirmMerge");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${dur}h slots in this batch</option>`;
          btn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");
          btn.disabled = false;
        }
      }

      ov.querySelectorAll("#mergeBatchPicker .batchcard").forEach(bc => {
        bc.onclick = () => {
          ov.querySelectorAll("#mergeBatchPicker .batchcard").forEach(b => b.classList.remove("selected"));
          bc.classList.add("selected");
          chosenBatch = bc.getAttribute("data-batch");
          updateMergeTimes();
        };
      });

      ov.querySelector("#mergeDurationSelect").onchange = updateMergeTimes;

      ov.querySelectorAll(".merge-chk").forEach(chk => {
        chk.onchange = () => {
          const count = ov.querySelectorAll(".merge-chk:checked").length;
          const durSel = ov.querySelector("#mergeDurationSelect");
          const typeSel = ov.querySelector("#mergeTypeSelect");
          if (count === 2) {
            if (durSel) durSel.value = "2";
            if (typeSel) typeSel.value = "sibling_duo";
          } else if (count >= 3) {
            if (durSel) durSel.value = "3";
            if (typeSel) typeSel.value = "sibling_trio";
          }
          updateMergeTimes();
        };
      });

      ov.querySelector("[data-close]").onclick = () => ov.remove();

      ov.querySelector("#btnConfirmMerge").onclick = async () => {
        const checked = Array.from(ov.querySelectorAll(".merge-chk:checked")).map(c => c.value);
        if (checked.length < 2) {
          showToast("Please select at least 2 students to merge");
          return;
        }

        const time = ov.querySelector("#mergeTimeSelect").value;
        if (!time) { showToast("Please select an available time slot"); return; }
        const durationHours = parseInt(ov.querySelector("#mergeDurationSelect").value) || checked.length;
        const slotType = ov.querySelector("#mergeTypeSelect").value;

        const btn = ov.querySelector("#btnConfirmMerge");
        btn.disabled = true;
        btn.textContent = "Merging & Updating Slots…";

        try {
          const res = await api.post('/api/students/merge-group', {
            studentIds: checked,
            batchId: stSchMode === '3days' ? chosenBatch : (stSchMode === '2days' ? 'custom_2days' : 'custom_1day'),
          customDays: stSchMode !== '3days' ? getStEffectiveDays() : null,
            time,
            durationHours,
            slotType
          });

          ov.remove();
          showToast(res.message || "Students merged successfully!");
          await refreshSchedule();
          refreshStudents();
        } catch (err) {
          showToast(err.message || "Merge failed");
          btn.disabled = false;
          btn.textContent = "Confirm & Apply Final Slot to All Members";
        }
      };
    });
  }

  // ---------- ACTIVITY NOTIFICATIONS TAB (COACH LIVE NOTIFICATIONS STREAM) ----------
  let activityLogsData = [];
  let unreadActivityCount = 0;

  async function refreshActivityLogs() {
    try {
      const res = await api.get('/api/activity-logs');
      if (res && res.logs) {
        activityLogsData = res.logs;
        unreadActivityCount = res.unreadCount || 0;
      }
    } catch (e) {}
  }

  function formatTimeAgo(ts) {
    if (!ts) return '';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function fmtDateTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  async function renderActivityTab(main) {
    main.innerHTML = `<div class="loading">Loading notifications…</div>`;
    await refreshActivityLogs();

    let html = `
      <div class="row between" style="margin:16px 0 10px;align-items:center;flex-wrap:wrap;gap:8px;">
        <div>
          <h2 style="margin:0;font-size:20px;">Activity Notifications (${activityLogsData.length})</h2>
          <div class="muted" style="font-size:12px;margin-top:2px;">Live audit log of all student enrollments, bookings &amp; attendance alerts</div>
        </div>
        <div class="row gap6">
          ${activityLogsData.length > 0 ? `<button class="btn ghost sm" id="btnMarkAllRead" style="font-size:11.5px;padding:6px 10px;">✓ Mark Read</button>` : ''}
          ${activityLogsData.length > 0 ? `<button class="btn warn sm" id="btnClearAllNotifs" style="font-size:11.5px;padding:6px 10px;">🗑️ Clear All</button>` : ''}
        </div>
      </div>`;

    if (activityLogsData.length === 0) {
      html += `<div class="empty"><div class="big">🔔</div>No activity notifications.<br/><span class="muted" style="font-size:12px;">When students enroll, mark attendance, or book slots, notifications will appear here in real-time.</span></div>`;
    } else {
      html += `<div style="display:flex;flex-direction:column;gap:10px;">` + activityLogsData.map(log => {
        const timeAgo = formatTimeAgo(log.created_at);
        const isUnread = log.is_read === 0;

        let icon = '🔔';
        if (log.action_type === 'enroll_request') icon = '🎓';
        else if (log.action_type === 'student_absent') icon = '⚠️';
        else if (log.action_type === 'flexible_booking') icon = '⚡';
        else if (log.action_type === 'merge_group') icon = '🔗';
        else if (log.action_type === 'timing_change') icon = '🕒';
        else if (log.action_type === 'request_approved') icon = '✓';

        return `
          <div class="card" id="notifCard-${log.id}" style="padding:14px;background:${isUnread ? 'rgba(14, 165, 233,0.06)' : 'var(--card-solid)'};border:1px solid ${isUnread ? 'var(--accent)' : 'var(--line)'};border-radius:12px;text-align:left;position:relative;">
            <div class="row between" style="align-items:flex-start;margin-bottom:6px;">
              <div style="display:flex;align-items:center;gap:8px;padding-right:24px;">
                <span style="font-size:18px;">${icon}</span>
                <div>
                  <div style="font-weight:700;font-size:14px;color:var(--text);">${escapeHtml(log.title)}</div>
                  <div class="muted" style="font-size:11.5px;">${timeAgo} · ${fmtDateTime(log.created_at)}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                ${isUnread ? '<span class="badge warn" style="font-size:9.5px;">New</span>' : ''}
                <button class="btn ghost sm" data-del-notif="${log.id}" title="Dismiss notification" style="padding:2px 8px;font-size:11px;min-height:unset;height:24px;color:var(--muted);border-color:transparent;">✕</button>
              </div>
            </div>
            <div style="font-size:13px;color:var(--text-secondary);line-height:1.45;margin-top:6px;">
              ${escapeHtml(log.message)}
            </div>
            ${log.actor_mobile ? `
              <div class="actionrow" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);">
                <button class="btn ghost sm" onclick="window.location.href='${telLink(log.actor_mobile)}'">📞 Call Student</button>
                <button class="btn ghost sm" onclick="window.open('${waLink(log.actor_mobile, 'Hi ' + (log.actor_name || 'there') + ' 🎵 Music Sir here regarding your music class.')}', '_blank')">💬 WhatsApp</button>
              </div>
            ` : ''}
          </div>`;
      }).join("") + `</div>`;
    }

    main.innerHTML = html;

    const markBtn = document.getElementById("btnMarkAllRead");
    if (markBtn) {
      markBtn.onclick = async () => {
        try {
          await api.post('/api/activity-logs/read', {});
          showToast("All notifications marked as read");
          renderActivityTab(main);
        } catch (e) {}
      };
    }

    const clearAllBtn = document.getElementById("btnClearAllNotifs");
    if (clearAllBtn) {
      clearAllBtn.onclick = async () => {
        if (confirm("Permanently clear all activity notifications?")) {
          try {
            await api.del('/api/activity-logs');
            activityLogsData = [];
            showToast("All notifications cleared");
            renderActivityTab(main);
          } catch (e) {
            showToast("Failed to clear notifications");
          }
        }
      };
    }

    main.querySelectorAll("[data-del-notif]").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-del-notif");
        try {
          await api.del(`/api/activity-logs/${id}`);

          const card = document.getElementById(`notifCard-${id}`);
          if (card) card.remove();
          showToast("Notification cleared");
          if (activityLogsData.length === 0) renderActivityTab(main);
        } catch (err) {
          showToast("Error clearing notification");
        }
      };
    });
  }

        <div class="muted" style="font-size:11.5px;margin-top:4px;">🟢 <i>Occupied slots in this batch are automatically hidden.</i></div>

      <div class="field">
        <label>Class Slot Type</label>

          <option value="solo" ${student.slotType === 'solo' ? 'selected' : ''}>👤 Solo (1-on-1 Individual)</option>

          <option value="sibling_trio" ${student.slotType === 'sibling_trio' ? 'selected' : ''}>👨‍👩‍👧 Sibling Trio Group (3 Members)</option>
          <option value="group" ${student.slotType === 'group' ? 'selected' : ''}>👥 Small Group Class (4 Members)</option>

        <div class="field" style="margin-bottom:8px;"><input type="text" id="editMem2" value="${escapeHtml((initialMembers[1] && initialMembers[1].name) || '')}" placeholder="Member 2 Name" /></div>

      <button class="btn primary block" id="btnSaveStudentChanges">Save &amp; Update Class Timings</button>`;

    openSheet(html, (ov) => {
      const typeSelect = ov.querySelector("#editSlotType");
      const sibWrap = ov.querySelector("#editSiblingNamesWrap");
      const mem3Field = ov.querySelector("#editMem3Field");

      const editPhotoInp = ov.querySelector("#editPhotoInput");
      if (editPhotoInp) {
        editPhotoInp.onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          openPhotoCropModal(file, (compressedBase64) => {
            editPhotoBase64 = compressedBase64;
            const prevEl = ov.querySelector("#editPhotoPreview");
            if (prevEl) prevEl.src = editPhotoBase64;
            const reqBadge = ov.querySelector("#edPhotoReqBadge");
            if (reqBadge) reqBadge.style.display = 'none';
            showToast("Photo adjusted! Click Save to confirm 📷");
          });
        };
      }

      function updateAvailableTimeSlots() {
        const curDur = parseInt(ov.querySelector("#editDuration").value) || 1;
        const effDays = getEdEffectiveDays();
        const available = getAvailableSlotsForCustomDays(effDays, curDur, student.id);
        if (student.time && !available.find(a => a.time === student.time)) {
          available.unshift({ time: student.time, label: fmtTime(student.time) + ' (Current Slot)' });
        }
        const sel = ov.querySelector("#editTime");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${curDur}h slots in this schedule</option>`;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}" ${a.time === student.time ? 'selected' : ''}>${a.label}</option>`).join("");
        }
      }

      // Schedule Mode Switcher in Edit
      ov.querySelectorAll("#edSchMode button").forEach(b => {
        b.onclick = () => {
          ov.querySelectorAll("#edSchMode button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");

          ov.querySelector("#edWrap3Days").style.display = edSchMode === '3days' ? 'block' : 'none';
          ov.querySelector("#edWrap2Days").style.display = edSchMode === '2days' ? 'block' : 'none';
          ov.querySelector("#edWrap1Day").style.display = edSchMode === '1day' ? 'block' : 'none';

          const summaryBadge = ov.querySelector("#edSchSummary");
          if (edSchMode === '3days') {
            summaryBadge.textContent = 'Standard 3 Days (12 Cl/Mo)';
          } else if (edSchMode === '2days') {
            summaryBadge.textContent = 'Twice a Week (8 Cl/Mo)';
          } else {
            summaryBadge.textContent = '1 Day / Wk (4 Cl/Mo)';
          }
          updateAvailableTimeSlots();
        };
      });

      // 3-Day Batch Cards in Edit
      ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateAvailableTimeSlots();
        };
      });

      // 2-Day Custom Selector in Edit
      ov.querySelectorAll("#ed2DayChips .ed-d-btn").forEach(btn => {
        btn.onclick = () => {
          const d = parseInt(btn.getAttribute("data-d"));
          if (edCustomDays.includes(d)) {
            if (edCustomDays.length > 1) {
              edCustomDays = edCustomDays.filter(x => x !== d);
              btn.classList.remove("active");
            }
          } else {
            if (edCustomDays.length >= 2) {
              const removed = edCustomDays.shift();
              ov.querySelector(`#ed2DayChips .ed-d-btn[data-d="${removed}"]`)?.classList.remove("active");
            }
            edCustomDays.push(d);
            btn.classList.add("active");
          }
          edCustomDays.sort((a,b) => a - b);
          const txtEl = ov.querySelector("#ed2DaysText");
          if (txtEl) {
            const names = edCustomDays.map(x => dayNamesMap[x]).join(' & ');
            txtEl.textContent = `Selected: ${names} (Twice a Week · 8 Classes/Mo)`;
          }
          updateAvailableTimeSlots();
        };
      });

      // 1-Day Selector in Edit
      ov.querySelectorAll("#ed1DayChips .ed-1d-btn").forEach(btn => {
        btn.onclick = () => {
          ov.querySelectorAll("#ed1DayChips .ed-1d-btn").forEach(x => x.classList.remove("active"));

          edCustomDays = [parseInt(btn.getAttribute("data-d"))];
          updateAvailableTimeSlots();
        };
      });

      typeSelect.onchange = () => {
        const val = typeSelect.value;
        if (val === 'solo') {
          sibWrap.style.display = 'none';
        } else {
          sibWrap.style.display = 'block';
          mem3Field.style.display = (val === 'sibling_trio' || val === 'group') ? 'block' : 'none';
        }
      };

      ov.querySelectorAll("#editInstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (selectedInstruments.has(inst)) {
            selectedInstruments.delete(inst);
            item.classList.remove("selected");
          } else {
            selectedInstruments.add(inst);
            item.classList.add("selected");
          }
        };
      });

      ov.querySelector("#editDuration").onchange = updateAvailableTimeSlots;

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#btnSaveStudentChanges").onclick = async () => {
        const time = ov.querySelector("#editTime").value;
        if (!time) { showToast("Please select a time slot"); return; }
        const durationHours = parseInt(ov.querySelector("#editDuration").value) || 1;
        const currentLesson = ov.querySelector("#editLessonInput").value.trim();
        const slotType = typeSelect.value;
        const studentType = ov.querySelector("#editStudentType").value;
        const mobileInputVal = ov.querySelector("#editMobileInput") ? ov.querySelector("#editMobileInput").value.trim() : student.mobile;
        const cleanPhone = normalizePhone(mobileInputVal);

        if (studentType === 'regular') {
          if (!cleanPhone || cleanPhone.length < 10) {
            showToast("⚠️ Valid 10-digit mobile number is mandatory for regular batch students.");
            ov.querySelector("#editMobileInput")?.focus();
            return;
          }
          if (!editPhotoBase64 || editPhotoBase64.length < 30) {
            showToast("⚠️ Student photo is mandatory for regular batch students.");
            return;
          }
        }

        const groupMembers = [];
        if (slotType !== 'solo') {
          const m1 = ov.querySelector("#editMem1").value.trim();
          const m2 = ov.querySelector("#editMem2").value.trim();
          const m3 = ov.querySelector("#editMem3").value.trim();
          if (m1) groupMembers.push({ name: m1 });
          if (m2) groupMembers.push({ name: m2 });
          if (m3 && (slotType === 'sibling_trio' || slotType === 'group')) groupMembers.push({ name: m3 });
        }

        const btn = ov.querySelector("#btnSaveStudentChanges");
        btn.disabled = true;
        btn.textContent = "Updating Schedule…";

        try {
          const effDays = getEdEffectiveDays();
          await api.put(`/api/students/${student.id}`, {
            name: student.name,
            mobile: cleanPhone || student.mobile,
            photo: editPhotoBase64 || student.photo,
            batchId: edSchMode === '3days' ? chosenBatch : (edSchMode === '2days' ? 'custom_2days' : 'custom_1day'),
            customDays: edSchMode !== '3days' ? effDays : null,
            time,
            durationHours,
            slotType,
            studentType,
            groupMembers,
            instruments: Array.from(selectedInstruments),
            currentLesson
          });

          ov.remove();
          if (studentType === 'regular' && student.studentType === 'flexible') {
            showToast(`🎉 Regular Student Account Created! ${student.name} can now log in using Registered Mobile: ${cleanPhone}`);
          } else {
            showToast("✓ Schedule & profile updated! All past attendance preserved.");
          }
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Failed to update student");
          btn.disabled = false;
          btn.textContent = "Save & Update Class Timings";
        }
      };
    });
  }

            if (prevEl) prevEl.src = addPhotoBase64;
            showToast("Photo positioned & attached! 📷");
          });
        };
      }

      let stSchMode = '3days';
      let stCustomDays = [1, 4];
      const dayNamesMap = { 0: 'Sunday', 1: 'Monday', 2: 'Tuesday', 3: 'Wednesday', 4: 'Thursday', 5: 'Friday', 6: 'Saturday' };

      function getStEffectiveDays() {
        if (stSchMode === '3days') {
          return chosenBatch === 'batchB' ? [2, 4, 6] : [1, 3, 5];
        } else if (stSchMode === '2days') {
          return stCustomDays;
        } else {
          return stCustomDays.slice(0, 1);
        }
      }

      function updateAvailableTimeSlots() {
        const curDur = parseInt(ov.querySelector("#stDuration").value) || 1;
        const effDays = getStEffectiveDays();
        const available = getAvailableSlotsForCustomDays(effDays, curDur);
        const sel = ov.querySelector("#stTime");
        const confirmBtn = ov.querySelector("#stConfirm");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${curDur}h slots in this schedule</option>`;
          confirmBtn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");
          confirmBtn.disabled = false;
        }
      }

      // Add Student Schedule Mode Switcher
      ov.querySelectorAll("#stSchMode button").forEach(b => {
        b.onclick = () => {
          ov.querySelectorAll("#stSchMode button").forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          stSchMode = b.getAttribute("data-sm");

          ov.querySelector("#stWrap3Days").style.display = stSchMode === '3days' ? 'block' : 'none';
          ov.querySelector("#stWrap2Days").style.display = stSchMode === '2days' ? 'block' : 'none';
          ov.querySelector("#stWrap1Day").style.display = stSchMode === '1day' ? 'block' : 'none';

          const summaryBadge = ov.querySelector("#stSchSummary");
          if (stSchMode === '3days') {
            summaryBadge.textContent = 'Standard 3 Days (12 Cl/Mo)';
          } else if (stSchMode === '2days') {
            summaryBadge.textContent = 'Twice a Week (8 Cl/Mo)';
          } else {
            summaryBadge.textContent = '1 Day / Wk (4 Cl/Mo)';
          }
          updateAvailableTimeSlots();
        };
      });

      ov.querySelectorAll("#batchPicker2 .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPicker2 .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateAvailableTimeSlots();
        };
      });

      ov.querySelectorAll("#st2DayChips .st-d-btn").forEach(btn => {
        btn.onclick = () => {
          const d = parseInt(btn.getAttribute("data-d"));
          if (stCustomDays.includes(d)) {
            if (stCustomDays.length > 1) {
              stCustomDays = stCustomDays.filter(x => x !== d);
              btn.classList.remove("active");
            }
          } else {
            if (stCustomDays.length >= 2) {
              const removed = stCustomDays.shift();
              ov.querySelector(`#st2DayChips .st-d-btn[data-d="${removed}"]`)?.classList.remove("active");
            }
            stCustomDays.push(d);
            btn.classList.add("active");
          }
          stCustomDays.sort((a,b) => a - b);
          const txtEl = ov.querySelector("#st2DaysText");
          if (txtEl) {
            const names = stCustomDays.map(x => dayNamesMap[x]).join(' & ');
            txtEl.textContent = `Selected: ${names} (Twice a Week · 8 Classes/Mo)`;
          }
          updateAvailableTimeSlots();
        };
      });

      ov.querySelectorAll("#st1DayChips .st-1d-btn").forEach(btn => {
        btn.onclick = () => {
          ov.querySelectorAll("#st1DayChips .st-1d-btn").forEach(x => x.classList.remove("active"));
          btn.classList.add("active");
          stCustomDays = [parseInt(btn.getAttribute("data-d"))];
          updateAvailableTimeSlots();
        };
      });

      const typeSelect = ov.querySelector("#slotTypeSelect");
      const durationSelect = ov.querySelector("#stDuration");
      const soloWrap = ov.querySelector("#coachSoloWrap");
      const sibWrap = ov.querySelector("#coachSiblingWrap");
      const mem3Card = ov.querySelector("#coachMem3Card");

      typeSelect.onchange = () => {
        const val = typeSelect.value;
        if (!val) {
          soloWrap.style.display = 'none';
          sibWrap.style.display = 'none';
        } else if (val === 'solo') {
          soloWrap.style.display = 'block';
          sibWrap.style.display = 'none';
        } else {
          soloWrap.style.display = 'none';
          sibWrap.style.display = 'block';
          mem3Card.style.display = (val === 'sibling_trio' || val === 'group') ? 'block' : 'none';
        }
        updateAvailableTimeSlots();
      };

      ov.querySelectorAll("#coachSoloInstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cSoloInst.has(inst)) { cSoloInst.delete(inst); item.classList.remove("selected"); }
          else { cSoloInst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem1InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem1Inst.has(inst)) { cMem1Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem1Inst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem2InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem2Inst.has(inst)) { cMem2Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem2Inst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem3InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem3Inst.has(inst)) { cMem3Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem3Inst.add(inst); item.classList.add("selected"); }
        };
      });

      durationSelect.onchange = updateAvailableTimeSlots;

      ov.querySelectorAll("#batchPicker2 .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPicker2 .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateAvailableTimeSlots();
        };
      });

      const nameInput = ov.querySelector("#stName");
      const mobileInput = ov.querySelector("#stMobile");
      if (nameInput) {
        nameInput.addEventListener("input", () => {
          const match = knownNames.find(k => k.name === nameInput.value);
          if (match) mobileInput.value = match.mobile;
        });
      }

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#stConfirm").onclick = async () => {
        const studentEnrollType = ov.querySelector("#stEnrollStudentType").value;
        const slotType = typeSelect.value;
        const time = ov.querySelector("#stTime").value;
        const durationHours = parseInt(durationSelect.value) || 0;
        const currentLesson = ov.querySelector("#stLesson").value.trim();

        if (!addPhotoBase64) {
          const photoBox = ov.querySelector("#stPhotoBox");
          if (photoBox) {
            photoBox.style.borderColor = "#EF4444";
            photoBox.style.background = "#FEF2F2";
            if (typeof gsap !== 'undefined') {
              gsap.fromTo(photoBox, { x: -8 }, { x: 8, duration: 0.06, repeat: 5, yoyo: true, onComplete: () => gsap.to(photoBox, { x: 0 }) });
            }
            photoBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
          showToast("⚠️ Student photo is COMPULSORY! Please tap 'Take or Choose Photo'.");
          return;
        }
        if (!studentEnrollType) { showToast("Please select Student Enrollment Format"); return; }
        if (!slotType) { showToast("Please select Class Slot Type"); return; }
        if (!durationHours) { showToast("Please select Class Duration"); return; }
        if (!time) { showToast("Please select an available Time Slot"); return; }

        let name = '';
        let mobile = '';
        let groupName = '';
        const groupMembers = [];
        let allSelectedInst = [];

        if (slotType === 'solo') {
          name = nameInput.value.trim();
          mobile = mobileInput.value.trim();
          allSelectedInst = Array.from(cSoloInst);
          if (!name || normalizePhone(mobile).length < 10) {
            showToast("Enter student name and valid 10-digit mobile");
            return;
          }
        } else {
          const m1Name = ov.querySelector("#coachMem1Name").value.trim();
          const m1Mob = ov.querySelector("#coachMem1Mobile").value.trim();
          const m2Name = ov.querySelector("#coachMem2Name").value.trim();
          const m2Mob = ov.querySelector("#coachMem2Mobile").value.trim() || m1Mob;
          groupName = ov.querySelector("#coachGroupName").value.trim() || `${m1Name} & ${m2Name} Duo`;

          if (!m1Name || !m2Name) {
            showToast("Please enter names for both siblings");
            return;
          }
          if (normalizePhone(m1Mob).length < 10 && normalizePhone(m2Mob).length < 10) {
            showToast("Enter a 10-digit contact mobile number");
            return;
          }

          name = groupName;
          mobile = m1Mob || m2Mob;

          groupMembers.push({
            name: m1Name,
            mobile: m1Mob || mobile,
            photo: addPhotoBase64 || '',
            instruments: Array.from(cMem1Inst)
          });

          groupMembers.push({
            name: m2Name,
            mobile: m2Mob || mobile,
            instruments: Array.from(cMem2Inst)
          });

          if (slotType === 'sibling_trio' || slotType === 'group') {
            const m3Name = ov.querySelector("#coachMem3Name").value.trim();
            const m3Mob = ov.querySelector("#coachMem3Mobile").value.trim() || mobile;
            if (m3Name) {
              groupMembers.push({
                name: m3Name,
                mobile: m3Mob,
                instruments: Array.from(cMem3Inst)
              });
            }
          }

          allSelectedInst = Array.from(new Set([...cMem1Inst, ...cMem2Inst, ...cMem3Inst]));
        }

        try {
          const stTimezoneVal = ov.querySelector("#stTimezone") ? ov.querySelector("#stTimezone").value : selectedUserTimezone;
          await api.post('/api/students', {
            name,
            mobile,
            photo: addPhotoBase64 || '',
            timezone: stTimezoneVal,
            batchId: stSchMode === '3days' ? chosenBatch : (stSchMode === '2days' ? 'custom_2days' : 'custom_1day'),
          customDays: stSchMode !== '3days' ? getStEffectiveDays() : null,
            time,
            durationHours,
            slotType,
            studentType: studentEnrollType,
            groupName,
            groupMembers,
            instruments: allSelectedInst,
            currentLesson
          });
          ov.remove();
          showToast(`${name} enrolled for ${durationHours}h successfully! 🎵`);
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Enrollment failed");
        }
      };
    });
  }

  // ---------- PERFORMANCE MODAL ----------
  async function openPerformanceModal(studentId) {
    let student = null;
    let logs = [];

    const sheetHtml = `
      <div class="sheethead"><h3 style="margin:0;">⭐ Student Performance &amp; Progress</h3><button class="close" data-close>✕</button></div>
      <div id="perfModalBody"><div class="loading">Loading student progress…</div></div>`;

    openSheet(sheetHtml, async (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();
      const body = ov.querySelector("#perfModalBody");

      try {
        const res = await api.get(`/api/students/${studentId}/performance`);
        student = res.student;
        logs = res.logs || [];

        let currentSur = 5;
        let currentTaal = 5;
        let currentOverall = 5;

        body.innerHTML = `
          <div class="student-row" style="background:var(--bg-deep);margin-bottom:12px;">
            <div class="name">${escapeHtml(student.name)}</div>
            <div class="phone">${student.mobile} · ${slotTypeLabel(student.slotType)} · ${durationLabel(student.durationHours)}</div>
            ${student.instruments && student.instruments.length > 0 ? `<div style="margin-top:6px;">${student.instruments.map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ")}</div>` : ''}
          </div>

          <div class="field">
            <label>Current Active Lesson / Raga / Song</label>
            <input type="text" id="editLesson" value="${escapeHtml(student.currentLesson || '')}" placeholder="e.g. Raga Yaman - Drut Bandish" />
          </div>

          <div class="field">
            <label>Assigned Homework / Weekly Practice Goals</label>
            <textarea id="editHomework" placeholder="e.g. Practice Taans 1-4 @ 100 BPM for 20 mins daily">${escapeHtml(student.homework || '')}</textarea>
          </div>

          <div class="section-title"><h3 style="margin:0;">Record Today's Evaluation</h3><div class="line"></div></div>

          <div class="field">
            <label>🎵 Sur / Pitch Accuracy</label>
            <div class="star-rating" id="starSur">
              <span data-v="1" class="active">★</span><span data-v="2" class="active">★</span><span data-v="3" class="active">★</span><span data-v="4" class="active">★</span><span data-v="5" class="active">★</span>
            </div>
          </div>

          <div class="field">
            <label>🥁 Taal / Rhythm &amp; Tempo</label>
            <div class="star-rating" id="starTaal">
              <span data-v="1" class="active">★</span><span data-v="2" class="active">★</span><span data-v="3" class="active">★</span><span data-v="4" class="active">★</span><span data-v="5" class="active">★</span>
            </div>
          </div>

          <div class="field">
            <label>🌟 Overall Performance Rating</label>
            <div class="star-rating" id="starOverall">
              <span data-v="1" class="active">★</span><span data-v="2" class="active">★</span><span data-v="3" class="active">★</span><span data-v="4" class="active">★</span><span data-v="5" class="active">★</span>
            </div>
          </div>

          <div class="field">
            <label>Sir's Feedback &amp; Remarks</label>
            <input type="text" id="evalRemarks" placeholder="e.g. Vocal clarity is superb; focus on taan speed" />
          </div>

          <button class="btn primary block" id="btnSaveEval">Save Performance Evaluation</button>

          <div class="section-title"><h3 style="margin:0;">Past Evaluations History (${logs.length})</h3><div class="line"></div></div>
          <div style="background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;">
            ${logs.length === 0 ? '<div class="muted" style="padding:16px;text-align:center;">No previous performance ratings yet.</div>' :
              logs.map(l => `
                <div class="history-item">
                  <div class="row between">
                    <div><b>${l.date_key}</b></div>
                    <div>${'★'.repeat(l.rating_overall || 5)}</div>
                  </div>
                  <div style="font-size:12px;color:var(--accent);margin-2px 0;">Sur: ${l.rating_sur || 5}★ · Taal: ${l.rating_taal || 5}★</div>
                  ${l.remarks ? `<div style="font-size:12.5px;margin-top:2px;">"${escapeHtml(l.remarks)}"</div>` : ''}
                </div>`).join("")}
          </div>`;

        function setupStarGroup(wrapId, onChange) {
          const wrap = body.querySelector(wrapId);
          wrap.querySelectorAll("span").forEach(star => {
            star.onclick = () => {
              const val = parseInt(star.getAttribute("data-v"));
              wrap.querySelectorAll("span").forEach((s, idx) => {
                s.classList.toggle("active", idx < val);
              });
              onChange(val);
            };
          });
        }

        setupStarGroup("#starSur", v => currentSur = v);
        setupStarGroup("#starTaal", v => currentTaal = v);
        setupStarGroup("#starOverall", v => currentOverall = v);

        body.querySelector("#btnSaveEval").onclick = async () => {
          const lesson = body.querySelector("#editLesson").value.trim();
          const homework = body.querySelector("#editHomework").value.trim();
          const remarks = body.querySelector("#evalRemarks").value.trim();

          try {
            await api.post(`/api/students/${studentId}/performance`, {
              ratingSur: currentSur,
              ratingTaal: currentTaal,
              ratingOverall: currentOverall,
              remarks,
              currentLesson: lesson,
              homework
            });
            showToast("Performance evaluation recorded!");
            ov.remove();
            await loadDataForRole();
            renderCoachTab();
          } catch (e) {
            showToast("Failed to save evaluation");
          }
        };

      } catch (err) {
        body.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load performance data</div>`;
      }
    });
  }

  // ---------- ATTENDANCE REPORT & PDF ----------
  async function openAttendanceReportModal(studentId, isCoach) {
    const now = new Date();
    let fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
    let toDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);

    const formatISO = d => dateKey(d);

    const sheetHtml = `
      <div class="sheethead"><h3 style="margin:0;">📊 Student Report</h3><button class="close" data-close>✕</button></div>

      <div class="row gap8" style="margin-bottom:12px;">
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">From</label>
          <input type="date" id="repFrom" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(fromDate)}" />
        </div>
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">To</label>
          <input type="date" id="repTo" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(toDate)}" />
        </div>
      </div>

      <div class="quickjump" style="margin-bottom:12px;">
        <button class="chip active" id="chipThisMonth">This Month</button>
        <button class="chip" id="chipLastMonth">Last Month</button>
        <button class="chip" id="chipLast30">Last 30 Days</button>
      </div>

      <div id="reportContent"><div class="loading">Generating report…</div></div>

      <div class="actionrow" style="margin-top:16px;">
        <button class="btn primary" id="btnDownloadPdf" style="flex:1;justify-content:center;padding:12px;">📄 Download PDF</button>
        ${isCoach ? `<button class="btn good" id="btnSendWa" style="flex:1;justify-content:center;padding:12px;">💬 Send on WhatsApp</button>` : ''}
      </div>`;

    let reportData = null;

    openSheet(sheetHtml, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      const repFromInput = ov.querySelector("#repFrom");
      const repToInput = ov.querySelector("#repTo");
      const contentEl = ov.querySelector("#reportContent");

      async function fetchAndRenderReport() {
        contentEl.innerHTML = '<div class="loading">Generating report…</div>';
        try {
          const from = repFromInput.value;
          const to = repToInput.value;
          const res = await api.get(`/api/students/${studentId}/attendance-report?from=${from}&to=${to}`);
          reportData = res;

          const s = res.student;
          const sum = res.summary;
          const classes = res.classes || [];

          contentEl.innerHTML = `
            <div class="student-row" style="margin-bottom:10px;background:var(--bg-deep);">
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="phone">${s.mobile} · ${s.batchName} · ${fmtTimeRange(s.time, s.durationHours || 1)}</div>
              ${s.instruments && s.instruments.length > 0 ? `<div style="margin-top:4px;">${s.instruments.map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ")}</div>` : ''}
            </div>

            <div class="stat-grid">
              <div class="stat-box">
                <div class="val" style="color:var(--text);">${sum.totalClasses}</div>
                <div class="lbl">Classes</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--good);">${sum.presentCount}</div>
                <div class="lbl">Attended</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--accent);">${sum.attendancePct}%</div>
                <div class="lbl">Attendance</div>
              </div>
            </div>

            ${sum.avgRating ? `<div style="background:var(--card-2);padding:10px;border-radius:10px;margin-bottom:10px;text-align:center;">
              <span style="font-size:13px;color:var(--accent);">⭐ Average Performance Rating: <b>${sum.avgRating} / 5.0</b></span>
            </div>` : ''}

            <h4 style="margin:14px 0 8px;">Class Breakdown</h4>
            <div style="background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;">
              ${classes.length === 0 ? '<div class="muted" style="padding:16px;text-align:center;">No scheduled classes in this period.</div>' :
                classes.map(c => {
                  let statusTxt = c.status === 'present' ? '✓ Present' : c.status === 'absent' ? '✕ Absent' : 'Unmarked';
                  let memberBreakdown = '';
                  if (c.status === 'partial' && c.memberStatuses) {
                    const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
                    statusTxt = `Partial (${abs.length} Absent)`;
                    memberBreakdown = `<div style="font-size:11px;color:var(--accent);margin-top:2px;">Absent: ${abs.join(', ')}</div>`;
                  }

                  return `
                    <div class="history-item">
                      <div class="row between">
                        <div>
                          <div style="font-weight:600;font-size:13px;">${c.date} (${c.dayName.slice(0,3)})</div>
                          <div class="muted" style="font-size:11px;">Slot: ${fmtTimeRange(c.time, c.durationHours || 1)}</div>
                          ${memberBreakdown}
                        </div>
                        <div class="row gap6">
                          <span class="badge ${c.status}">${statusTxt}</span>
                          ${isCoach ? `
                            <button class="btn ${c.status === 'present' ? 'good' : 'ghost'}" data-rep-mark="present" data-rep-date="${c.date}" title="Mark Present" style="padding:5px 8px;font-size:11px;">✓</button>
                            <button class="btn ${c.status === 'absent' ? 'warn' : 'ghost'}" data-rep-mark="absent" data-rep-date="${c.date}" title="Mark Absent" style="padding:5px 8px;font-size:11px;">✕</button>
                          ` : ''}
                        </div>
                      </div>
                      ${c.performance ? `<div style="font-size:11.5px;color:var(--accent);margin-top:4px;">Rating: ${'★'.repeat(c.performance.ratingOverall)} ${c.performance.remarks ? `— "${escapeHtml(c.performance.remarks)}"` : ''}</div>` : ''}
                    </div>`;
                }).join("")}
            </div>`;

          if (isCoach) {
            contentEl.querySelectorAll("[data-rep-mark]").forEach(btn => {
              btn.onclick = async () => {
                const date = btn.getAttribute("data-rep-date");
                const st = btn.getAttribute("data-rep-mark");
                try {
                  await api.post('/api/attendance', { date, studentId, status: st });
                  showToast(`${st === 'present' ? '✓ Present' : '✕ Absent'} recorded for ${date}`);
                  fetchAndRenderReport();
                  await loadDataForRole();
                  renderCoachTab();
                } catch (e) {
                  showToast("Failed to update attendance");
                }
              };
            });
          }
        } catch (err) {
          contentEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load report: ${escapeHtml(err.message)}</div>`;
        }
      }

      ov.querySelector("#chipThisMonth").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipThisMonth").classList.add("active");
        repFromInput.value = formatISO(new Date(now.getFullYear(), now.getMonth(), 1));

      };

      ov.querySelector("#chipLast30").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));

        d30.setDate(d30.getDate() - 30);
        repFromInput.value = formatISO(d30);
        repToInput.value = formatISO(now);
        fetchAndRenderReport();
      };

      repFromInput.onchange = fetchAndRenderReport;
      repToInput.onchange = fetchAndRenderReport;

      function generatePdfDocument() {
        if (!reportData || !window.jspdf) {
          showToast("PDF generator loading, try again in a moment");
          return null;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = reportData.student;
        const sum = reportData.summary;
        const range = reportData.range;

        // Header
        doc.setFillColor(6, 11, 25);
        doc.rect(0, 0, 210, 42, 'F');
        doc.setTextColor(255, 255, 255);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.text('Thomas International Music Academy', 14, 16);
        doc.setFont('helvetica', 'italic');
        doc.setFontSize(9);
        doc.setTextColor(251, 191, 36);
        doc.text('“Sing and make music from your heart to the Lord.” — Ephesians 5:19', 14, 25);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(148, 163, 184);
        doc.text('STUDENT PROGRESS & ATTENDANCE REPORT · MUSIC TEACHER (5 AM - 11 PM)', 14, 34);

        // Details
        doc.setTextColor(30, 30, 30);
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.text(`Student: ${s.name}`, 14, 52);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(`Mobile: +91 ${s.mobile} · Studio Helpline: +91 ${COACH_PRIMARY_MOBILE}`, 14, 59);
        doc.text(`Batch: ${s.batchName} (${s.batchSub})`, 14, 66);
        doc.text(`Class Slot: ${fmtTimeRange(s.time, s.durationHours || 1)} · ${slotTypeLabel(s.slotType)}`, 14, 73);
        if (s.instruments && s.instruments.length > 0) {
          doc.text(`Instruments Learning: ${s.instruments.join(', ')}`, 14, 80);
        }

        // Summary Box
        doc.setFillColor(240, 245, 243);
        doc.roundedRect(120, 46, 76, 34, 3, 3, 'F');
        doc.setTextColor(18, 48, 43);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text(`Attendance Rate: ${sum.attendancePct}%`, 124, 54);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text(`Attended: ${sum.presentCount} / ${sum.totalClasses} classes`, 124, 61);
        doc.text(`Missed: ${sum.absentCount} classes`, 124, 67);
        if (sum.avgRating) {
          doc.setFont('helvetica', 'bold');
          doc.text(`Performance: ${sum.avgRating} / 5.0 Stars`, 124, 74);
        }

        // Table
        const tableRows = (reportData.classes || []).map((c, idx) => {
          let stLabel = c.status === 'present' ? 'Present (✓)' : c.status === 'absent' ? 'Absent (✕)' : 'Unmarked';
          if (c.status === 'partial' && c.memberStatuses) {
            const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
            stLabel = `Partial (${abs.join(', ')} absent)`;
          }

          return [
            idx + 1,
            c.date,
            c.dayName,
            fmtTimeRange(c.time, c.durationHours || 1),
            stLabel,
            c.performance ? `${c.performance.ratingOverall}★ (${c.performance.remarks || 'Evaluated'})` : '—'
          ];
        });

        doc.autoTable({
          startY: 85,
          head: [['#', 'Date', 'Day', 'Class Slot', 'Attendance', 'Performance / Remarks']],
          body: tableRows,
          theme: 'striped',
          headStyles: { fillColor: [28, 64, 56], textColor: [243, 238, 221], fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [248, 250, 249] },
          styles: { fontSize: 8.5, cellPadding: 3 }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
          doc.setPage(i);
          doc.setFontSize(8);
          doc.setTextColor(130);
          doc.text(`Thomas International Music Academy — Student Progress Report • Page ${i} of ${pageCount}`, 14, 288);
        }

        return doc;
      }

      ov.querySelector("#btnDownloadPdf").onclick = () => {
        const doc = generatePdfDocument();
        if (doc) {
          const fileName = `TIMA_Report_${reportData.student.name.replace(/\s+/g, '_')}.pdf`;
          doc.save(fileName);
          showToast("PDF report downloaded!");
        }
      };

      if (isCoach && ov.querySelector("#btnSendWa")) {
        ov.querySelector("#btnSendWa").onclick = async () => {
          if (!reportData) return;
          const s = reportData.student;
          const sum = reportData.summary;
          const range = reportData.range;

          const doc = generatePdfDocument();
          const fileName = `TIMA_Report_${s.name.replace(/\s+/g, '_')}.pdf`;

          const msg = `🎼 *Thomas International Music Academy — Student Progress Report*\n\n` +
            `👤 *Student:* ${s.name}\n` +
            `📅 *Period:* ${range.from} to ${range.to}\n` +
            `🎹 *Batch:* ${s.batchName} (${fmtTimeRange(s.time, s.durationHours || 1)})\n` +
            (s.instruments && s.instruments.length > 0 ? `🎵 *Learning:* ${s.instruments.join(', ')}\n\n` : '\n') +
            `📊 *Progress Summary:*\n` +
            `• Attendance: *${sum.attendancePct}%* (${sum.presentCount}/${sum.totalClasses} classes attended)\n` +
            (sum.avgRating ? `• Performance Rating: *${sum.avgRating} / 5.0 ⭐*\n` : '') +
            (s.currentLesson ? `• Active Lesson: _${s.currentLesson}_\n\n` : '\n') +
            `📄 _The detailed official PDF report is attached above._ Keep practicing music with joy! 🎶`;

          if (doc) {
            try {
              const pdfBlob = doc.output('blob');
              const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

              // Web Share API with native PDF attachment + Text Message
              if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                await navigator.share({
                  files: [pdfFile],
                  title: `Music Progress Report - ${s.name}`,
                  text: msg
                });
                showToast("Report & PDF shared to WhatsApp!");
                return;
              }
            } catch (err) {
              if (err.name !== 'AbortError') console.warn('WebShare issue:', err);
            }

            // Fallback for browsers without direct file sharing
            doc.save(fileName);
          }

          window.open(waLink(s.mobile, msg), '_blank');
          showToast("PDF downloaded & WhatsApp opened!");
        };
      }

      fetchAndRenderReport();
    });
  }
