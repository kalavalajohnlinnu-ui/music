            </div>
          </div>`;
      }).join("");
    }

    main.innerHTML = html;

    const clearAllBtn = main.querySelector("#btnClearAllReqs");
    if (clearAllBtn) {
      clearAllBtn.onclick = async () => {
        if (confirm("Permanently clear and remove all pending requests?")) {
          try {
            await api.del('/api/requests');
            requestsData = [];
            showToast("All requests removed");
            await loadDataForRole();
            renderCoachTab();
          } catch (e) {
            showToast("Failed to clear requests");
          }
        }
      };
    }

    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });

    main.querySelectorAll("[data-decline]").forEach(btn => btn.onclick = async () => {
      const id = btn.getAttribute("data-decline");
      if (confirm("Remove this join request?")) {
        try {
          await api.del(`/api/requests/${id}`);
          requestsData = requestsData.filter(r => r.id !== id);
          const card = document.getElementById(`reqCard-${id}`);
          if (card) card.remove();
          showToast("Request removed");
          await loadDataForRole();
          renderCoachTab();
        } catch (e) {
          showToast("Error removing request");
        }
      }
    });

    main.querySelectorAll("[data-approve]").forEach(btn => btn.onclick = () => {
      const id = btn.getAttribute("data-approve");
      const req = requestsData.find(r => r.id === id);
      if (req) openAssignBatchSheet(req);
    });
  }

  function openAssignBatchSheet(req) {
    const cfg = configData;
    const isGroup = req.slotType && req.slotType !== 'solo';
    const members = req.groupMembers || [];
    let chosenBatch = (cfg.batches && cfg.batches[0]) ? cfg.batches[0].id : 'batchA';
    let durationHours = req.durationHours || (isGroup ? 2 : 1);

    const initialAvailable = getAvailableSlotsForBatch(chosenBatch, durationHours);

    const html = `
      <div class="sheethead"><h3 style="margin:0;">Approve &amp; Assign ${escapeHtml(req.name)}</h3><button class="close" data-close>✕</button></div>
      
      ${isGroup ? `
        <div class="field">
          <label>Confirmed Sibling / Group Name</label>
          <input type="text" id="asGroupName" value="${escapeHtml(req.groupName || req.name || '')}" placeholder="e.g. Sharma Siblings" />
        </div>

        <div style="background:var(--bg-deep);padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px;">
          <div style="font-size:11px;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:6px;">👥 Enrolled Sibling Profiles (${members.length})</div>
          ${members.map((m, idx) => `
            <div style="padding:6px 0;border-bottom:${idx < members.length - 1 ? '1px dashed var(--line)' : 'none'};">
              <div style="font-weight:600;font-size:13.5px;color:var(--text);">${escapeHtml(m.name)} <span class="muted" style="font-size:11.5px;font-weight:400;">(${m.mobile || req.mobile})</span></div>
              <div style="font-size:12px;color:var(--accent-warm);margin-top:2px;">🎼 Instruments: <b>${(m.instruments && m.instruments.length) ? m.instruments.join(', ') : 'All Studio Instruments'}</b></div>
            </div>
          `).join("")}
        </div>
      ` : `
        <div style="background:var(--bg-deep);padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-bottom:12px;font-size:13px;">
          👤 Solo Student: <b>${escapeHtml(req.name)}</b> (${req.mobile})<br/>
          🎼 Instruments: <b>${(req.instruments && req.instruments.length) ? req.instruments.join(', ') : 'Music'}</b>
        </div>
      `}

      <div class="field"><label>Select Recurring Batch Schedule</label>
        <div id="batchPicker">${(cfg.batches || []).map((b, i) => `
          <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
            <div class="name" style="margin:0;">${b.name}</div>
            <div class="muted" style="font-size:12px;">${b.sub}</div>
          </div>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Class Duration (Hours)</label>
        <select id="asDuration">
          <option value="1" ${durationHours == 1 ? 'selected' : ''}>⏱️ 1 Hour (Standard Slot)</option>
          <option value="2" ${durationHours == 2 ? 'selected' : ''}>⏱️ 2 Hours (Double Slot — Recommended for Siblings)</option>
          <option value="3" ${durationHours == 3 ? 'selected' : ''}>⏱️ 3 Hours (Triple Slot — Recommended for 3 Siblings)</option>
        </select>
      </div>

      <div class="field"><label>Available Free Time Slots in Selected Batch (5 AM – 11 PM)</label>
        <select id="asTime">
          ${initialAvailable.length > 0
            ? initialAvailable.map(t => `<option value="${t.time}">${t.label}</option>`).join("")
            : '<option value="">⚠️ No free slots available in this batch</option>'}
        </select>
        <div class="muted" style="font-size:11.5px;margin-top:4px;">🟢 <i>Already booked slots in this batch are automatically hidden.</i></div>
      </div>

      <button class="btn primary block" id="asConfirm" ${initialAvailable.length === 0 ? 'disabled' : ''}>Confirm &amp; Create Sibling Profiles in Roster</button>`;

    openSheet(html, (ov) => {
      function updateTimeSlots() {
        const dur = parseInt(ov.querySelector("#asDuration").value) || 1;
        const available = getAvailableSlotsForBatch(chosenBatch, dur);
        const sel = ov.querySelector("#asTime");
        const confirmBtn = ov.querySelector("#asConfirm");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${dur}h slots in this batch</option>`;
          confirmBtn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");
          confirmBtn.disabled = false;
        }
      }

      ov.querySelectorAll("#batchPicker .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPicker .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateTimeSlots();
        };
      });

      ov.querySelector("#asDuration").onchange = updateTimeSlots;

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#asConfirm").onclick = async () => {
        const time = ov.querySelector("#asTime").value;
        if (!time) { showToast("Please select an available time slot"); return; }
        const dur = parseInt(ov.querySelector("#asDuration").value) || 1;
        const groupNameInput = ov.querySelector("#asGroupName");
        const groupName = groupNameInput ? groupNameInput.value.trim() : req.groupName;

        const btn = ov.querySelector("#asConfirm");
        btn.disabled = true;
        btn.textContent = "Assigning & Creating Profiles…";

        try {
          await api.post(`/api/requests/${req.id}/approve`, {
            batchId: chosenBatch,
            time,
            durationHours: dur,
            slotType: req.slotType,
            groupName,
            groupMembers: req.groupMembers,
            instruments: req.instruments
          });
          ov.remove();
          requestsData = requestsData.filter(r => r.id !== req.id);
          showToast(`${groupName || req.name} enrolled for ${dur}h successfully!`);
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Failed to assign student");
          btn.disabled = false;
          btn.textContent = "Confirm & Create Sibling Profiles in Roster";
        }
      };
    });
  }

  // ---------- STUDENTS TAB ----------
  async function refreshStudents() {
    try {
      const res = await api.get('/api/students');
      studentsData = res.students || [];
      renderCoachTab();
    } catch (e) {
      showToast("Error refreshing students");
    }
  }

  function renderStudents(main) {
    const todayWeekday = (new Date()).getDay();
    const todayName = DAY_NAMES[todayWeekday];

    const todayStudents = studentsData.filter(s => {
      const b = batchById(s.batchId);
      return b && b.days && b.days.includes(todayWeekday);
    });
    const regularStudents = studentsData.filter(s => !s.studentType || s.studentType === 'regular');
    const flexibleStudents = studentsData.filter(s => s.studentType === 'flexible');
    const soloStudents = studentsData.filter(s => !s.slotType || s.slotType === 'solo');
    const groupStudents = studentsData.filter(s => s.slotType && s.slotType !== 'solo');

    let displayedList = studentsData;
    if (studentViewMode === 'today') displayedList = todayStudents;
    else if (studentViewMode === 'regular') displayedList = regularStudents;
    else if (studentViewMode === 'flexible') displayedList = flexibleStudents;
    else if (studentViewMode === 'solo') displayedList = soloStudents;
    else if (studentViewMode === 'group') displayedList = groupStudents;

    let html = `
      <div class="row between" style="margin:16px 0 8px;align-items:center;">
        <h2 style="margin:0;">Student Roster</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn ghost sm" id="mergeStudentsBtn" style="border-color:var(--accent);color:var(--accent);font-weight:600;">🔗 Group Students</button>
          <button class="btn primary sm" id="addStudentBtn">+ Enroll</button>
        </div>
      </div>

      <!-- Segmented Tabs with Class Timing & Category Order -->
      <div class="segmented" style="margin:8px 0 14px;overflow-x:auto;">
        <button class="${studentViewMode === 'today' ? 'active' : ''}" data-svm="today">📅 Today (${todayName.slice(0,3)} · ${todayStudents.length})</button>
        <button class="${studentViewMode === 'all' ? 'active' : ''}" data-svm="all">🕒 All (${studentsData.length})</button>
        <button class="${studentViewMode === 'regular' ? 'active' : ''}" data-svm="regular">🎓 Regular (${regularStudents.length})</button>
        <button class="${studentViewMode === 'flexible' ? 'active' : ''}" data-svm="flexible">⚡ Flexible (${flexibleStudents.length})</button>
        <button class="${studentViewMode === 'solo' ? 'active' : ''}" data-svm="solo">👤 Solo (${soloStudents.length})</button>
        <button class="${studentViewMode === 'group' ? 'active' : ''}" data-svm="group">👫 Groups (${groupStudents.length})</button>
      </div>`;

    if (displayedList.length === 0) {
      if (studentViewMode === 'today') {
        html += `<div class="empty"><div class="big">📅</div>No batch classes scheduled for today (${todayName}).<br/><span class="muted" style="font-size:12px;">Switch to "All" or "Regular" to see all enrolled students.</span></div>`;
      } else if (studentViewMode === 'regular') {
        html += `<div class="empty"><div class="big">🎓</div>No regular batch students found.</div>`;
      } else if (studentViewMode === 'flexible') {
        html += `<div class="empty"><div class="big">⚡</div>No flexible session students found.<br/><span class="muted" style="font-size:12px;">You can set or convert any student to Flexible from "Change Timing &amp; Type".</span></div>`;
      } else if (studentViewMode === 'solo') {
        html += `<div class="empty"><div class="big">👤</div>No individual solo students enrolled yet.</div>`;
      } else if (studentViewMode === 'group') {
        html += `<div class="empty"><div class="big">👫</div>No combined sibling or group classes enrolled yet.<br/><span class="muted" style="font-size:12px;">Click "+ Enroll" or "🔗 Group Students" to combine individual students into a group.</span></div>`;
      } else {
        html += `<div class="empty"><div class="big">🎻</div>No students enrolled yet.</div>`;
      }
    } else {
      // Strict chronological sorting by class time slot (05:00 AM -> 11:00 PM)
      const sorted = displayedList.slice().sort((a, b) => {
        const timeDiff = (a.time || '').localeCompare(b.time || '');
        if (timeDiff !== 0) return timeDiff;
        return (a.name || '').localeCompare(b.name || '');
      });

      html += sorted.map(s => {
        const b = batchById(s.batchId);
        const att = s.attendance || { total: 0, present: 0, pct: null };
        const isGroup = s.slotType && s.slotType !== 'solo';
        const isFlex = s.studentType === 'flexible';
        const typeBadge = isFlex ? '<span class="badge occasional" style="font-weight:700;">⚡ Flexible</span>' : '<span class="badge regular" style="font-weight:700;">🎓 Regular Batch</span>';
        const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(s.slotType)}</span>` : '<span class="badge muted" style="font-size:11px;background:var(--bg-deep);">Solo</span>';
        const durBadge = (s.durationHours && s.durationHours > 1) ? `<span class="badge duration">⏱️ ${s.durationHours} Hours</span>` : '';
        const instBadges = (s.instruments || []).map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ");
        
        let mems = "";
        if (isGroup && s.groupMembers && s.groupMembers.length > 0) {
          mems = `<div style="background:var(--bg-deep);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:12px;border:1px solid var(--line);">
            <span style="color:var(--accent);font-weight:600;">👥 Sibling Members:</span> <b>${s.groupMembers.map(m=>escapeHtml(m.name)).join(", ")}</b>
          </div>`;
        }

        return `
          <div class="student-row">
            <div class="row between">
              <div>
                <div class="name">${escapeHtml(s.name)}</div>
                <div class="phone" style="color:var(--accent-warm);font-weight:600;font-size:13px;margin:2px 0;">
                  ⏱️ ${fmtTimeRange(s.time, s.durationHours || 1)} · <span class="muted" style="font-weight:400;">${b ? b.name + ' (' + b.sub + ')' : '—'}</span>
                </div>
                <div class="phone">${s.mobile}</div>
              </div>
              <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;">${typeBadge} ${durBadge} ${groupBadge}</div>
            </div>
            ${mems}
            ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
            ${s.currentLesson ? `<div class="muted" style="font-size:12px;margin-top:6px;">🎼 Active Lesson: <b>${escapeHtml(s.currentLesson)}</b></div>` : ''}
            ${(att.conducted > 0) ? `
              <div class="attendance-bar"><div class="attendance-fill" style="width:${att.pct}%"></div></div>
              <div class="muted" style="font-size:11px;margin-top:5px;">
                📅 <b>${att.month || 'This Month'}:</b> ${att.pct}% attendance (${att.present}/${att.conducted} conducted attended · ${att.totalScheduled} total classes in ${att.month || 'month'})
              </div>`
              : `<div class="muted" style="font-size:11px;margin-top:8px;">📅 <b>${att.month || 'This Month'}:</b> 0/${att.totalScheduled || 12} classes attended so far</div>`}
            <div class="actionrow">
              <button class="btn ghost" data-call="${s.mobile}">📞 Call</button>
              <button class="btn good" data-att-student="${s.id}">📅 Mark Attendance</button>
              <button class="btn primary" data-perf-student="${s.id}">⭐ Performance</button>
              <button class="btn ghost" data-group-student="${s.id}">🔗 Group with Sibling</button>
              <button class="btn ghost" data-edit-student="${s.id}">🕒 Change Timing &amp; Type</button>
              <button class="btn ghost" data-report-student="${s.id}">📊 Report</button>
              <button class="btn warn" data-del-student="${s.id}" data-name="${escapeHtml(s.name)}">Remove</button>
            </div>
          </div>`;
      }).join("");
    }

    main.innerHTML = html;
    document.getElementById("addStudentBtn").onclick = openAddStudentSheet;
    const mergeTopBtn = document.getElementById("mergeStudentsBtn");
    if (mergeTopBtn) mergeTopBtn.onclick = () => openMergeGroupModal(null);

    main.querySelectorAll("[data-svm]").forEach(btn => {
      btn.onclick = () => {
        studentViewMode = btn.getAttribute("data-svm");
        renderCoachTab();
      };
    });

    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });
    main.querySelectorAll("[data-att-student]").forEach(btn => btn.onclick = () => openMarkStudentAttendanceModal(btn.getAttribute("data-att-student")));
    main.querySelectorAll("[data-perf-student]").forEach(btn => btn.onclick = () => openPerformanceModal(btn.getAttribute("data-perf-student")));
    main.querySelectorAll("[data-report-student]").forEach(btn => btn.onclick = () => openAttendanceReportModal(btn.getAttribute("data-report-student"), true));
    main.querySelectorAll("[data-edit-student]").forEach(btn => btn.onclick = () => openEditStudentSheet(btn.getAttribute("data-edit-student")));
    main.querySelectorAll("[data-group-student]").forEach(btn => btn.onclick = () => openMergeGroupModal(btn.getAttribute("data-group-student")));

    main.querySelectorAll("[data-del-student]").forEach(btn => btn.onclick = async () => {
      const id = btn.getAttribute("data-del-student");
      const name = btn.getAttribute("data-name");
      if (confirm(`Remove student "${name}"? Slot will become free.`)) {
        try {
          await api.delete('/api/students/' + id);
          showToast(`${name} removed`);
          refreshStudents();
        } catch (e) {
          showToast("Error removing student");
        }
      }
    });
  }

  // ---------- SIBLING / STUDENT GROUP MERGE MODAL (SIR SETS FINAL SLOT FOR ALL) ----------
  function openMergeGroupModal(initialStudentId) {
    const cfg = configData;
    const allSlots = (cfg.slots || []).slice().sort();
    const batches = cfg.batches || DEFAULT_BATCHES;
    const allStudents = studentsData || [];

    const selectedStudentIds = new Set();
    if (initialStudentId) selectedStudentIds.add(initialStudentId);

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">🔗 Combine / Group Students</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="muted" style="font-size:12.5px;line-height:1.45;margin-bottom:12px;background:var(--bg-deep);padding:10px 12px;border-radius:8px;border:1px solid var(--line);">
        Select 2 or more students (e.g. siblings who enrolled individually). When you merge them, <b>Music Sir's assigned Batch &amp; Time Slot becomes final</b> for all members, and instant notifications will be sent to their phones.
      </div>

      <div class="field">
        <label>Select Students to Group Together (Pick 2+)</label>
        <div id="mergeStudentPicker" style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--card-solid);">
          ${allStudents.map(s => {
            const isChecked = selectedStudentIds.has(s.id);
            return `
              <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;background:${isChecked ? 'rgba(184,134,11,0.08)' : 'transparent'};">
                <input type="checkbox" value="${s.id}" class="merge-chk" ${isChecked ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--accent);" />
                <div style="flex:1;">
                  <div style="font-weight:600;font-size:13.5px;color:var(--text);">${escapeHtml(s.name)}</div>
                  <div class="muted" style="font-size:11.5px;">${s.mobile} · Current: ${s.batchId} (${fmtTime(s.time)})</div>
                </div>
              </label>`;
          }).join("")}
        </div>
      </div>

      <div class="field">
        <label>Assign Shared Batch Schedule</label>
        <div id="mergeBatchPicker">
          ${batches.map((b, i) => `
            <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
              <div class="name" style="margin:0;">${b.name}</div>
              <div class="muted" style="font-size:12px;">${b.sub}</div>
            </div>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Assigned Final Class Time Slot (5 AM – 11 PM)</label>
        <select id="mergeTimeSelect">
          ${allSlots.map(t => `<option value="${t}" ${t === '17:00' ? 'selected' : ''}>${fmtTime(t)}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Class Duration for Group</label>
        <select id="mergeDurationSelect">
          <option value="1">⏱️ 1 Hour (Standard Slot)</option>
          <option value="2" selected>⏱️ 2 Hours (Double Slot — Recommended for 2 Siblings)</option>
          <option value="3">⏱️ 3 Hours (Triple Slot — Recommended for 3 Siblings)</option>
        </select>
      </div>

      <div class="field">
        <label>Group Format Type</label>
        <select id="mergeTypeSelect">
          <option value="sibling_duo">👫 Sibling Duo (2 Members)</option>
          <option value="sibling_trio">👨‍👩‍👧 Sibling Trio (3 Members)</option>
          <option value="group">👥 Small Group Class (4 Members)</option>
        </select>
      </div>

      <button class="btn primary block" id="btnConfirmMerge" style="margin-top:14px;">Confirm &amp; Apply Final Slot to All Members</button>`;

    openSheet(html, (ov) => {
      let chosenBatch = (batches[0]) ? batches[0].id : 'batchA';

      function updateMergeTimes() {
        const dur = parseInt(ov.querySelector("#mergeDurationSelect").value) || 2;
        const available = getAvailableSlotsForBatch(chosenBatch, dur);
        const sel = ov.querySelector("#mergeTimeSelect");
        const btn = ov.querySelector("#btnConfirmMerge");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${dur}h slots in this batch</option>`;
          btn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");
          btn.disabled = false;
        }
      }

      ov.querySelectorAll("#mergeBatchPicker .batchcard").forEach(bc => {
        bc.onclick = () => {
          ov.querySelectorAll("#mergeBatchPicker .batchcard").forEach(b => b.classList.remove("selected"));
          bc.classList.add("selected");
          chosenBatch = bc.getAttribute("data-batch");
          updateMergeTimes();
        };
      });

      ov.querySelector("#mergeDurationSelect").onchange = updateMergeTimes;

      ov.querySelectorAll(".merge-chk").forEach(chk => {
        chk.onchange = () => {
          const count = ov.querySelectorAll(".merge-chk:checked").length;
          const durSel = ov.querySelector("#mergeDurationSelect");
          const typeSel = ov.querySelector("#mergeTypeSelect");
          if (count === 2) {
            if (durSel) durSel.value = "2";
            if (typeSel) typeSel.value = "sibling_duo";
          } else if (count >= 3) {
            if (durSel) durSel.value = "3";
            if (typeSel) typeSel.value = "sibling_trio";
          }
          updateMergeTimes();
        };
      });

      ov.querySelector("[data-close]").onclick = () => ov.remove();

      ov.querySelector("#btnConfirmMerge").onclick = async () => {
        const checked = Array.from(ov.querySelectorAll(".merge-chk:checked")).map(c => c.value);
        if (checked.length < 2) {
          showToast("Please select at least 2 students to merge");
          return;
        }

        const time = ov.querySelector("#mergeTimeSelect").value;
        if (!time) { showToast("Please select an available time slot"); return; }
        const durationHours = parseInt(ov.querySelector("#mergeDurationSelect").value) || checked.length;
        const slotType = ov.querySelector("#mergeTypeSelect").value;

        const btn = ov.querySelector("#btnConfirmMerge");
        btn.disabled = true;
        btn.textContent = "Merging & Updating Slots…";

        try {
          const res = await api.post('/api/students/merge-group', {
            studentIds: checked,
            batchId: chosenBatch,
            time,
            durationHours,
            slotType
          });

          ov.remove();
          showToast(res.message || "Students merged successfully!");
          await refreshSchedule();
          refreshStudents();
        } catch (err) {
          showToast(err.message || "Merge failed");
          btn.disabled = false;
          btn.textContent = "Confirm & Apply Final Slot to All Members";
        }
      };
    });
  }

  // ---------- ACTIVITY NOTIFICATIONS TAB (COACH LIVE NOTIFICATIONS STREAM) ----------
  let activityLogsData = [];
  let unreadActivityCount = 0;

  async function refreshActivityLogs() {
    try {
      const res = await api.get('/api/activity-logs');
      if (res && res.logs) {
        activityLogsData = res.logs;
        unreadActivityCount = res.unreadCount || 0;
      }
    } catch (e) {}
  }

  function formatTimeAgo(ts) {
    if (!ts) return '';
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function fmtDateTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  async function renderActivityTab(main) {
    main.innerHTML = `<div class="loading">Loading notifications…</div>`;
    await refreshActivityLogs();

    let html = `
      <div class="row between" style="margin:16px 0 10px;align-items:center;flex-wrap:wrap;gap:8px;">
        <div>
          <h2 style="margin:0;font-size:20px;">Activity Notifications (${activityLogsData.length})</h2>
          <div class="muted" style="font-size:12px;margin-top:2px;">Live audit log of all student enrollments, bookings &amp; attendance alerts</div>
        </div>
        <div class="row gap6">
          ${activityLogsData.length > 0 ? `<button class="btn ghost sm" id="btnMarkAllRead" style="font-size:11.5px;padding:6px 10px;">✓ Mark Read</button>` : ''}
          ${activityLogsData.length > 0 ? `<button class="btn warn sm" id="btnClearAllNotifs" style="font-size:11.5px;padding:6px 10px;">🗑️ Clear All</button>` : ''}
        </div>
      </div>`;

    if (activityLogsData.length === 0) {
      html += `<div class="empty"><div class="big">🔔</div>No activity notifications.<br/><span class="muted" style="font-size:12px;">When students enroll, mark attendance, or book slots, notifications will appear here in real-time.</span></div>`;
    } else {
      html += `<div style="display:flex;flex-direction:column;gap:10px;">` + activityLogsData.map(log => {
        const timeAgo = formatTimeAgo(log.created_at);
        const isUnread = log.is_read === 0;

        let icon = '🔔';
        if (log.action_type === 'enroll_request') icon = '🎓';
        else if (log.action_type === 'student_absent') icon = '⚠️';
        else if (log.action_type === 'flexible_booking') icon = '⚡';
        else if (log.action_type === 'merge_group') icon = '🔗';
        else if (log.action_type === 'timing_change') icon = '🕒';
        else if (log.action_type === 'request_approved') icon = '✓';

        return `
          <div class="card" id="notifCard-${log.id}" style="padding:14px;background:${isUnread ? 'rgba(184,134,11,0.06)' : 'var(--card-solid)'};border:1px solid ${isUnread ? 'var(--accent)' : 'var(--line)'};border-radius:12px;text-align:left;position:relative;">
            <div class="row between" style="align-items:flex-start;margin-bottom:6px;">
              <div style="display:flex;align-items:center;gap:8px;padding-right:24px;">
                <span style="font-size:18px;">${icon}</span>
                <div>
                  <div style="font-weight:700;font-size:14px;color:var(--text);">${escapeHtml(log.title)}</div>
                  <div class="muted" style="font-size:11.5px;">${timeAgo} · ${fmtDateTime(log.created_at)}</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                ${isUnread ? '<span class="badge warn" style="font-size:9.5px;">New</span>' : ''}
                <button class="btn ghost sm" data-del-notif="${log.id}" title="Dismiss notification" style="padding:2px 8px;font-size:11px;min-height:unset;height:24px;color:var(--muted);border-color:transparent;">✕</button>
              </div>
            </div>
            <div style="font-size:13px;color:var(--text-secondary);line-height:1.45;margin-top:6px;">
              ${escapeHtml(log.message)}
            </div>
            ${log.actor_mobile ? `
              <div class="actionrow" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);">
                <button class="btn ghost sm" onclick="window.location.href='${telLink(log.actor_mobile)}'">📞 Call Student</button>
                <button class="btn ghost sm" onclick="window.open('${waLink(log.actor_mobile, 'Hi ' + (log.actor_name || 'there') + ' 🎵 Music Sir here regarding your music class.')}', '_blank')">💬 WhatsApp</button>
              </div>
            ` : ''}
          </div>`;
      }).join("") + `</div>`;
    }

    main.innerHTML = html;

    const markBtn = document.getElementById("btnMarkAllRead");
    if (markBtn) {
      markBtn.onclick = async () => {
        try {
          await api.post('/api/activity-logs/read', {});
          showToast("All notifications marked as read");
          renderActivityTab(main);
        } catch (e) {}
      };
    }

    const clearAllBtn = document.getElementById("btnClearAllNotifs");
    if (clearAllBtn) {
      clearAllBtn.onclick = async () => {
        if (confirm("Permanently clear all activity notifications?")) {
          try {
            await api.del('/api/activity-logs');
            activityLogsData = [];
            showToast("All notifications cleared");
            renderActivityTab(main);
          } catch (e) {
            showToast("Failed to clear notifications");
          }
        }
      };
    }

    main.querySelectorAll("[data-del-notif]").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        const id = btn.getAttribute("data-del-notif");
        try {
          await api.del(`/api/activity-logs/${id}`);
          activityLogsData = activityLogsData.filter(l => l.id != id);
          const card = document.getElementById(`notifCard-${id}`);
          if (card) card.remove();
          showToast("Notification cleared");
          if (activityLogsData.length === 0) renderActivityTab(main);
        } catch (err) {
          showToast("Error clearing notification");
        }
      };
    });
  }

  // ---------- CHANGE / EDIT STUDENT CLASS TIMING & BATCH MODAL ----------
  function openEditStudentSheet(studentId) {
    const student = studentsData.find(s => s.id === studentId);
    if (!student) { showToast("Student not found"); return; }

    const cfg = configData;
    const allInstruments = cfg.instruments || STUDIO_INSTRUMENTS;
    const isGroup = student.slotType && student.slotType !== 'solo';
    const initialMembers = student.groupMembers || [];
    const selectedInstruments = new Set(student.instruments || []);
    let chosenBatch = student.batchId || ((cfg.batches && cfg.batches[0]) ? cfg.batches[0].id : 'batchA');
    let dur = student.durationHours || 1;

    const initialAvailable = getAvailableSlotsForBatch(chosenBatch, dur, student.id);
    // If student's current slot isn't in available (e.g. edge case), ensure it's present as first option
    if (student.time && !initialAvailable.find(a => a.time === student.time)) {
      initialAvailable.unshift({ time: student.time, label: fmtTime(student.time) + ' (Current Slot)' });
    }

    const html = `
      <div class="sheethead"><h3 style="margin:0;">🕒 Change Class Timing &amp; Student Type</h3><button class="close" data-close>✕</button></div>
      
      <div class="student-row" style="background:var(--bg-deep);margin-bottom:14px;">
        <div class="name">${escapeHtml(student.name)}</div>
        <div class="phone">${student.mobile} · Currently: ${fmtTimeRange(student.time, student.durationHours || 1)}</div>
      </div>

      <div class="field">
        <label>Student Enrollment Format</label>
        <select id="editStudentType">
          <option value="regular" ${(!student.studentType || student.studentType === 'regular') ? 'selected' : ''}>🎓 Fixed Regular Batch Student</option>
          <option value="flexible" ${student.studentType === 'flexible' ? 'selected' : ''}>⚡ Flexible Student (On-Demand Sessions)</option>
        </select>
      </div>

      <div class="field">
        <label>Select Recurring Batch</label>
        <div id="batchPickerEdit">${(cfg.batches || []).map(b => `
          <div class="batchcard ${b.id === chosenBatch ? 'selected' : ''}" data-batch="${b.id}">
            <div class="name" style="margin:0;">${b.name}</div>
            <div class="muted" style="font-size:12px;">${b.sub}</div>
          </div>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Class Duration (Hours)</label>
        <select id="editDuration">
          <option value="1" ${(dur == 1) ? 'selected' : ''}>⏱️ 1 Hour (Standard Slot)</option>
          <option value="2" ${dur == 2 ? 'selected' : ''}>⏱️ 2 Hours (Double Slot — 2 Siblings / Extended)</option>
          <option value="3" ${dur == 3 ? 'selected' : ''}>⏱️ 3 Hours (Triple Slot — 3 Siblings / Deep Study)</option>
        </select>
      </div>

      <div class="field">
        <label>Available Starting Time Slot in Selected Batch (5 AM – 11 PM)</label>
        <select id="editTime">
          ${initialAvailable.map(t => `<option value="${t.time}" ${t.time === student.time ? 'selected' : ''}>${t.label}</option>`).join("")}
        </select>
        <div class="muted" style="font-size:11.5px;margin-top:4px;">🟢 <i>Occupied slots in this batch are automatically hidden.</i></div>
      </div>

      <div class="field">
        <label>Class Slot Type</label>
        <select id="editSlotType">
          <option value="solo" ${student.slotType === 'solo' ? 'selected' : ''}>👤 Solo (1-on-1 Individual)</option>
          <option value="sibling_duo" ${student.slotType === 'sibling_duo' ? 'selected' : ''}>👫 Sibling Duo (2 Brothers / Sisters)</option>
          <option value="sibling_trio" ${student.slotType === 'sibling_trio' ? 'selected' : ''}>👨‍👩‍👧 Sibling Trio Group (3 Members)</option>
          <option value="group" ${student.slotType === 'group' ? 'selected' : ''}>👥 Small Group Class (4 Members)</option>
        </select>
      </div>

      <div id="editSiblingNamesWrap" style="display:${isGroup ? 'block' : 'none'};background:var(--bg-deep);padding:12px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;">
        <label style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:6px;display:block;">Sibling / Group Member Names</label>
        <div class="field" style="margin-bottom:8px;"><input type="text" id="editMem1" value="${escapeHtml((initialMembers[0] && initialMembers[0].name) || '')}" placeholder="Member 1 Name" /></div>
        <div class="field" style="margin-bottom:8px;"><input type="text" id="editMem2" value="${escapeHtml((initialMembers[1] && initialMembers[1].name) || '')}" placeholder="Member 2 Name" /></div>
        <div class="field" id="editMem3Field" style="margin-bottom:8px;display:${(student.slotType === 'sibling_trio' || student.slotType === 'group') ? 'block' : 'none'};"><input type="text" id="editMem3" value="${escapeHtml((initialMembers[2] && initialMembers[2].name) || '')}" placeholder="Member 3 Name" /></div>
      </div>

      <div class="field">
        <label>Instruments Learning (Select 1, 2, or 3+)</label>
        <div class="tag-select-grid" id="editInstGrid">
          ${allInstruments.map(i => `<span class="tag-item ${selectedInstruments.has(i) ? 'selected' : ''}" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
        </div>
      </div>

      <div class="field"><label>Current Active Lesson</label><input type="text" id="editLessonInput" value="${escapeHtml(student.currentLesson || '')}" placeholder="e.g. Raga Bhairav - Alankars" /></div>

      <button class="btn primary block" id="btnSaveStudentChanges">Save &amp; Update Class Timings</button>`;

    openSheet(html, (ov) => {
      const typeSelect = ov.querySelector("#editSlotType");
      const sibWrap = ov.querySelector("#editSiblingNamesWrap");
      const mem3Field = ov.querySelector("#editMem3Field");

      function updateAvailableTimeSlots() {
        const curDur = parseInt(ov.querySelector("#editDuration").value) || 1;
        const available = getAvailableSlotsForBatch(chosenBatch, curDur, student.id);
        if (student.time && !available.find(a => a.time === student.time)) {
          available.unshift({ time: student.time, label: fmtTime(student.time) + ' (Current Slot)' });
        }
        const sel = ov.querySelector("#editTime");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${curDur}h slots in this batch</option>`;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}" ${a.time === student.time ? 'selected' : ''}>${a.label}</option>`).join("");
        }
      }

      typeSelect.onchange = () => {
        const val = typeSelect.value;
        if (val === 'solo') {
          sibWrap.style.display = 'none';
        } else {
          sibWrap.style.display = 'block';
          mem3Field.style.display = (val === 'sibling_trio' || val === 'group') ? 'block' : 'none';
        }
      };

      ov.querySelectorAll("#editInstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (selectedInstruments.has(inst)) {
            selectedInstruments.delete(inst);
            item.classList.remove("selected");
          } else {
            selectedInstruments.add(inst);
            item.classList.add("selected");
          }
        };
      });

      ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateAvailableTimeSlots();
        };
      });

      ov.querySelector("#editDuration").onchange = updateAvailableTimeSlots;

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#btnSaveStudentChanges").onclick = async () => {
        const time = ov.querySelector("#editTime").value;
        if (!time) { showToast("Please select a time slot"); return; }
        const durationHours = parseInt(ov.querySelector("#editDuration").value) || 1;
        const currentLesson = ov.querySelector("#editLessonInput").value.trim();
        const slotType = typeSelect.value;
        const studentType = ov.querySelector("#editStudentType").value;

        const groupMembers = [];
        if (slotType !== 'solo') {
          const m1 = ov.querySelector("#editMem1").value.trim();
          const m2 = ov.querySelector("#editMem2").value.trim();
          const m3 = ov.querySelector("#editMem3").value.trim();
          if (m1) groupMembers.push({ name: m1 });
          if (m2) groupMembers.push({ name: m2 });
          if (m3 && (slotType === 'sibling_trio' || slotType === 'group')) groupMembers.push({ name: m3 });
        }

        try {
          await api.put('/api/students/' + studentId, {
            batchId: chosenBatch,
            time,
            durationHours,
            slotType,
            studentType,
            groupMembers,
            instruments: Array.from(selectedInstruments),
            currentLesson
          });
          ov.remove();
          showToast(`Student profile updated (${studentType === 'flexible' ? 'Flexible' : 'Regular'})!`);
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Failed to update class timing");
        }
      };
    });
  }

        </div>

      <div class="field"><label>Current Lesson / Initial Song</label><input type="text" id="stLesson" placeholder="e.g. Initial Chords / Scales / Swaras" /></div>

      <div class="field"><label>Batch Schedule</label>
        <div id="batchPicker2">${(cfg.batches || []).map((b, i) => `
          <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
            <div class="name" style="margin:0;">${b.name}</div>
            <div class="muted" style="font-size:12px;">${b.sub}</div>
          </div>`).join("")}
        </div>
      </div>

      <div class="field"><label>Available Starting Time Slot in Selected Batch (5 AM – 11 PM)</label>
        <select id="stTime">
          <option value="" disabled selected>-- Select Time Slot --</option>
        </select>
        <div class="muted" style="font-size:11.5px;margin-top:4px;">🟢 <i>Occupied slots in this batch are automatically hidden.</i></div>
      </div>

      <button class="btn primary block" id="stConfirm">Enroll Student / Sibling Group</button>`;

    openSheet(html, (ov) => {
      const cSoloInst = new Set();
      const cMem1Inst = new Set();
      const cMem2Inst = new Set();
      const cMem3Inst = new Set();

      function updateAvailableTimeSlots() {
        const curDur = parseInt(ov.querySelector("#stDuration").value) || 1;
        const available = getAvailableSlotsForBatch(chosenBatch, curDur);
        const sel = ov.querySelector("#stTime");
        const confirmBtn = ov.querySelector("#stConfirm");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${curDur}h slots in this batch</option>`;
          confirmBtn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");
          confirmBtn.disabled = false;
        }
      }

      const typeSelect = ov.querySelector("#slotTypeSelect");
      const durationSelect = ov.querySelector("#stDuration");
      const soloWrap = ov.querySelector("#coachSoloWrap");
      const sibWrap = ov.querySelector("#coachSiblingWrap");
      const mem3Card = ov.querySelector("#coachMem3Card");

      typeSelect.onchange = () => {
        const val = typeSelect.value;
        if (!val) {
          soloWrap.style.display = 'none';
          sibWrap.style.display = 'none';
        } else if (val === 'solo') {
          soloWrap.style.display = 'block';
          sibWrap.style.display = 'none';
        } else {
          soloWrap.style.display = 'none';
          sibWrap.style.display = 'block';
          mem3Card.style.display = (val === 'sibling_trio' || val === 'group') ? 'block' : 'none';
        }
        updateAvailableTimeSlots();
      };

      ov.querySelectorAll("#coachSoloInstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cSoloInst.has(inst)) { cSoloInst.delete(inst); item.classList.remove("selected"); }
          else { cSoloInst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem1InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem1Inst.has(inst)) { cMem1Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem1Inst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem2InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem2Inst.has(inst)) { cMem2Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem2Inst.add(inst); item.classList.add("selected"); }
        };
      });

      ov.querySelectorAll("#coachMem3InstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (cMem3Inst.has(inst)) { cMem3Inst.delete(inst); item.classList.remove("selected"); }
          else { cMem3Inst.add(inst); item.classList.add("selected"); }
        };
      });

      durationSelect.onchange = updateAvailableTimeSlots;

      ov.querySelectorAll("#batchPicker2 .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPicker2 .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
          updateAvailableTimeSlots();
        };
      });

      const nameInput = ov.querySelector("#stName");
      const mobileInput = ov.querySelector("#stMobile");
      if (nameInput) {
        nameInput.addEventListener("input", () => {
          const match = knownNames.find(k => k.name === nameInput.value);
          if (match) mobileInput.value = match.mobile;
        });
      }

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#stConfirm").onclick = async () => {
        const studentEnrollType = ov.querySelector("#stEnrollStudentType").value;
        const slotType = typeSelect.value;
        const time = ov.querySelector("#stTime").value;
        const durationHours = parseInt(durationSelect.value) || 0;
        const currentLesson = ov.querySelector("#stLesson").value.trim();

        if (!studentEnrollType) { showToast("Please select Student Enrollment Format"); return; }
        if (!slotType) { showToast("Please select Class Slot Type"); return; }
        if (!durationHours) { showToast("Please select Class Duration"); return; }
        if (!time) { showToast("Please select an available Time Slot"); return; }

        let name = '';
        let mobile = '';
        let groupName = '';
        const groupMembers = [];
        let allSelectedInst = [];

        if (slotType === 'solo') {
          name = nameInput.value.trim();
          mobile = mobileInput.value.trim();
          allSelectedInst = Array.from(cSoloInst);
          if (!name || normalizePhone(mobile).length < 10) {
            showToast("Enter student name and valid 10-digit mobile");
            return;
          }
        } else {
          const m1Name = ov.querySelector("#coachMem1Name").value.trim();
          const m1Mob = ov.querySelector("#coachMem1Mobile").value.trim();
          const m2Name = ov.querySelector("#coachMem2Name").value.trim();
          const m2Mob = ov.querySelector("#coachMem2Mobile").value.trim() || m1Mob;
          groupName = ov.querySelector("#coachGroupName").value.trim() || `${m1Name} & ${m2Name} Duo`;

          if (!m1Name || !m2Name) {
            showToast("Please enter names for both siblings");
            return;
          }
          if (normalizePhone(m1Mob).length < 10 && normalizePhone(m2Mob).length < 10) {
            showToast("Enter a 10-digit contact mobile number");
            return;
          }

          name = groupName;
          mobile = m1Mob || m2Mob;

          groupMembers.push({
            name: m1Name,
            mobile: m1Mob || mobile,
            instruments: Array.from(cMem1Inst)
          });

          groupMembers.push({
            name: m2Name,
            mobile: m2Mob || mobile,
            instruments: Array.from(cMem2Inst)
          });

          if (slotType === 'sibling_trio' || slotType === 'group') {
            const m3Name = ov.querySelector("#coachMem3Name").value.trim();
            const m3Mob = ov.querySelector("#coachMem3Mobile").value.trim() || mobile;
            if (m3Name) {
              groupMembers.push({
                name: m3Name,
                mobile: m3Mob,
                instruments: Array.from(cMem3Inst)
              });
            }
          }

          allSelectedInst = Array.from(new Set([...cMem1Inst, ...cMem2Inst, ...cMem3Inst]));
        }

        try {
          await api.post('/api/students', {
            name,
            mobile,
            batchId: chosenBatch,
            time,
            durationHours,
            slotType,
            groupName,
            groupMembers,
            instruments: allSelectedInst,
            currentLesson
          });
          ov.remove();
          showToast(`${name} enrolled for ${durationHours}h successfully!`);
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Enrollment failed");
        }
      };
    });
  }

  // ---------- ATTENDANCE REPORT & PDF ----------
  async function openAttendanceReportModal(studentId, isCoach) {
    const now = new Date();
    let fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
    let toDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);

    const formatISO = d => dateKey(d);

    const sheetHtml = `
      <div class="sheethead"><h3 style="margin:0;">📊 Student Report</h3><button class="close" data-close>✕</button></div>

      <div class="row gap8" style="margin-bottom:12px;">
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">From</label>
          <input type="date" id="repFrom" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(fromDate)}" />
        </div>
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">To</label>
          <input type="date" id="repTo" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(toDate)}" />
        </div>
      </div>

      <div class="quickjump" style="margin-bottom:12px;">
        <button class="chip active" id="chipThisMonth">This Month</button>
        <button class="chip" id="chipLastMonth">Last Month</button>
        <button class="chip" id="chipLast30">Last 30 Days</button>
      </div>

      <div id="reportContent"><div class="loading">Generating report…</div></div>

      <div class="actionrow" style="margin-top:16px;">
        <button class="btn primary" id="btnDownloadPdf" style="flex:1;justify-content:center;padding:12px;">📄 Download PDF</button>
        ${isCoach ? `<button class="btn good" id="btnSendWa" style="flex:1;justify-content:center;padding:12px;">💬 Send on WhatsApp</button>` : ''}
      </div>`;

    let reportData = null;

    openSheet(sheetHtml, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      const repFromInput = ov.querySelector("#repFrom");
      const repToInput = ov.querySelector("#repTo");
      const contentEl = ov.querySelector("#reportContent");

      async function fetchAndRenderReport() {
        contentEl.innerHTML = '<div class="loading">Generating report…</div>';
        try {
          const from = repFromInput.value;
          const to = repToInput.value;
          const res = await api.get(`/api/students/${studentId}/attendance-report?from=${from}&to=${to}`);
          reportData = res;

          const s = res.student;
          const sum = res.summary;
          const classes = res.classes || [];

          contentEl.innerHTML = `
            <div class="student-row" style="margin-bottom:10px;background:var(--bg-deep);">
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="phone">${s.mobile} · ${s.batchName} · ${fmtTimeRange(s.time, s.durationHours || 1)}</div>
              ${s.instruments && s.instruments.length > 0 ? `<div style="margin-top:4px;">${s.instruments.map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ")}</div>` : ''}
            </div>

            <div class="stat-grid">
              <div class="stat-box">
                <div class="val" style="color:var(--text);">${sum.totalClasses}</div>
                <div class="lbl">Classes</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--good);">${sum.presentCount}</div>
                <div class="lbl">Attended</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--accent);">${sum.attendancePct}%</div>
                <div class="lbl">Attendance</div>
              </div>
            </div>

            ${sum.avgRating ? `<div style="background:var(--card-2);padding:10px;border-radius:10px;margin-bottom:10px;text-align:center;">
              <span style="font-size:13px;color:var(--accent);">⭐ Average Performance Rating: <b>${sum.avgRating} / 5.0</b></span>
            </div>` : ''}

            <h4 style="margin:14px 0 8px;">Class Breakdown</h4>
            <div style="background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;">
              ${classes.length === 0 ? '<div class="muted" style="padding:16px;text-align:center;">No scheduled classes in this period.</div>' :
                classes.map(c => {
                  let statusTxt = c.status === 'present' ? '✓ Present' : c.status === 'absent' ? '✕ Absent' : 'Unmarked';
                  let memberBreakdown = '';
                  if (c.status === 'partial' && c.memberStatuses) {
                    const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
                    statusTxt = `Partial (${abs.length} Absent)`;
                    memberBreakdown = `<div style="font-size:11px;color:var(--accent);margin-top:2px;">Absent: ${abs.join(', ')}</div>`;
                  }

                  return `
                    <div class="history-item">
                      <div class="row between">
                        <div>
                          <div style="font-weight:600;font-size:13px;">${c.date} (${c.dayName.slice(0,3)})</div>
                          <div class="muted" style="font-size:11px;">Slot: ${fmtTimeRange(c.time, c.durationHours || 1)}</div>
                          ${memberBreakdown}
                        </div>
                        <div class="row gap6">
                          <span class="badge ${c.status}">${statusTxt}</span>
                          ${isCoach ? `
                            <button class="btn ${c.status === 'present' ? 'good' : 'ghost'}" data-rep-mark="present" data-rep-date="${c.date}" title="Mark Present" style="padding:5px 8px;font-size:11px;">✓</button>
                            <button class="btn ${c.status === 'absent' ? 'warn' : 'ghost'}" data-rep-mark="absent" data-rep-date="${c.date}" title="Mark Absent" style="padding:5px 8px;font-size:11px;">✕</button>
                          ` : ''}
                        </div>
                      </div>
                      ${c.performance ? `<div style="font-size:11.5px;color:var(--accent);margin-top:4px;">Rating: ${'★'.repeat(c.performance.ratingOverall)} ${c.performance.remarks ? `— "${escapeHtml(c.performance.remarks)}"` : ''}</div>` : ''}
                    </div>`;
                }).join("")}
            </div>`;

          if (isCoach) {
            contentEl.querySelectorAll("[data-rep-mark]").forEach(btn => {
              btn.onclick = async () => {
                const date = btn.getAttribute("data-rep-date");
                const st = btn.getAttribute("data-rep-mark");
                try {
                  await api.post('/api/attendance', { date, studentId, status: st });
                  showToast(`${st === 'present' ? '✓ Present' : '✕ Absent'} recorded for ${date}`);
                  fetchAndRenderReport();
                  await loadDataForRole();
                  renderCoachTab();
                } catch (e) {
                  showToast("Failed to update attendance");
                }
              };
            });
          }
        } catch (err) {
          contentEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load report: ${escapeHtml(err.message)}</div>`;
        }
      }

      ov.querySelector("#chipThisMonth").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipThisMonth").classList.add("active");
        repFromInput.value = formatISO(new Date(now.getFullYear(), now.getMonth(), 1));
        repToInput.value = formatISO(new Date(now.getFullYear(), now.getMonth() + 1, 0));
        fetchAndRenderReport();
      };

      ov.querySelector("#chipLastMonth").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipLastMonth").classList.add("active");
        repFromInput.value = formatISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
        repToInput.value = formatISO(new Date(now.getFullYear(), now.getMonth(), 0));
        fetchAndRenderReport();
      };

      ov.querySelector("#chipLast30").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipLast30").classList.add("active");
        const d30 = new Date(now);
        d30.setDate(d30.getDate() - 30);
        repFromInput.value = formatISO(d30);
        repToInput.value = formatISO(now);
        fetchAndRenderReport();
      };

      repFromInput.onchange = fetchAndRenderReport;
      repToInput.onchange = fetchAndRenderReport;

      function generatePdfDocument() {
        if (!reportData || !window.jspdf) {
          showToast("PDF generator loading, try again in a moment");
          return null;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = reportData.student;
        const sum = reportData.summary;
        const range = reportData.range;

        // Header
        doc.setFillColor(18, 48, 43);
        doc.rect(0, 0, 210, 36, 'F');
        doc.setTextColor(243, 238, 221);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(20);
        doc.text('Music Slot Booking — Music Academy', 14, 18);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(159, 189, 178);
        doc.text('STUDENT PROGRESS & ATTENDANCE REPORT (5 AM - 11 PM)', 14, 26);

        // Details
        doc.setTextColor(30, 30, 30);
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.text(`Student: ${s.name}`, 14, 48);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(`Mobile: +91 ${s.mobile} · Studio Helpline: +91 ${COACH_PRIMARY_MOBILE}`, 14, 55);
        doc.text(`Batch: ${s.batchName} (${s.batchSub})`, 14, 62);
        doc.text(`Class Slot: ${fmtTimeRange(s.time, s.durationHours || 1)} · ${slotTypeLabel(s.slotType)}`, 14, 69);
        if (s.instruments && s.instruments.length > 0) {
          doc.text(`Instruments Learning: ${s.instruments.join(', ')}`, 14, 76);
        }

        // Summary Box
        doc.setFillColor(240, 245, 243);
        doc.roundedRect(120, 46, 76, 34, 3, 3, 'F');
        doc.setTextColor(18, 48, 43);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text(`Attendance Rate: ${sum.attendancePct}%`, 124, 54);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text(`Attended: ${sum.presentCount} / ${sum.totalClasses} classes`, 124, 61);
        doc.text(`Missed: ${sum.absentCount} classes`, 124, 67);
        if (sum.avgRating) {
          doc.setFont('helvetica', 'bold');
          doc.text(`Performance: ${sum.avgRating} / 5.0 Stars`, 124, 74);
        }

        // Table
        const tableRows = (reportData.classes || []).map((c, idx) => {
          let stLabel = c.status === 'present' ? 'Present (✓)' : c.status === 'absent' ? 'Absent (✕)' : 'Unmarked';
          if (c.status === 'partial' && c.memberStatuses) {
            const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
            stLabel = `Partial (${abs.join(', ')} absent)`;
          }

          return [
            idx + 1,
            c.date,
            c.dayName,
            fmtTimeRange(c.time, c.durationHours || 1),
            stLabel,
            c.performance ? `${c.performance.ratingOverall}★ (${c.performance.remarks || 'Evaluated'})` : '—'
          ];
        });

        doc.autoTable({
          startY: 85,
          head: [['#', 'Date', 'Day', 'Class Slot', 'Attendance', 'Performance / Remarks']],
          body: tableRows,
          theme: 'striped',
          headStyles: { fillColor: [28, 64, 56], textColor: [243, 238, 221], fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [248, 250, 249] },
          styles: { fontSize: 8.5, cellPadding: 3 }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
          doc.setPage(i);
          doc.setFontSize(8);
          doc.setTextColor(130);
          doc.text(`Music Slot Booking Progress Report • Page ${i} of ${pageCount}`, 14, 288);
        }

        return doc;
      }

      ov.querySelector("#btnDownloadPdf").onclick = () => {
        const doc = generatePdfDocument();
        if (doc) {
          const fileName = `MusicSlot_Report_${reportData.student.name.replace(/\s+/g, '_')}.pdf`;
          doc.save(fileName);
          showToast("PDF report downloaded!");
        }
      };

      if (isCoach && ov.querySelector("#btnSendWa")) {
        ov.querySelector("#btnSendWa").onclick = () => {
          if (!reportData) return;
          const s = reportData.student;
          const sum = reportData.summary;
          const range = reportData.range;

          const doc = generatePdfDocument();
          if (doc) doc.save(`MusicSlot_Report_${s.name.replace(/\s+/g, '_')}.pdf`);

          const msg = `🎼 *Music Slot Booking — Student Progress Report*\n\n` +
            `👤 *Student:* ${s.name}\n` +
            `📅 *Period:* ${range.from} to ${range.to}\n` +
            `🎹 *Batch:* ${s.batchName} (${fmtTimeRange(s.time, s.durationHours || 1)})\n` +
            (s.instruments && s.instruments.length > 0 ? `🎵 *Learning:* ${s.instruments.join(', ')}\n\n` : '\n') +
            `📊 *Progress Summary:*\n` +
            `• Attendance: *${sum.attendancePct}%* (${sum.presentCount}/${sum.totalClasses} classes attended)\n` +
            (sum.avgRating ? `• Performance Rating: *${sum.avgRating} / 5.0 ⭐*\n` : '') +
            (s.currentLesson ? `• Active Lesson: _${s.currentLesson}_\n\n` : '\n') +
            `📄 _The detailed PDF report is downloaded and attached._ Keep practicing music with joy! 🎶`;

          window.open(waLink(s.mobile, msg), '_blank');
          showToast("PDF downloaded & WhatsApp opened!");
        };
      }

      fetchAndRenderReport();
    });
  }

      const listEl = ov.querySelector("#makeupSlotList");

      try {
        const res = await api.get('/api/makeup-slots');
        const slots = res.makeupSlots || [];

        if (slots.length === 0) {
          listEl.innerHTML = `
            <div class="empty" style="padding:24px 10px;">

            </div>`;

        }

          <div class="slot makeup-open" style="margin-bottom:8px;">
            <div class="row between">
              <div>
                <div class="time" style="color:var(--makeup);">${mk.date_key} · ${fmtTimeRange(mk.time_slot, mk.duration_hours || 1)}</div>

                Claim Slot
              </button>
            </div>
          </div>`).join("");

        listEl.querySelectorAll("[data-claim-mk]").forEach(btn => {
          btn.onclick = async () => {
            const mkId = btn.getAttribute("data-claim-mk");
            const date = btn.getAttribute("data-date");
            const time = btn.getAttribute("data-time");

      } catch (e) {
        listEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load make-up slots</div>`;

    });
  }

  // Sheets & Autocomplete
  function openSheet(innerHtml, onMount) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet">${innerHtml}</div>`;
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    if (onMount) onMount(overlay);
    return overlay;
  }

  function nameAutocompleteDatalist(id) {
    return `<datalist id="${id}">${knownNames.map(k => `<option value="${escapeHtml(k.name)}" data-mobile="${k.mobile}"></option>`).join("")}</datalist>`;
  }

  function openBookSheet(time, key) {
    const cfg = configData;
    const allInstruments = cfg.instruments || STUDIO_INSTRUMENTS;
    const batches = cfg.batches || DEFAULT_BATCHES;
    let bookingType = "flexible"; // "flexible" | "regular"
    let chosenBatch = batches[0] ? batches[0].id : 'batchA';
    const selectedInstruments = new Set();

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">Book Class Slot (${fmtTime(time)})</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="segmented" style="margin:6px 0 14px;">
        <button id="bkTabFlex" class="active">Flexible Single Session</button>
        <button id="bkTabReg">Fixed Regular Batch</button>
      </div>

      <div class="field">
        <label>Student / Family Name</label>
        <input type="text" id="bkName" list="bkNameList" placeholder="Enter student or family name"/>
        ${nameAutocompleteDatalist('bkNameList')}
      </div>

      <div class="field">
        <label>Mobile Number</label>
        <input type="tel" id="bkMobile" placeholder="10-digit mobile number"/>
      </div>

      <div class="field">
        <label>Class Duration</label>
        <select id="bkDuration">
          <option value="1">1 Hour (Standard Slot)</option>
          <option value="2">2 Hours (Double Slot / Siblings)</option>
          <option value="3">3 Hours (Triple Slot)</option>
        </select>
      </div>

      <div class="field">
        <label>Class Slot Format</label>
        <select id="bkSlotType">
          <option value="solo">Solo (1-on-1 Individual)</option>
          <option value="sibling_duo">Sibling Duo (2 Members)</option>
          <option value="sibling_trio">Sibling Trio (3 Members)</option>
          <option value="group">Group Class (4 Members)</option>
        </select>
      </div>

      <div class="field">
        <label>Instrument(s)</label>
        <div class="tag-select-grid" id="bkInstGrid">
          ${allInstruments.map(i => `<span class="tag-item" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
        </div>
      </div>

      <!-- Regular Batch Specific Fields -->
      <div id="bkRegFields" style="display:none;background:var(--bg-deep);padding:12px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;">
        <div class="field">
          <label>Assign to Recurring Batch Days</label>
          <div id="bkBatchPicker">
            ${batches.map((b, i) => `
              <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
                <div class="name" style="margin:0;">${b.name}</div>
                <div class="muted" style="font-size:12px;">${b.sub}</div>
              </div>`).join("")}
          </div>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label>Current Lesson / Song (Optional)</label>
          <input type="text" id="bkLesson" placeholder="e.g. Basic Scales / Swaras" />
        </div>
      </div>

      <!-- Flexible Date Specific Fields -->
      <div id="bkFlexFields" style="background:var(--bg-deep);padding:12px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;">
        <div class="field" style="margin-bottom:0;">
          <label>Flexible Booking Date</label>
          <input type="date" id="bkDate" value="${key}" />
        </div>
      </div>

      <button class="btn primary block" id="bkConfirm" style="margin-top:14px;">Confirm &amp; Reserve Slot</button>`;

    openSheet(html, (ov) => {
      const tabFlex = ov.querySelector("#bkTabFlex");
      const tabReg = ov.querySelector("#bkTabReg");
      const flexFields = ov.querySelector("#bkFlexFields");
      const regFields = ov.querySelector("#bkRegFields");
      const nameInput = ov.querySelector("#bkName");
      const mobileInput = ov.querySelector("#bkMobile");
      const durSelect = ov.querySelector("#bkDuration");
      const slotTypeSelect = ov.querySelector("#bkSlotType");
      const dateInput = ov.querySelector("#bkDate");
      const lessonInput = ov.querySelector("#bkLesson");
      const confirmBtn = ov.querySelector("#bkConfirm");

      function updateNameDatalist() {
        const listEl = ov.querySelector("#bkNameList");
        if (!listEl) return;
        if (bookingType === "regular") {
          const regStudents = (studentsData || []).filter(s => !s.studentType || s.studentType === 'regular');
          listEl.innerHTML = regStudents.map(s => {
            const b = batchById(s.batchId);
            return `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)} (${b ? b.name : s.batchId} · ${fmtTime(s.time)})</option>`;
          }).join("");
        } else {
          listEl.innerHTML = knownNames.map(k => `<option value="${escapeHtml(k.name)}"></option>`).join("");
        }
      }

      tabFlex.onclick = () => {
        bookingType = "flexible";
        tabFlex.className = "active";
        tabReg.className = "";
        flexFields.style.display = "block";
        regFields.style.display = "none";
        confirmBtn.textContent = "Confirm Flexible Session Booking";
        updateNameDatalist();
      };

      tabReg.onclick = () => {
        bookingType = "regular";
        tabReg.className = "active";
        tabFlex.className = "";
        flexFields.style.display = "none";
        regFields.style.display = "block";
        confirmBtn.textContent = "Enroll as Fixed Regular Batch Student";
        updateNameDatalist();
      };

      // Autocomplete lookup & smart autofill for regular students
      nameInput.addEventListener("input", () => {
        const val = nameInput.value.trim().toLowerCase();
        if (bookingType === "regular") {
          const match = (studentsData || []).find(s => s.name.toLowerCase() === val);
          if (match) {
            mobileInput.value = match.mobile;
            if (match.batchId) {
              chosenBatch = match.batchId;
              ov.querySelectorAll("#bkBatchPicker .batchcard").forEach(b => {
                b.classList.toggle("selected", b.getAttribute("data-batch") === chosenBatch);
              });
            }
            if (match.durationHours) durSelect.value = match.durationHours.toString();
            if (match.slotType) slotTypeSelect.value = match.slotType;
            if (match.instruments && Array.isArray(match.instruments)) {
              selectedInstruments.clear();
              match.instruments.forEach(i => selectedInstruments.add(i));
              ov.querySelectorAll("#bkInstGrid .tag-item").forEach(tag => {
                const inst = tag.getAttribute("data-inst");
                tag.classList.toggle("selected", selectedInstruments.has(inst));
              });
            }
          }
        } else {
          const match = knownNames.find(k => k.name.toLowerCase() === val);
          if (match) mobileInput.value = match.mobile;
        }
      });

      // Instrument chips toggle
      ov.querySelectorAll("#bkInstGrid .tag-item").forEach(tag => {
        tag.onclick = () => {
          const inst = tag.getAttribute("data-inst");
          if (selectedInstruments.has(inst)) {
            selectedInstruments.delete(inst);
            tag.classList.remove("selected");
          } else {
            selectedInstruments.add(inst);
            tag.classList.add("selected");
          }
        };
      });

      // Batch cards toggle
      ov.querySelectorAll("#bkBatchPicker .batchcard").forEach(bc => {
        bc.onclick = () => {
          ov.querySelectorAll("#bkBatchPicker .batchcard").forEach(b => b.classList.remove("selected"));
          bc.classList.add("selected");
          chosenBatch = bc.getAttribute("data-batch");
        };
      });

      ov.querySelector("[data-close]").onclick = () => ov.remove();

      confirmBtn.onclick = async () => {
        const name = nameInput.value.trim();
        const mobile = mobileInput.value.trim();
        const durationHours = parseInt(durSelect.value) || 1;
        const slotType = slotTypeSelect.value || 'solo';
        const instruments = Array.from(selectedInstruments);

        if (!name) { showToast("Please enter a student name"); return; }
        if (normalizePhone(mobile).length < 10) { showToast("Please enter a valid 10-digit mobile number"); return; }

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Reserving…";

        try {
          if (bookingType === "regular") {
            // Enroll/Save Regular Batch Student
            await api.post('/api/students', {
              name,
              mobile,
              batchId: chosenBatch,
              time: time,
              durationHours,
              slotType,
              instruments,
              currentLesson: lessonInput ? lessonInput.value.trim() : ''
            });
            ov.remove();
            showToast(`Enrolled ${name} into ${chosenBatch} at ${fmtTime(time)}!`);
            await refreshSchedule();
            refreshStudents();
          } else {
            // Book Flexible Single Session
            const bDate = dateInput ? dateInput.value : key;
            await api.post('/api/bookings', {
              name,
              mobile,
              date: bDate,
              time: time,
              durationHours,
              slotType,

          name: m2Name,
          mobile: m2Mob,
          instruments: Array.from(reqMem2Inst)
        });

        if (slotType === 'sibling_trio') {
          const m3Name = document.getElementById("reqMem3Name").value.trim();
          const m3Mob = document.getElementById("reqMem3Mobile").value.trim() || applicantMobile;
          if (!m3Name) { showToast("Please enter Sibling 3's Full Name"); return; }
          groupMembers.push({
            name: m3Name,
            mobile: m3Mob,
            instruments: Array.from(reqMem3Inst)
          });
        }

        allSelectedInst = Array.from(new Set([...reqMem1Inst, ...reqMem2Inst, ...reqMem3Inst]));
      }

      const sendBtn = document.getElementById("reqSend");
      sendBtn.disabled = true;
      sendBtn.textContent = "Submitting…";

      try {
        await api.post('/api/requests', {
          name,
          mobile,
          note,
          durationHours,
          slotType,
          groupName,
          groupMembers,
          instruments: allSelectedInst
        });
        showToast(`Application submitted! Music Sir will assign your slot.`);
        await loadDataForRole();
        render();
      } catch (err) {
        showToast(err.message || "Failed to submit application");
        sendBtn.disabled = false;
        sendBtn.textContent = "Submit Application to Music Sir";
      }
    };
  }

  // Start App
  initApp();
})();
</script>
</body>
</html>
