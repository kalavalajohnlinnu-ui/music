<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" async></script>
<style>
  /* ═══════════ ULTRA-LUXURY BRIGHT DAYLIGHT DESIGN SYSTEM ═══════════ */
  :root{
    --bg:#FAF8F3;
    --bg-deep:#F2ECE0;
    --card:rgba(255,255,255,0.94);
    --card-solid:#FFFFFF;
    --card-2:rgba(247,243,234,0.96);
    --line:rgba(184,134,11,0.16);
    --line-strong:rgba(184,134,11,0.32);
    --line-gold:linear-gradient(90deg, rgba(184,134,11,0), rgba(184,134,11,0.4), rgba(184,134,11,0));
    --text:#181612;
    --text-secondary:#454035;
    --muted:#756E5F;
    --accent:#B8860B;
    --accent-warm:#D4AF37;
    --accent-gold-light:#F3E5AB;
    --accent-deep:#876203;
    --accent-ink:#FFFFFF;
    --accent2:#C05621;
    --good:#167338;
    --good-bg:rgba(22,115,56,0.10);
    --good-border:rgba(22,115,56,0.25);
    --bad:#C53030;
    --bad-bg:rgba(197,48,48,0.10);
    --bad-border:rgba(197,48,48,0.25);
    --makeup:#1565C0;
    --makeup-bg:rgba(21,101,192,0.10);
    --makeup-border:rgba(21,101,192,0.25);
    --group-color:#6F42C1;
    --group-bg:rgba(111,66,193,0.10);
    --group-border:rgba(111,66,193,0.25);
    --radius:18px;
    --radius-lg:24px;
    --radius-sm:10px;
    --glass:rgba(255,255,255,0.88);
    --glass-border:rgba(184,134,11,0.18);
    --glow:0 2px 20px rgba(184,134,11,0.08);
    --glow-accent:0 6px 24px rgba(184,134,11,0.3);
    --shadow-card:0 2px 4px rgba(60,45,20,0.03), 0 8px 24px -4px rgba(60,45,20,0.07), 0 18px 40px -8px rgba(184,134,11,0.05);
    --shadow-hover:0 4px 8px rgba(60,45,20,0.04), 0 14px 32px -4px rgba(60,45,20,0.10), 0 24px 48px -6px rgba(184,134,11,0.12);
    --shadow-sheet:0 -12px 48px rgba(50,35,15,0.16), 0 -2px 16px rgba(184,134,11,0.08);
    --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-fluid:cubic-bezier(0.16, 1, 0.3, 1);
    --ease-bounce:cubic-bezier(0.68, -0.6, 0.32, 1.6);
    --transition-fast:180ms var(--ease-fluid);
    --transition-smooth:320ms var(--ease-fluid);
    --transition-spring:450ms var(--ease-spring);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; scroll-behavior:smooth; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', 'Inter', system-ui, sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ═══════════ LUMINOUS AMBIENT LIGHT MESH ═══════════ */
  body::before{
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(212,175,55,0.14) 0%, transparent 65%),
      radial-gradient(ellipse 70% 50% at 90% 95%, rgba(220,160,80,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 10% 80%, rgba(184,134,11,0.08) 0%, transparent 50%),
      radial-gradient(ellipse 50% 30% at 50% 50%, rgba(243,229,171,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  #particles-canvas{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }

  #app{
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* ═══════════ ULTRA-LUXURY HEADER ═══════════ */
  header.top{
    padding: 20px 18px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(250,248,243,0.98) 70%, rgba(250,248,243,0.85) 90%, transparent);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 3px;
  }

  .brand-logo{
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid rgba(184,134,11,0.35);
    box-shadow: 0 2px 6px rgba(184,134,11,0.18);
    flex-shrink: 0;
  }

  .login-app-logo{
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid rgba(184,134,11,0.45);
    box-shadow: 0 8px 24px rgba(184,134,11,0.22);
    margin: 0 auto 12px;
    display: block;
  }

  .brand .mark{
    font-family: 'Bodoni Moda', 'Fraunces', serif;
    font-weight: 700;
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 45%, var(--accent-warm) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
    filter: drop-shadow(0 2px 8px rgba(184,134,11,0.15));
  }

  .brand .tag{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .whoami{
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
  }

  .whoami button{
    background: rgba(184,134,11,0.06);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    position: relative;
    transition: all var(--transition-spring);
  }

  .whoami button:hover{
    background: rgba(184,134,11,0.14);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* ═══════════ ANIMATED MUSICAL EQUALIZER ═══════════ */
  .equalizer{
    display: flex;
    align-items: flex-end;
    gap: 3.5px;
    height: 22px;
    margin: 10px 0 2px;
    padding: 0 2px;
  }

  .eq-bar{
    width: 4px;
    border-radius: 4px 4px 1.5px 1.5px;
    background: rgba(184,134,11,0.14);
    transition: background 0.4s ease, height 0.6s var(--ease-spring);
    position: relative;
  }

  .eq-bar.filled-regular{
    background: linear-gradient(180deg, var(--accent-warm), var(--accent));
    box-shadow: 0 0 6px rgba(184,134,11,0.35);
    animation: eqHarmonic 2.4s ease-in-out infinite alternate;
  }

  .eq-bar:nth-child(2).filled-regular{ animation-delay: 0.2s; }
  .eq-bar:nth-child(3).filled-regular{ animation-delay: 0.4s; }
  .eq-bar:nth-child(4).filled-regular{ animation-delay: 0.15s; }
  .eq-bar:nth-child(5).filled-regular{ animation-delay: 0.5s; }
  .eq-bar:nth-child(6).filled-regular{ animation-delay: 0.3s; }
  .eq-bar:nth-child(7).filled-regular{ animation-delay: 0.6s; }

  @keyframes eqHarmonic{
    0%{ transform: scaleY(0.75); opacity: 0.8; }
    100%{ transform: scaleY(1.15); opacity: 1; filter: brightness(1.08); }
  }

  .eq-bar.filled-occasional{
    background: linear-gradient(180deg, var(--accent2), #9A451A);
  }

  .eq-bar.filled-makeup{
    background: linear-gradient(180deg, var(--makeup), #0D47A1);
  }

  /* ═══════════ MAIN CONTENT ═══════════ */
  main{ flex: 1; padding: 6px 16px 110px; }

  /* ═══════════ LUXURY TYPOGRAPHY ═══════════ */
  h1, h2, h3, h4{
    font-family: 'Bodoni Moda', 'Fraunces', serif;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .muted{ color: var(--muted); }

  /* ═══════════ LAYOUT HELPERS ═══════════ */
  .row{ display: flex; align-items: center; }
  .between{ justify-content: space-between; }
  .gap6{ gap: 6px; } .gap8{ gap: 8px; } .gap12{ gap: 12px; }

  /* ═══════════ DATE NAVIGATOR (Luminous Luxury Card) ═══════════ */
  .datenav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 12px 10px;
    margin: 12px 0 14px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    transition: all var(--transition-smooth);
  }

  .datenav:hover{
    box-shadow: var(--shadow-hover);
    border-color: var(--line-strong);
  }

  .datenav button.arrow{
    background: rgba(184,134,11,0.06);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 20px;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    cursor: pointer;
    transition: all var(--transition-spring);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(60,45,20,0.03);
  }

  .datenav button.arrow:hover{
    background: rgba(184,134,11,0.16);
    border-color: var(--accent);
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(184,134,11,0.2);
  }

  .datenav button.arrow:active{
    transform: scale(0.92);
  }

  .datenav .dateinfo{ text-align: center; flex: 1; position: relative; z-index: 1; }
  .datenav .dateinfo .big{
    font-family: 'Bodoni Moda', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .datenav .dateinfo .small{
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ CHIP / FILTER PILLS ═══════════ */
  .quickjump{ display: flex; gap: 6px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }

  .chip{
    border: 1px solid var(--line);
    background: #FFFFFF;
    color: var(--text-secondary);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all var(--transition-spring);
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(60,45,20,0.03);
  }

  .chip:hover{
    border-color: var(--accent);
    color: var(--accent-deep);
    transform: translateY(-1.5px);
    box-shadow: 0 4px 12px rgba(184,134,11,0.15);
  }
  .chip:active{ transform: scale(0.95); }

  .chip.active{
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-warm) 100%);
    color: #FFFFFF;
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(184,134,11,0.35);
  }

  /* ═══════════ SUMMARY STATS ═══════════ */
  .summary{ display: flex; gap: 8px; margin-bottom: 16px; }

  .summary .s{
    flex: 1;
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
  }

  .summary .s:hover{
    border-color: var(--line-strong);
    transform: translateY(-2.5px);
    box-shadow: var(--shadow-hover);
  }

  .summary .s .num{
    font-family: 'Bodoni Moda', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-deep);
  }
  .summary .s .lbl{
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ LUXURY SLOT & CLASS CARD ═══════════ */
  .slot{
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
    position: relative;
    overflow: hidden;
    animation: cardSlideIn 0.45s var(--ease-spring) both;
  }

  .slot:hover{
    border-color: var(--line-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) scale(1.006);
  }

  @keyframes cardSlideIn{
    from{ opacity: 0; transform: translateY(16px) scale(0.97); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .slot.free{
    border-style: dashed;
    border-color: rgba(184,134,11,0.32);
    background: rgba(255,255,255,0.78);
  }

  .slot.free:hover{
    border-color: var(--accent);
    background: #FFFFFF;
  }

  .slot.makeup-open{
    border-style: dashed;
    border-color: rgba(21,101,192,0.4);
    background: rgba(21,101,192,0.04);
  }

  .slot.slot-continuation{
    background: rgba(247,243,234,0.9);
    border-left: 4px solid var(--accent);
    margin-top: -6px;
  }

  .slot .time{
    font-family: 'Bodoni Moda', serif;
    font-size: 17px;
    color: var(--accent-deep);
    min-width: 70px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  /* ═══════════ BADGE SYSTEM ═══════════ */
  .badge{
    font-size: 9.5px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
    font-family: 'Jost', sans-serif;
    transition: all var(--transition-fast);
  }

  .badge.regular{
    background: rgba(184,134,11,0.12);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.26);
  }

  .badge.occasional{
    background: rgba(192,86,33,0.12);
    color: var(--accent2);
    border: 1px solid rgba(192,86,33,0.26);
  }

  .badge.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .badge.group{
    background: var(--group-bg);
    color: var(--group-color);
    border: 1px solid var(--group-border);
  }

  .badge.duration{
    background: rgba(184,134,11,0.12);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.26);
  }

  .badge.absent{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .badge.present{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .badge.partial{
    background: rgba(184,134,11,0.15);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.3);
  }

  .badge.pending{
    background: rgba(184,134,11,0.14);
    color: var(--accent-deep);
  }

  .badge.tagchip{
    background: #FFFFFF;
    color: var(--text-secondary);
    border: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0.02em;
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  /* ═══════════ TEXT ELEMENTS ═══════════ */
  .name{
    font-size: 16.5px;
    font-weight: 700;
    margin: 6px 0 2px;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .phone{
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  /* ═══════════ ACTION ROW ═══════════ */
  .actionrow{ display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }

  /* ═══════════ ULTRA-LUXURY BUTTONS ═══════════ */
  .btn{
    border: none;
    border-radius: 13px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-spring);
    font-family: 'Jost', sans-serif;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .btn:active{ transform: translateY(1.5px) scale(0.96); }
  .btn:disabled{ opacity: 0.4; cursor: default; transform: none; }

  .btn.primary{
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-warm) 50%, var(--accent) 100%);
    background-size: 200% auto;
    color: #FFFFFF;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(184,134,11,0.3), 0 2px 4px rgba(184,134,11,0.15);
  }

  .btn.primary:hover{
    box-shadow: 0 6px 24px rgba(184,134,11,0.42);
    transform: translateY(-1.5px);
  }

  .btn.ghost{
    background: rgba(184,134,11,0.07);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  .btn.ghost:hover{
    background: rgba(184,134,11,0.15);
    border-color: var(--accent);
    transform: translateY(-1.5px);
    box-shadow: 0 3px 10px rgba(184,134,11,0.12);
  }

  .btn.warn{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .btn.warn:hover{ border-color: var(--bad); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(197,48,48,0.15); }

  .btn.good{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .btn.good:hover{ border-color: var(--good); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(22,115,56,0.15); }

  .btn.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .btn.block{ width: 100%; justify-content: center; padding: 14px; font-size: 15px; font-weight: 700; }

  /* ═══════════ FORM FIELDS (Crisp Luxury Inputs) ═══════════ */
  .field{ margin-bottom: 15px; }

  .field label{
    display: block;
    font-size: 11px;
    color: var(--accent-deep);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }

  .field input, .field select, .field textarea{
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--line-strong);
    color: var(--text);
    padding: 12px 15px;
    border-radius: 13px;
    font-size: 14.5px;
    font-family: 'Jost', sans-serif;
    outline: none;
    transition: all var(--transition-smooth);
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px rgba(184,134,11,0.18);
  }

  .field textarea{ resize: vertical; min-height: 80px; }

  /* ═══════════ BOTTOM NAVIGATION ═══════════ */
  nav.bottom{
    position: fixed;
    bottom: 0;

<!-- Elegant Ambient Champagne Light Particle Canvas -->
<canvas id="particles-canvas"></canvas>
<div id="app"><div class="loading">Connecting to Music Slot studio…</div></div>

<!-- Ambient Champagne Light Particle System -->
<script>
(function(){
  const c = document.getElementById('particles-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  let w, h, particles = [];
  const PARTICLE_COUNT = 36;
  let mouse = { x: -1000, y: -1000, radius: 140 };

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  function resize(){
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }

  function createParticle(initial = false){
    return {
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + 20,
      size: Math.random() * 2.2 + 0.8,
      speedX: (Math.random() - 0.5) * 0.35,
      speedY: -(Math.random() * 0.45 + 0.12),
      opacity: Math.random() * 0.32 + 0.12,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.02 + 0.008,
      ringSize: Math.random() * 12 + 6,
      hasRing: Math.random() < 0.25
    };
  }

  function init(){
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle(true));
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){
      p.x += p.speedX;
      p.y += p.speedY;
      p.pulse += p.pulseSpeed;

      // Mouse interactive force field (gentle push)
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius && dist > 0){
        const force = (mouse.radius - dist) / mouse.radius;
        p.x += (dx / dist) * force * 1.5;
        p.y += (dy / dist) * force * 1.5;
      }

      const op = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));

      if (p.y < -30 || p.x < -30 || p.x > w + 30){
        Object.assign(p, createParticle(false));
      }

      // Golden micro-orb
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(184, 134, 11, ${op})`;
      ctx.fill();

      // Soft ambient glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(212, 175, 55, ${op * 0.18})`;
      ctx.fill();

      // Delicate golden ring
      if (p.hasRing) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.ringSize, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(184, 134, 11, ${op * 0.12})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

  function isSameDay(a, b){ return dateKey(a) === dateKey(b); }
  function fmtTime(t){
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const ap = h >= 12 ? "PM" : "AM";
    let hh = h % 12;
    if (hh === 0) hh = 12;
    return hh + ":" + pad(m) + " " + ap;
  }
  function addHours(t, hours){
    if (!t) return "";
    const [h, m] = t.split(":").map(Number);
    const endH = Math.min(23, h + (hours || 1));
    return pad(endH) + ":" + pad(m);
  }
  function fmtTimeRange(start, duration = 1){
    const end = addHours(start, duration);
    return `${fmtTime(start)} – ${fmtTime(end)} (${duration}h)`;
  }
  function fmtDateLong(d){ return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }); }

    const slots = [];
    for (let i = 0; i < dur; i++) {

      try {
        const res = await fetch(url, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Server request failed');
        return data;
      } catch (err) {
        console.error('API error:', err);
        throw err;
      }
    },
    get(url) { return this.request(url, { method: 'GET' }); },
    post(url, body) { return this.request(url, { method: 'POST', body: JSON.stringify(body) }); },
    put(url, body) { return this.request(url, { method: 'PUT', body: JSON.stringify(body) }); },
    delete(url) { return this.request(url, { method: 'DELETE' }); },

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function syncPushSubscription(swReg, user) {
    try {

      if (sub && user) {
        await api.post('/api/push/subscribe', {
          subscription: sub,
          userId: user.id || '',

        });

  async function requestPushPermissionAndSubscribe(user) {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      showToast('Push notifications not supported on this browser');
      return false;
    }

    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        localStorage.setItem('sur_notif_pref', 'denied');
        showToast('Notification permission was not granted');
        return false;
      }

      localStorage.setItem('sur_notif_pref', 'enabled');
      const swReg = await navigator.serviceWorker.ready;
      let subscription = await swReg.pushManager.getSubscription();

      if (!subscription) {
        subscription = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }

      if (subscription) {
        await api.post('/api/push/subscribe', {
          subscription: subscription,
          userId: user ? (user.id || '') : '',
          name: user ? (user.name || '') : '',
          mobile: user ? (user.mobile || '') : '',
          role: user ? (user.role || 'student') : 'student'
        });
        showToast('🔔 Class reminders & alerts enabled!');
        const banner = document.getElementById('notifPromptBanner');
        if (banner) banner.remove();
        return true;
      }
    } catch (err) {
      console.error('Subscription error:', err);
      showToast('Could not enable push: ' + err.message);
      return false;
    }
  }

            if (dl) dl.innerHTML = knownNames.map(k => `<option value="${escapeHtml(k.name)}"></option>`).join("");
          }
        }).catch(() => {});
      }

      const doStudentLogin = async () => {
        const identifier = idInput.value.trim();
        if (!identifier) { showToast("Please enter your Student Name or Mobile"); return; }
        submitBtn.disabled = true;
        submitBtn.textContent = "Accessing Profile…";
        try {
          const res = await api.post('/api/auth/student/login', { identifier });
          authToken = res.token;
          localStorage.setItem('sir_token', authToken);
          currentUser = { role: 'student', status: res.status, ...res.user };
          await loadDataForRole();
          render();
          showToast(`Welcome ${currentUser.name || 'to Music Slot Booking'}!`);
        } catch (err) {
          showToast(err.message || "Login failed");
          submitBtn.disabled = false;
          submitBtn.textContent = "Enter Student Portal";
        }
      };

      submitBtn.onclick = doStudentLogin;
      idInput.onkeydown = (e) => { if (e.key === 'Enter') doStudentLogin(); };

      // Flexible / Free Slot Booking Portal
      renderFlexibleSlotViewerInContainer(container);

  function renderCoachTab() {
    const main = document.getElementById("main");
    const eqBar = document.getElementById("eqBar");
    if (eqBar && scheduleData && scheduleData.slots) {
      eqBar.innerHTML = scheduleData.slots.map(it => {
        let cls = "eq-bar", h = 5;
        if (it.type === 'regular') { cls += " filled-regular"; h = 18; }
        else if (it.type === 'occasional') { cls += " filled-occasional"; h = 14; }
        else if (it.type === 'makeup' || (it.makeup && it.makeup.status === 'claimed')) { cls += " filled-makeup"; h = 16; }
        return `<div class="${cls}" style="height:${h}px"></div>`;
      }).join("");
    }

    if (activeTab === "schedule") renderSchedule(main);
    else if (activeTab === "requests") renderRequests(main);
    else if (activeTab === "students") renderStudents(main);
    else if (activeTab === "activity") renderActivityTab(main);
    else renderSettings(main);
  }

  // ---------- SCHEDULE TAB ----------
  async function refreshSchedule() {
    try {
      scheduleData = await api.get('/api/schedule?date=' + dateKey(selectedDate));
      renderCoachTab();
    } catch (e) {
      showToast("Error updating schedule");
    }
  }

  function renderSchedule(main) {
    const today = new Date();
    const isToday = isSameDay(selectedDate, today);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const isTomorrow = isSameDay(selectedDate, tomorrow);
    const key = dateKey(selectedDate);
    const allSlots = scheduleData.slots || [];

    // Filter by time of day
    const filteredSlots = allSlots.filter(it => {
      const h = parseInt(it.slotTime.split(':')[0]);
      if (timeFilter === 'morning') return h >= 5 && h < 12;
      if (timeFilter === 'afternoon') return h >= 12 && h < 17;
      if (timeFilter === 'evening') return h >= 17 && h <= 23;
      return true;
    });

    const bookedCount = allSlots.filter(i => !i.free && i.isPrimary !== false).length;
    const freeCount = allSlots.filter(i => i.free).length;
    const activeBatches = scheduleData.activeBatches || [];

    let html = `
      ${renderNotificationBannerIfNeeded()}
      <div class="datenav">
        <button class="arrow" id="prevDay">‹</button>
        <div class="dateinfo">
          <div class="big">${fmtDateLong(selectedDate)}</div>
          <div class="small">${isToday ? "Today" : isTomorrow ? "Tomorrow" : DAY_SHORT[selectedDate.getDay()]}${activeBatches.length ? " · " + activeBatches.map(b => b.name).join(" & ") : " · No regular batch"}</div>
        </div>
        <button class="arrow" id="nextDay">›</button>
      </div>

      <div class="quickjump">
        <button class="chip ${isToday ? 'active' : ''}" id="jumpToday">Today</button>
        <button class="chip ${isTomorrow ? 'active' : ''}" id="jumpTomorrow">Tomorrow</button>
        <input type="date" id="jumpDate" style="background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;outline:none;" value="${key}"/>
      </div>

      <!-- Time of Day Filter (5 AM to 11 PM) -->
      <div class="quickjump" style="margin-top:-4px;margin-bottom:12px;">
        <button class="chip ${timeFilter === 'all' ? 'active' : ''}" data-tf="all">All (5 AM–11 PM)</button>
        <button class="chip ${timeFilter === 'morning' ? 'active' : ''}" data-tf="morning">Morning (5–12)</button>
        <button class="chip ${timeFilter === 'afternoon' ? 'active' : ''}" data-tf="afternoon">Afternoon (12–5)</button>
        <button class="chip ${timeFilter === 'evening' ? 'active' : ''}" data-tf="evening">Evening (5–11)</button>
      </div>

      <div class="row between" style="margin-bottom:12px;align-items:center;">
        <div class="summary" style="margin:0;flex:1;margin-right:8px;">
          <div class="s"><div class="num">${allSlots.length}</div><div class="lbl">1-Hr Slots</div></div>
          <div class="s"><div class="num" style="color:var(--accent)">${bookedCount}</div><div class="lbl">Classes</div></div>
          <div class="s"><div class="num" style="color:var(--good)">${freeCount}</div><div class="lbl">Free Hours</div></div>
        </div>
        <button class="btn primary sm" id="btnTopBookSlot" style="white-space:nowrap;padding:10px 14px;font-weight:700;">+ Book Slot</button>
      </div>`;

    html += filteredSlots.length === 0
      ? `<div class="empty">No slots in this time window.</div>`
      : filteredSlots.map(it => renderSlotCard(it, key)).join("");

    main.innerHTML = html;

    const notifBtn = document.getElementById("btnEnableNotifBanner");
    if (notifBtn) {
      notifBtn.onclick = () => requestPushPermissionAndSubscribe(currentUser);
    }

    const topBookBtn = document.getElementById("btnTopBookSlot");
    if (topBookBtn) {
      const firstFree = allSlots.find(s => s.free);
      topBookBtn.onclick = () => openBookSheet((firstFree ? firstFree.slotTime : '16:00'), key);
    }

    document.getElementById("prevDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() - 1); refreshSchedule(); };
    document.getElementById("nextDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpToday").onclick = () => { selectedDate = new Date(); refreshSchedule(); };
    document.getElementById("jumpTomorrow").onclick = () => { selectedDate = new Date(); selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpDate").onchange = (e) => {
      if (e.target.value) {
        const [y, m, d] = e.target.value.split("-").map(Number);
        selectedDate = new Date(y, m - 1, d);
        refreshSchedule();
      }
    };

    main.querySelectorAll("[data-tf]").forEach(btn => {
      btn.onclick = () => {
        timeFilter = btn.getAttribute("data-tf");
        renderCoachTab();
      };
    });

    main.querySelectorAll("[data-book-slot]").forEach(btn => btn.onclick = () => openBookSheet(btn.getAttribute("data-book-slot"), key));
    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });
    main.querySelectorAll("[data-msg]").forEach(btn => btn.onclick = () => openMessageSheet(btn.getAttribute("data-msg"), btn.getAttribute("data-msg-mobile")));
    main.querySelectorAll("[data-perf-slot]").forEach(btn => btn.onclick = () => openPerformanceModal(btn.getAttribute("data-perf-slot")));
    main.querySelectorAll("[data-edit-student]").forEach(btn => btn.onclick = () => openEditStudentSheet(btn.getAttribute("data-edit-student")));

    // Solo Student Attendance
    main.querySelectorAll("[data-mark]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-mark");
      const statusToSet = btn.getAttribute("data-status");
      const currentStatus = btn.getAttribute("data-current");
      const newStatus = (currentStatus === statusToSet) ? null : statusToSet;
      try {
        await api.post('/api/attendance', { date: key, studentId, status: newStatus });
        refreshSchedule();
      } catch (e) {
        showToast("Failed to record attendance");
      }
    });

    // Sibling Group Combined Attendance
    main.querySelectorAll("[data-group-all-present]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-present");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'present');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'present', memberStatuses });
        showToast("✓ All siblings marked present");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-all-absent]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-absent");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'absent');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'absent', memberStatuses });
        showToast("✕ All siblings marked absent");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-partial]").forEach(btn => btn.onclick = () => {
      const studentId = btn.getAttribute("data-group-partial");
      const item = scheduleData.slots.find(s => s.id === studentId);
      if (item) openGroupAttendanceSheet(item, key);
    });

    main.querySelectorAll("[data-cancel-booking]").forEach(btn => btn.onclick = async () => {
      const bid = btn.getAttribute("data-cancel-booking");
      if (confirm("Cancel this booking?")) {
        try {
          await api.delete('/api/bookings/' + bid);
          refreshSchedule();
          showToast("Booking cancelled");
        } catch (e) {
          showToast("Error cancelling booking");
        }
      }
    });
  }

  function renderSlotCard(it, key) {
    if (it.free) {
      return `<div class="slot free">
        <div class="row between"><div class="time">${fmtTime(it.slotTime)}</div><span class="badge present">Open Slot</span></div>
        <div class="actionrow"><button class="btn primary sm" data-book-slot="${it.slotTime}">+ Book Slot (Regular / Flexible)</button></div>
      </div>`;
    }

    // Continuation card for 2nd or 3rd hour of a multi-hour class
    if (it.isPrimary === false) {
      return `<div class="slot slot-continuation">
        <div class="row between">
          <div class="time" style="font-size:13.5px;color:var(--muted);">${fmtTime(it.slotTime)}</div>
          <span class="badge duration">↳ Hour ${it.hourIndex} of ${it.durationHours}</span>
        </div>
        <div style="font-size:13px;margin-top:2px;"><b>${escapeHtml(it.name)}</b> <span class="muted">(Continued from ${fmtTime(it.primarySlotTime)})</span></div>
      </div>`;
    }

    const template = scheduleData.template || "Hi {name} 🎵 Reminder: you have class at {time}.";
    const msgText = template.replace("{name}", it.name).replace("{time}", fmtTime(it.slotTime)).replace("{date}", fmtDateLong(selectedDate));
    const isGroup = it.slotType && it.slotType !== 'solo';
    
    // Status Badge calculation
    let statusBadge = "";
    if (it.status === 'present') {
      statusBadge = `<span class="badge present" style="margin-left:6px;">${isGroup ? '✓ All Present' : '✓ Present'}</span>`;
    } else if (it.status === 'absent') {
      statusBadge = `<span class="badge absent" style="margin-left:6px;">${isGroup ? '✕ All Absent' : '✕ Not coming'}</span>`;
    } else if (it.status === 'partial') {
      const absentMems = Object.entries(it.memberStatuses || {}).filter(([k,v]) => v === 'absent').map(([k]) => k);
      const totalMems = (it.groupMembers && it.groupMembers.length) || Object.keys(it.memberStatuses || {}).length || 2;
      const presentCount = totalMems - absentMems.length;
      statusBadge = `<span class="badge partial" style="margin-left:6px;">🟡 ${presentCount} Present, ${absentMems.length} Absent${absentMems.length > 0 ? ' (' + absentMems.join(', ') + ')' : ''}</span>`;
    }

    let attendanceButtons = "";
    if (it.type === 'regular') {
      if (!isGroup) {

          <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-group-all-absent="${it.id}">✕ All Absent</button>

    const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(it.slotType)}</span>` : '';
    const durBadge = (it.durationHours && it.durationHours > 1) ? `<span class="badge duration">⏱️ ${it.durationHours} Hours</span>` : '';
    const instBadges = (it.instruments || []).map(inst => `<span class="badge tagchip">${escapeHtml(inst)}</span>`).join(" ");

    let membersText = "";
    if (isGroup && it.groupMembers && it.groupMembers.length > 0) {
      const memberStatusChips = it.groupMembers.map(m => {

        if (mst === 'present') { tagColor = 'var(--good)'; tagIcon = ' ✓'; }
        else if (mst === 'absent') { tagColor = 'var(--bad)'; tagIcon = ' ✕'; }
        return `<span style="display:inline-block;background:var(--bg-deep);padding:2px 7px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;margin:2px 4px 2px 0;color:${tagColor};"><b>${escapeHtml(m.name)}</b>${tagIcon}</span>`;
      }).join("");

      membersText = `<div style="margin:4px 0 2px;">${memberStatusChips}</div>`;
    }

    // Smart Make-up Slot Alert
    let makeupNotice = "";
    if (it.status === 'absent') {
      if (it.makeup && it.makeup.status === 'claimed') {
        makeupNotice = `<div style="background:rgba(93,173,226,0.14);border:1px solid var(--makeup);padding:8px 10px;border-radius:8px;margin-top:6px;font-size:12px;color:var(--makeup);">
          <b>🔄 Claimed Make-up Class:</b> ${escapeHtml(it.makeup.claimed_by_name)} (${it.makeup.claimed_by_mobile})
        </div>`;
      } else {
        makeupNotice = `<div style="background:rgba(93,173,226,0.1);border:1px dashed var(--makeup);padding:7px 10px;border-radius:8px;margin-top:6px;font-size:12px;color:var(--makeup);">
          <b>🔄 Open Make-up Slot (${it.durationHours || 1}h):</b> Vacated by regular class
        </div>`;
      }
    }

    return `<div class="slot ${it.status === 'absent' ? 'makeup-open' : ''}">
      <div class="row between">
        <div class="time">${fmtTimeRange(it.slotTime, it.durationHours || 1)}</div>
        <div>
          ${durBadge}
          ${it.type === 'makeup' ? '<span class="badge makeup">Make-up</span>' : ''}
          ${groupBadge}
          <span class="badge ${it.type}">${it.type === 'regular' ? '🎓 Fixed Batch' : it.type === 'makeup' ? '🔄 Make-up' : '⚡ Flexible Session'}</span>
        </div>
      </div>
      <div class="name">${escapeHtml(it.name)} ${statusBadge}</div>
      ${membersText}
      <div class="phone">${it.mobile}</div>
      ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
      ${it.currentLesson ? `<div class="muted" style="font-size:11.5px;margin-top:4px;">🎼 Lesson: <i>${escapeHtml(it.currentLesson)}</i></div>` : ''}
      ${makeupNotice}
      <div class="actionrow">
        <button class="btn ghost" data-call="${it.mobile}">📞 Call</button>
        <button class="btn ghost" data-msg="${msgText.replace(/"/g, '&quot;')}" data-msg-mobile="${it.mobile}">💬 Message</button>
        ${it.type === 'regular' ? `
          <button class="btn primary" data-perf-slot="${it.id}">⭐ Evaluate</button>

  }

  // ═════════════════════════════════════════════════════════════════════════════
  // ⏰ AUTOMATIC UNMARKED ATTENDANCE ALARM & SOUND ENGINE
  // ═════════════════════════════════════════════════════════════════════════════
  let alarmAudioElement = null;
  let isAlarmRinging = false;
  let activeAlarmData = null;
  const dismissedSlotAlarms = new Set();

  function getAlarmAudio() {
    if (!alarmAudioElement) {
      alarmAudioElement = new Audio('/alarm.mp3');
      alarmAudioElement.loop = true;
      alarmAudioElement.preload = 'auto';
    }
    return alarmAudioElement;
  }

  function startAlarmSound() {
    const audio = getAlarmAudio();
    isAlarmRinging = true;
    audio.play().catch(e => {
      console.log("Audio autoplay waiting for user interaction:", e.message);
    });
  }

  function stopAlarmSound() {
    isAlarmRinging = false;
    if (alarmAudioElement) {
      alarmAudioElement.pause();
      alarmAudioElement.currentTime = 0;
    }
    const modal = document.getElementById("activeAlarmModalOverlay");
    if (modal) modal.remove();
  }

  function checkAttendanceAlarm() {
    if (isAlarmRinging) return;
    const today = new Date();
    const todayKey = dateKey(today);
    const nowMinutes = today.getHours() * 60 + today.getMinutes();

    if (currentRole === 'coach') {
      if (!scheduleData || !scheduleData.slots) return;
      const curSelectedKey = dateKey(selectedDate);
      if (curSelectedKey !== todayKey) return;

      for (const slot of scheduleData.slots) {
        if (slot.free || slot.isPrimary === false) continue;
        const [sh, sm] = (slot.slotTime || '00:00').split(':').map(Number);
        const slotStartMins = sh * 60 + sm;
        const dur = slot.durationHours || 1;
        const slotEndMins = slotStartMins + (dur * 60);

        const isSlotTimeNow = (nowMinutes >= slotStartMins && nowMinutes < slotEndMins);
        const alarmKey = `${todayKey}_${slot.id}_${slot.slotTime}`;
        const isUnmarked = (!slot.status || (slot.status !== 'present' && slot.status !== 'absent' && slot.status !== 'partial'));

        if (isSlotTimeNow && isUnmarked && !dismissedSlotAlarms.has(alarmKey)) {
          triggerSlotAlarm({
            role: 'coach',
            alarmKey,
            studentId: slot.id,
            name: slot.name,
            mobile: slot.mobile,
            time: slot.slotTime,
            durationHours: dur,
            slotType: slot.slotType,
            groupMembers: slot.groupMembers,
            instruments: slot.instruments,
            dateStr: todayKey
          });
          break;
        }
      }
    } else if (currentRole === 'student' && currentUser && currentUser.status === 'active') {
      const b = batchById(currentUser.batchId);
      const isTodayBatch = b && b.days && b.days.includes(today.getDay());
      if (!isTodayBatch) return;

      const [sh, sm] = (currentUser.time || '00:00').split(':').map(Number);
      const slotStartMins = sh * 60 + sm;
      const dur = currentUser.durationHours || 1;
      const slotEndMins = slotStartMins + (dur * 60);

      const isSlotTimeNow = (nowMinutes >= slotStartMins && nowMinutes < slotEndMins);
      const alarmKey = `${todayKey}_student_${currentUser.id}_${currentUser.time}`;
      const todayAtt = attStatuses[todayKey];
      const isUnmarked = (!todayAtt || (todayAtt !== 'present' && todayAtt !== 'absent' && todayAtt !== 'partial'));

      if (isSlotTimeNow && isUnmarked && !dismissedSlotAlarms.has(alarmKey)) {
        triggerSlotAlarm({
          role: 'student',
          alarmKey,
          studentId: currentUser.id,
          name: currentUser.name,
          mobile: currentUser.mobile,
          time: currentUser.time,
          durationHours: dur,
          slotType: currentUser.slotType,
          groupMembers: currentUser.groupMembers,
          dateStr: todayKey
        });
      }
    }
  }

    startAlarmSound();

    const existing = document.getElementById("activeAlarmModalOverlay");

    const overlay = document.createElement("div");
    overlay.className = "sheet-overlay open";

    overlay.innerHTML = `

          </div>
          ${(data.instruments && data.instruments.length) ? `
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">

        </div>

        <div class="muted" style="font-size:12px;margin-bottom:14px;">

        </div>

        ${data.role === 'coach' ? `
          <div class="row gap8" style="margin-bottom:10px;">
            <button class="btn good block" id="btnAlarmMarkPres" style="flex:1;justify-content:center;padding:14px;font-size:14px;font-weight:700;">✓ Mark Present</button>
            <button class="btn warn block" id="btnAlarmMarkAbs" style="flex:1;justify-content:center;padding:14px;font-size:14px;font-weight:700;">✕ Mark Absent</button>
          </div>
          ${isGroup ? `
            <button class="btn primary block" id="btnAlarmMarkGroup" style="margin-bottom:10px;">👥 Mark Sibling Attendance</button>
          ` : ''}

          <div class="row gap8" style="margin-bottom:10px;">
            <button class="btn good block" id="btnAlarmStudentAttending" style="flex:1;justify-content:center;padding:14px;font-size:14px;font-weight:700;">✓ I am Attending</button>
            <button class="btn warn block" id="btnAlarmStudentAbsent" style="flex:1;justify-content:center;padding:14px;font-size:14px;font-weight:700;">✕ Can't Make It (Absent)</button>
          </div>
        `}

        <button class="btn ghost block" id="btnAlarmDismiss" style="font-size:12.5px;padding:9px;color:var(--muted);">🔇 Mute &amp; Dismiss Alarm</button>
      </div>`;

    document.body.appendChild(overlay);

    const dismissBtn = overlay.querySelector("#btnAlarmDismiss");
    if (dismissBtn) {
      dismissBtn.onclick = () => {
        dismissedSlotAlarms.add(data.alarmKey);
        stopAlarmSound();
        showToast("Alarm muted");
      };
    }

    if (data.role === 'coach') {
      const presBtn = overlay.querySelector("#btnAlarmMarkPres");
      const absBtn = overlay.querySelector("#btnAlarmMarkAbs");
      const grpBtn = overlay.querySelector("#btnAlarmMarkGroup");

      if (presBtn) {
        presBtn.onclick = async () => {
          try {
            await api.post('/api/attendance', { date: data.dateStr, studentId: data.studentId, status: 'present' });
            dismissedSlotAlarms.add(data.alarmKey);
            stopAlarmSound();
            showToast(`✓ Marked Present for ${data.name}`);
            await refreshSchedule();
          } catch (e) {
            showToast("Error updating attendance");
          }
        };
      }

      if (absBtn) {
        absBtn.onclick = async () => {
          try {
            await api.post('/api/attendance', { date: data.dateStr, studentId: data.studentId, status: 'absent' });
            dismissedSlotAlarms.add(data.alarmKey);
            stopAlarmSound();
            showToast(`✕ Marked Absent for ${data.name}`);
            await refreshSchedule();
          } catch (e) {
            showToast("Error updating attendance");
          }
        };
      }

      if (grpBtn) {
        grpBtn.onclick = () => {

          stopAlarmSound();
          openGroupAttendanceSheet(data, data.dateStr);
        };
      }
    } else {
      const attBtn = overlay.querySelector("#btnAlarmStudentAttending");
      const absBtn = overlay.querySelector("#btnAlarmStudentAbsent");

      if (attBtn) {
        attBtn.onclick = async () => {
          try {
            await api.post('/api/attendance', { date: data.dateStr, studentId: data.studentId, status: 'present' });
            dismissedSlotAlarms.add(data.alarmKey);
            stopAlarmSound();
            showToast("✓ Marked Attending! Have a great class.");
            renderStudentView();
          } catch (e) {
            showToast("Error updating status");
          }
        };
      }

      if (absBtn) {
        absBtn.onclick = async () => {
          try {
            await api.post('/api/attendance', { date: data.dateStr, studentId: data.studentId, status: 'absent' });
            dismissedSlotAlarms.add(data.alarmKey);
            stopAlarmSound();
            showToast("Coach notified of absence.");
            renderStudentView();
          } catch (e) {
            showToast("Error updating status");
          }
        };
      }
    }
  }

  setInterval(checkAttendanceAlarm, 10000);

  // ---------- SIBLING GROUP INDIVIDUAL ATTENDANCE MODAL ----------
  function openGroupAttendanceSheet(item, dateStr) {
    const members = (item.groupMembers && item.groupMembers.length > 0)
      ? item.groupMembers
      : [{ name: item.name }];

    const currentStatuses = { ...(item.memberStatuses || {}) };
    members.forEach(m => {
      if (!currentStatuses[m.name]) {
        currentStatuses[m.name] = (item.status === 'absent') ? 'absent' : 'present';
      }
    });

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">👥 Combined Sibling Attendance</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="student-row" style="background:var(--bg-deep);margin-bottom:12px;">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="phone">${dateStr} · ${fmtTimeRange(item.slotTime || item.time, item.durationHours || 1)}</div>
      </div>

      <div class="row gap8" style="margin-bottom:14px;">
        <button class="btn good" id="btnGroupAllPres" style="flex:1;justify-content:center;">✓ All Present</button>
        <button class="btn warn" id="btnGroupAllAbs" style="flex:1;justify-content:center;">✕ All Absent</button>
      </div>

      <label style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:8px;display:block;">
        Individual Sibling / Member Status:
      </label>

      <div id="memberAttList">
        ${members.map(m => `
          <div class="member-att-row" data-member="${escapeHtml(m.name)}">
            <div style="font-weight:600;font-size:14px;">${escapeHtml(m.name)}</div>
            <div class="pill-group">
              <button class="pill-btn pill-present ${currentStatuses[m.name] === 'present' ? 'active' : ''}" data-act="present">✓ Present</button>
              <button class="pill-btn pill-absent ${currentStatuses[m.name] === 'absent' ? 'active' : ''}" data-act="absent">✕ Absent</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div id="attSummaryText" style="background:rgba(210,162,76,0.12);border:1px solid var(--accent);padding:10px 12px;border-radius:10px;margin:12px 0;font-size:12.5px;text-align:center;">
        Loading status…
      </div>

      <button class="btn primary block" id="btnSaveGroupAtt">Save Sibling Attendance</button>`;

    openSheet(html, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      function updateSummaryText() {
        const total = members.length;
        const absentList = members.filter(m => currentStatuses[m.name] === 'absent').map(m => m.name);
        const presentCount = total - absentList.length;
        const sumEl = ov.querySelector("#attSummaryText");

        if (absentList.length === 0) {
          sumEl.innerHTML = `<span style="color:var(--good);font-weight:700;">🟢 All ${total} siblings attending</span>`;
        } else if (absentList.length === total) {
          sumEl.innerHTML = `<span style="color:var(--bad);font-weight:700;">🔴 All ${total} siblings absent</span>`;
        } else {
          sumEl.innerHTML = `<span style="color:var(--accent);font-weight:700;">🟡 ${presentCount} Present · ${absentList.length} Absent: <i>${escapeHtml(absentList.join(', '))}</i></span>`;
        }
      }

      function refreshPillUI() {
        ov.querySelectorAll(".member-att-row").forEach(row => {
          const mName = row.getAttribute("data-member");
          const st = currentStatuses[mName];
          row.querySelector(".pill-present").classList.toggle("active", st === 'present');
          row.querySelector(".pill-absent").classList.toggle("active", st === 'absent');
        });
        updateSummaryText();
      }

      ov.querySelectorAll(".member-att-row").forEach(row => {
        const mName = row.getAttribute("data-member");
        row.querySelector(".pill-present").onclick = () => {
          currentStatuses[mName] = 'present';
          refreshPillUI();
        };
        row.querySelector(".pill-absent").onclick = () => {
          currentStatuses[mName] = 'absent';
          refreshPillUI();
        };
      });

      ov.querySelector("#btnGroupAllPres").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'present');
        refreshPillUI();
      };

      ov.querySelector("#btnGroupAllAbs").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'absent');
        refreshPillUI();
      };

      refreshPillUI();

      ov.querySelector("#btnSaveGroupAtt").onclick = async () => {
        const total = members.length;
        const absentCount = members.filter(m => currentStatuses[m.name] === 'absent').length;

        let finalStatus = 'present';
        if (absentCount === total) finalStatus = 'absent';
        else if (absentCount > 0) finalStatus = 'partial';

        try {
          await api.post('/api/attendance', {
            date: dateStr,
            studentId: item.id,
            status: finalStatus,
            memberStatuses: currentStatuses
          });
          ov.remove();
          showToast(`Attendance recorded (${finalStatus})!`);
          if (currentUser.role === 'coach') refreshSchedule();
          else renderStudentView();
        } catch (err) {
          showToast(err.message || "Failed to save attendance");
        }
      };
    });
  }

  // ---------- AVAILABLE SLOTS HELPER (HIDES ALREADY BOOKED/OCCUPIED TIMES IN BATCH) ----------
  function getAvailableSlotsForBatch(batchId, durationHours = 1, excludeStudentId = null) {
    const allSlots = (configData.slots || DEFAULT_HOURLY_SLOTS).slice().sort();
    const batchStudents = (studentsData || []).filter(s => s.batchId === batchId && s.id !== excludeStudentId);
    
    const occupiedMap = {};
    for (const s of batchStudents) {
      const dur = s.durationHours || 1;
      const occ = getOccupiedSlotList(s.time, dur);
      for (const t of occ) {
        occupiedMap[t] = s.name;
      }
    }

    const availableSlots = [];
    for (const t of allSlots) {
      const needed = getOccupiedSlotList(t, durationHours);
      const isOutOfBounds = needed.some(slotT => !allSlots.includes(slotT));
      const conflict = needed.find(slotT => occupiedMap[slotT]);
      
      if (!isOutOfBounds && !conflict) {
        availableSlots.push({ time: t, label: fmtTime(t) });
      }
    }
    return availableSlots;
  }
