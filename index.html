<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Thomas International Music Academy — Sky Blue &amp; Ivory Edition</title>
<meta name="theme-color" content="#F0F9FF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="TIMA Sky" />
<link rel="manifest" href="/manifest.json?v=4" />
<link rel="shortcut icon" href="/itma-logo.png?v=4" type="image/png" />
<link rel="icon" type="image/png" href="/itma-logo.png?v=4" />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" />
<link rel="apple-touch-icon" href="/itma-logo.png?v=4" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=4" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<!-- GSAP & ScrollTrigger Animation Engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!-- jsPDF & AutoTable for client-side PDF Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" async></script>
<style>
  /* ═══════════ SKY BLUE & WARM IVORY LUXURY DESIGN SYSTEM ═══════════ */
  :root{
    --bg:#F0F7FF;
    --bg-deep:#E2F0FD;
    --card:#FFFFFF;
    --card-hover:#FFFFFF;
    --card-solid:#FFFFFF;
    --card-2:#F5FAFF;
    --card-elevated:#FFFFFF;
    --line:rgba(14, 165, 233, 0.22);
    --line-strong:rgba(14, 165, 233, 0.45);
    --line-accent:linear-gradient(90deg, rgba(14, 165, 233,0), rgba(14, 165, 233,0.5), rgba(14, 165, 233,0));
    --text:#0B2545;
    --text-secondary:#2C4A6F;
    --muted:#5B7A9C;
    --accent:#0EA5E9; /* Rich Warm Gold */
    --accent-warm:#0284C7; /* Deep Amber Gold */
    --accent-sky-light:#E0F2FE;
    --accent-deep:#0369A1;
    --accent-ink:#FFFFFF;
    --accent2:#7C5295;
    --good:#15803D;
    --good-bg:rgba(22, 163, 74, 0.12);
    --good-border:rgba(22, 163, 74, 0.35);
    --bad:#DC2626;
    --bad-bg:rgba(220, 38, 38, 0.12);
    --bad-border:rgba(220, 38, 38, 0.35);
    --makeup:#0284C7;
    --makeup-bg:rgba(2, 132, 199, 0.12);
    --makeup-border:rgba(2, 132, 199, 0.35);
    --group-color:#7E22CE;
    --group-bg:rgba(126, 34, 206, 0.12);
    --group-border:rgba(126, 34, 206, 0.35);
    --radius:16px;
    --radius-lg:22px;
    --radius-sm:10px;
    --dock-bg:rgba(240, 247, 255, 0.94);
    --dock-border:rgba(14, 165, 233, 0.25);
    --glow:0 0 20px rgba(14, 165, 233, 0.3);
    --glow-accent:0 0 24px rgba(14, 165, 233, 0.45);
    --shadow-card:0 4px 20px rgba(2, 132, 199, 0.08), 0 0 0 1px rgba(14, 165, 233, 0.15);
    --shadow-hover:0 8px 30px rgba(2, 132, 199, 0.16), 0 0 0 1.5px rgba(14, 165, 233, 0.5);
    --shadow-sheet:0 -16px 50px rgba(11, 37, 69, 0.25);
    --ease-spring:cubic-bezier(0.32, 0.72, 0, 1);
    --transition-fast:140ms var(--ease-spring);
    --transition-smooth:260ms var(--ease-spring);
    --transition-spring:380ms var(--ease-spring);
  }

  /* ═══════════ TACTILE PHYSICAL BUTTON PRESS & MICRO-INTERACTIONS ═══════════ */
  .tap-ripple{
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.4) 0%, rgba(14, 165, 233, 0.15) 50%, transparent 75%);
    pointer-events: none;
    transform: scale(0);
    animation: rippleWave 0.45s ease-out forwards;
    z-index: 10;
  }

  @keyframes rippleWave{
    to{ transform: scale(2.5); opacity: 0; }
  }

  button, .btn, .chip, .slot, .student-row, .batchcard, .tag-item, .segmented button, .pill-btn, .arrow{
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.12s var(--ease-spring), filter 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
  }

  button:active, .btn:active, .chip:active, .slot:active, .student-row:active, .batchcard:active, .tag-item:active, .segmented button:active, .pill-btn:active, .arrow:active{
    transform: scale(0.96) translateY(1px) !important;
    filter: brightness(1.08) contrast(1.05);
    box-shadow: 0 0 14px rgba(14, 165, 233, 0.3), inset 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
    font-weight: 400;
    letter-spacing: -0.15px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    position: relative;
    width: 100%;
  }

  /* ═══════════ WARM LUMINOUS GOLD MESH ═══════════ */
  body::before{
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 18% 12%, rgba(14, 165, 233, 0.22) 0%, transparent 50%),
      radial-gradient(circle at 82% 20%, rgba(56, 189, 248, 0.35) 0%, transparent 55%),
      radial-gradient(circle at 50% 88%, rgba(2, 132, 199, 0.14) 0%, transparent 60%),
      linear-gradient(180deg, #F0F7FF 0%, #E2F0FD 50%, #D4E9FC 100%);
    pointer-events: none;
    z-index: 0;
  }

  #particles-canvas{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.7;
  }

  #app{
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    margin-left: auto !important;
    margin-right: auto !important;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    position: relative;
    z-index: 1;
    padding-bottom: env(safe-area-inset-bottom);
    left: 0;
    right: 0;
  }

  /* ═══════════ ROYAL PORCELAIN TOP HEADER ═══════════ */
  header.top{
    padding: 12px 16px 10px;
    position: relative;
    top: auto;
    z-index: 10;
    background: transparent;
    border-bottom: 1px solid var(--line);
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 2px;
  }

  .brand-logo{
    width: 38px !important;
    height: 38px !important;
    max-width: 38px !important;
    max-height: 38px !important;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--accent);
    box-shadow: var(--glow);
    flex-shrink: 0;
    background: #FFFFFF;
    display: inline-block;
  }

  .login-app-logo{
    width: 96px !important;
    height: 96px !important;
    max-width: 96px !important;
    max-height: 96px !important;
    border-radius: 50%;
    object-fit: cover;
    border: 2.5px solid var(--accent);
    box-shadow: 0 8px 32px rgba(14, 165, 233,0.35);
    margin: 0 auto 10px;
    display: block;
    background: #FFFFFF;
  }

  .brand .mark{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 15px;
    color: #0369A1;
    letter-spacing: 0.02em;
  }

  .brand .tag{
    font-size: 10px;
    color: var(--accent-deep);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .whoami{
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
  }

  .whoami button{
    background: rgba(14, 165, 233, 0.10);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: -0.1px;
    padding: 4px 12px;
    border-radius: 20px;
    transition: all 0.15s ease;
  }

  .whoami button:active{
    transform: scale(0.94);
    background: rgba(14, 165, 233, 0.20);
  }

  /* ═══════════ ANIMATED EQUALIZER ═══════════ */
  .equalizer{
    display: flex;
    align-items: flex-end;
    gap: 3.5px;
    height: 16px;
    margin: 8px 0 2px;
    padding: 0 2px;
  }

  .eq-bar{
    width: 3.5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    transition: background 0.4s ease, height 0.6s var(--ease-spring);
    position: relative;
  }

  .eq-bar.filled-regular{
    background: linear-gradient(180deg, var(--accent-warm), var(--accent));
    box-shadow: 0 0 6px rgba(10,132,255,0.4);
    animation: eqHarmonic 2.4s ease-in-out infinite alternate;
  }

  .eq-bar:nth-child(2).filled-regular{ animation-delay: 0.2s; }
  .eq-bar:nth-child(3).filled-regular{ animation-delay: 0.4s; }
  .eq-bar:nth-child(4).filled-regular{ animation-delay: 0.15s; }
  .eq-bar:nth-child(5).filled-regular{ animation-delay: 0.5s; }
  .eq-bar:nth-child(6).filled-regular{ animation-delay: 0.3s; }
  .eq-bar:nth-child(7).filled-regular{ animation-delay: 0.6s; }

  @keyframes eqHarmonic{
    0%{ transform: scaleY(0.75); opacity: 0.8; }
    100%{ transform: scaleY(1.15); opacity: 1; filter: brightness(1.1); }
  }

  .eq-bar.filled-occasional{
    background: linear-gradient(180deg, var(--accent2), #7C3AED);
  }

  .eq-bar.filled-makeup{
    background: linear-gradient(180deg, var(--makeup), #0284C7);
  }

  main{ flex: 1; padding: 10px 14px 115px; }

  /* ═══════════ LUXURY TYPOGRAPHY ═══════════ */
  h1, h2, h3, h4{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    margin: 0 0 4px;
    color: #0369A1;
    letter-spacing: 0.01em;
  }

  .muted{ color: var(--muted); }

  /* ═══════════ LAYOUT HELPERS ═══════════ */
  .row{ display: flex; align-items: center; }
  .between{ justify-content: space-between; }
  .gap6{ gap: 6px; } .gap8{ gap: 8px; } .gap12{ gap: 12px; }

  /* ═══════════ GOLD DATE NAVIGATOR ═══════════ */
  .datenav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 8px;
    margin: 8px 0 12px;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-fast);
  }

  .datenav button.arrow{
    background: rgba(14, 165, 233, 0.08);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 18px;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    transition: all var(--transition-fast);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
  }

  .datenav button.arrow:active{
    transform: scale(0.92);
    background: rgba(14, 165, 233, 0.20);
  }

  .datenav .dateinfo{ text-align: center; flex: 1; }
  .datenav .dateinfo .big{
    font-family: 'Cinzel', serif;
    font-size: 17px;
    font-weight: 700;
    color: #0369A1;
    letter-spacing: 0.01em;
  }
  .datenav .dateinfo .small{
    font-size: 10px;
    color: var(--accent-warm);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 2px;
    font-weight: 700;
  }

  /* ═══════════ CHIP / FILTER PILLS ═══════════ */
  .quickjump{ display: flex; gap: 6px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }

  .chip{
    border: 1px solid var(--line);
    background: #FFFFFF;
    color: var(--text-secondary);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all var(--transition-spring);
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(14, 165, 233,0.06);
  }

  .chip:hover{
    border-color: var(--accent);
    color: #0369A1;
    background: #F0F9FF;
    transform: translateY(-1.5px);
    box-shadow: 0 4px 14px rgba(14, 165, 233,0.18);
  }
  .chip:active{ transform: scale(0.95); }

  .chip.active{
    background: linear-gradient(135deg, #38BDF8 0%, #0284C7 100%);
    color: #FFFFFF;
    border-color: var(--accent-warm);
    font-weight: 700;
    box-shadow: var(--glow);
  }

  /* ═══════════ SUMMARY STATS ═══════════ */
  .summary{ display: flex; gap: 8px; margin-bottom: 16px; }

  .summary .s{
    flex: 1;
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
  }

  .summary .s:hover{
    border-color: var(--line-strong);
    transform: translateY(-2.5px);
    box-shadow: var(--shadow-hover);
  }

  .summary .s .num{
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--accent-warm);
  }
  .summary .s .lbl{
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ LUXURY SLOT & CLASS CARD ═══════════ */
  .slot{
    background: #FFFFFF;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
    position: relative;
    overflow: hidden;
    color: #0B2545;
  }

  .slot:hover{
    border-color: var(--line-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) scale(1.006);
  }

  .slot.free{
    border-style: dashed;
    border-color: rgba(14, 165, 233,0.4);
    background: rgba(224, 242, 254, 0.45);
  }

  .slot.free:hover{
    border-color: var(--accent);
    background: rgba(224, 242, 254, 0.75);
  }

  .slot.makeup-open{
    border-style: dashed;
    border-color: rgba(2,132,199,0.4);
    background: rgba(2,132,199,0.06);
  }

  .slot.slot-continuation{
    background: rgba(14, 165, 233,0.03);
    border-left: 4px solid var(--accent);
    margin-top: -6px;
  }

  .slot .time{
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 17px;
    color: var(--accent-warm);
    min-width: 70px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  /* ═══════════ BADGE SYSTEM ═══════════ */
  .badge{
    font-size: 9.5px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    transition: all var(--transition-fast);
  }

  .badge.regular{
    background: rgba(14, 165, 233,0.12);
    color: #0369A1;
    border: 1px solid rgba(14, 165, 233,0.3);
  }

  .badge.occasional{
    background: rgba(124,82,149,0.12);
    color: #7C5295;
    border: 1px solid rgba(124,82,149,0.3);
  }

  .badge.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .badge.group{
    background: var(--group-bg);
    color: var(--group-color);
    border: 1px solid var(--group-border);
  }

  .badge.duration{
    background: rgba(14, 165, 233,0.08);
    color: var(--accent-deep);
    border: 1px solid var(--line);
  }

  .badge.absent{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .badge.present{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .badge.partial{
    background: rgba(14, 165, 233,0.15);
    color: var(--accent-warm);
    border: 1px solid rgba(14, 165, 233,0.35);
  }

  .badge.pending{
    background: rgba(14, 165, 233,0.15);
    color: var(--accent-warm);
  }

  .badge.tagchip{
    background: rgba(14, 165, 233,0.08);
    color: var(--text-secondary);
    border: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0.02em;
  }

  /* ═══════════ TEXT ELEMENTS ═══════════ */
  .name{
    font-size: 16.5px;
    font-weight: 700;
    margin: 6px 0 2px;
    color: #0B2545;
    letter-spacing: 0.01em;
  }

  .phone{
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  /* ═══════════ ACTION ROW ═══════════ */
  .actionrow{ display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }

  /* ═══════════ ROYAL GOLD BUTTONS ═══════════ */
  .btn{
    border: none;
    border-radius: 13px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-spring);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .btn:active{ transform: translateY(1.5px) scale(0.96); }
  .btn:disabled{ opacity: 0.4; cursor: default; transform: none; }

  .btn.primary{
    background: linear-gradient(180deg, #38BDF8 0%, #0284C7 100%);
    color: #FFFFFF;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(14, 165, 233,0.35);
  }

  .btn.primary:hover{
    box-shadow: 0 6px 22px rgba(14, 165, 233,0.5);
    transform: translateY(-1.5px);
  }

  .btn.ghost{
    background: rgba(255, 255, 255, 0.85);
    color: #0369A1;
    border: 1.5px solid var(--accent);
    box-shadow: 0 2px 8px rgba(14, 165, 233,0.08);
  }

  .btn.ghost:hover{
    background: #FFFFFF;
    border-color: var(--accent-warm);
    transform: translateY(-1.5px);
    box-shadow: var(--glow);
  }

  .btn.warn{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .btn.warn:hover{ border-color: var(--bad); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(239,68,68,0.3); }

  .btn.good{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .btn.good:hover{ border-color: var(--good); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(16,185,129,0.3); }

  .btn.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .btn.block{ width: 100%; justify-content: center; padding: 14px; font-size: 15px; font-weight: 700; }

  /* ═══════════ FORM FIELDS (Spatial Dark Glass Inputs) ═══════════ */
  .field{ margin-bottom: 15px; }

  .field label{
    display: block;
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }

  .field input, .field select, .field textarea{
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--accent);
    color: #0B2545;
    padding: 12px 15px;
    border-radius: 12px;
    font-size: 14.5px;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    outline: none;
    transition: all var(--transition-smooth);
    box-shadow: 0 2px 6px rgba(14, 165, 233,0.06);
  }

  .field select option{
    background: #FFFFFF;
    color: #0B2545;
  }

  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent-warm);
    box-shadow: 0 0 0 3px rgba(14, 165, 233,0.20);
    background: #FFFFFF;
  }

  .field input::placeholder, .field textarea::placeholder{
    color: rgba(107,90,62,0.45);
  }

  .field textarea{ resize: vertical; min-height: 80px; }

  /* ═══════════ BOTTOM NAVIGATION ═══════════ */
  nav.bottom{
    position: fixed;
    bottom: 0;
    left: 50%;

<!-- Elegant Ambient Cosmic Light Particle Canvas -->
<canvas id="particles-canvas"></canvas>
<div id="app"><div class="loading">Connecting to Thomas International Music Academy…</div></div>

<!-- Ambient Cosmic Light Particle System -->
<script>
(function(){
  const c = document.getElementById('particles-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  let w, h, particles = [];
  const PARTICLE_COUNT = 36;
  let mouse = { x: -1000, y: -1000, radius: 140 };

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  function resize(){
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }

  function createParticle(initial = false){
    const colors = [
      { r: 56, g: 189, b: 248 }, // Cyan
      { r: 245, g: 158, b: 11 }, // Gold
      { r: 129, g: 140, b: 248 } // Indigo
    ];
    const col = colors[Math.floor(Math.random() * colors.length)];
    return {
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + 20,
      size: Math.random() * 2.2 + 0.8,
      speedX: (Math.random() - 0.5) * 0.35,
      speedY: -(Math.random() * 0.45 + 0.12),
      opacity: Math.random() * 0.32 + 0.12,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.02 + 0.008,
      ringSize: Math.random() * 12 + 6,
      hasRing: Math.random() < 0.25,
      color: col
    };
  }

  function init(){
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle(true));
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){
      p.x += p.speedX;
      p.y += p.speedY;
      p.pulse += p.pulseSpeed;

      // Mouse interactive force field
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius && dist > 0){
        const force = (mouse.radius - dist) / mouse.radius;
        p.x += (dx / dist) * force * 1.5;
        p.y += (dy / dist) * force * 1.5;
      }

      const op = p.opacity * (0.7 + 0.3 * Math.sin(p.pulse));

      if (p.y < -30 || p.x < -30 || p.x > w + 30){
        Object.assign(p, createParticle(false));
      }

      // Cosmic micro-orb
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${op})`;
      ctx.fill();

      // Soft ambient glow
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * 3.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${op * 0.25})`;
      ctx.fill();

      // Delicate ring
      if (p.hasRing) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.ringSize, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${op * 0.15})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

  function parseFlexibleTimeInput(inputStr, defaultTime = '16:00') {
    if (!inputStr) return defaultTime;
    const str = inputStr.trim().toLowerCase();

    // Check bracket pattern e.g. "6:00 PM (18:00)"
    const bracketMatch = str.match(/\(([0-2]?\d:00)\)/);
    if (bracketMatch) return bracketMatch[1];

    // Check standard 24h format e.g. "18:00", "05:00", "5:00"
    const stdMatch = str.match(/\b(0?[5-9]|1\d|2[0-3]):00\b/);
    if (stdMatch) return pad(parseInt(stdMatch[1])) + ':00';

    // Match 12h formats e.g. "6pm", "6 pm", "6:00pm", "6:00 pm", "7am", "12pm"
    const ampmMatch = str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
    if (ampmMatch) {
      let h = parseInt(ampmMatch[1]);
      const ampm = ampmMatch[3];
      if (ampm === 'pm' && h < 12) h += 12;
      else if (ampm === 'am' && h === 12) h = 0;
      else if (!ampm) {
        if (h >= 1 && h <= 4) h += 12; // 1-4 default to afternoon PM
      }
      if (h >= 5 && h <= 23) return pad(h) + ':00';
    }

    // Match against standard hourly labels
    for (let h = 5; h <= 23; h++) {
      const hh = pad(h) + ':00';
      const label = fmtTime(hh).toLowerCase();
      if (str.includes(label) || str.includes(hh)) return hh;
    }

    return defaultTime;
  }

  function convertISTToLocalTime(timeStr, targetDateKey, targetTZ) {
    if (!timeStr) return { localTime: '', tzCode: 'IST', dualText: '' };
    const tz = targetTZ || selectedUserTimezone || 'Asia/Kolkata';
    try {
      const [h, m] = timeStr.split(':').map(Number);
      const dKey = targetDateKey || dateKey(new Date());
      const isoStr = `${dKey}T${pad(h)}:${pad(m)}:00+05:30`;
      const dt = new Date(isoStr);

      const timeFmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      const tzFmt = new Intl.DateTimeFormat('en-US', {
        timeZone: tz,
        timeZoneName: 'short'
      });

      const localTime = timeFmt.format(dt);
      const tzParts = tzFmt.formatToParts(dt);
      const tzNamePart = tzParts.find(p => p.type === 'timeZoneName');
      const tzCode = tzNamePart ? tzNamePart.value : (tz === 'Asia/Kolkata' ? 'IST' : 'Local');

      const isIST = (tz === 'Asia/Kolkata');
      const dualText = isIST ? fmtTime(timeStr) + ' IST' : `${localTime} ${tzCode} (${fmtTime(timeStr)} IST)`;
      return { localTime, tzCode, isIST, dualText, fullIST: fmtTime(timeStr) + ' IST' };
    } catch (e) {

      });

        if (ev.touches.length === 1) {
          isDragging = true;
          startX = ev.touches[0].clientX;
          startY = ev.touches[0].clientY;
          initialPanX = panX;
          initialPanY = panY;
        }
      }, { passive: true });

      vp.addEventListener("touchmove", (ev) => {
        if (!isDragging || ev.touches.length !== 1) return;
        ev.preventDefault();
        panX = initialPanX + (ev.touches[0].clientX - startX);
        panY = initialPanY + (ev.touches[0].clientY - startY);
        updateTransform();
      }, { passive: false });

      vp.addEventListener("touchend", () => {
        isDragging = false;
      });

      overlay.querySelectorAll("[data-close]").forEach(btn => btn.onclick = () => overlay.remove());

          ctx.imageSmoothingQuality = "high";

          const nw = img.naturalWidth || baseWidth;
          const nh = img.naturalHeight || baseHeight;
          const renderedW = baseWidth * currentScale;
          const renderedH = baseHeight * currentScale;

          const centerRenderedX = (renderedW / 2) - panX;
          const centerRenderedY = (renderedH / 2) - panY;

          const ratioX = nw / renderedW;
          const ratioY = nh / renderedH;

          const centerSourceX = centerRenderedX * ratioX;
          const centerSourceY = centerRenderedY * ratioY;

          const cropSourceSize = Math.min(nw, nh) / currentScale;

          const srcX = centerSourceX - (cropSourceSize / 2);
          const srcY = centerSourceY - (cropSourceSize / 2);

          ctx.drawImage(img, srcX, srcY, cropSourceSize, cropSourceSize, 0, 0, targetDim, targetDim);

          let finalDataUrl = canvas.toDataURL("image/webp", 0.78);

      if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
      
      const controller = new AbortController();
      const timeoutMs = options.timeout || 10000;
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

      try {
        const res = await fetch(url, { ...options, headers, signal: controller.signal });
        clearTimeout(timeoutId);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Server request failed');
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          console.warn('API request timed out:', url);
        } else {
          console.warn('API error (' + url + '):', err.message);
        }
        throw err;
      }
    },
    get(url, options) { return this.request(url, { method: 'GET', ...options }); },

      listEl.querySelectorAll("[data-flex-call]").forEach(btn => {
        btn.onclick = () => { window.location.href = telLink(COACH_PRIMARY_MOBILE); };
      });

      listEl.querySelectorAll("[data-flex-wa]").forEach(btn => {
        btn.onclick = () => {
          const t = btn.getAttribute("data-flex-wa");
          const msg = `Hi Sir, I would like to book the available music class slot at Thomas International Music Academy on ${fmtDateLong(flexSelectedDate)} at ${fmtTime(t)}. Please confirm and block this slot for me!`;

  function renderCoachTab() {
    const main = document.getElementById("main");
    const eqBar = document.getElementById("eqBar");
    if (eqBar && scheduleData && scheduleData.slots) {
      eqBar.innerHTML = scheduleData.slots.map(it => {
        let cls = "eq-bar", h = 5;
        if (it.type === 'regular') { cls += " filled-regular"; h = 18; }
        else if (it.type === 'occasional') { cls += " filled-occasional"; h = 14; }
        else if (it.type === 'makeup' || (it.makeup && it.makeup.status === 'claimed')) { cls += " filled-makeup"; h = 16; }
        return `<div class="${cls}" style="height:${h}px"></div>`;
      }).join("");
    }

    if (activeTab === "schedule") renderSchedule(main);
    else if (activeTab === "requests") renderRequests(main);
    else if (activeTab === "students") renderStudents(main);
    else if (activeTab === "activity") renderActivityTab(main);
    else renderSettings(main);

    applyScrollTriggers(main);
  }

  // ---------- SCHEDULE TAB ----------
  async function refreshSchedule() {
    try {
      scheduleData = await api.get('/api/schedule?date=' + dateKey(selectedDate));
      renderCoachTab();
    } catch (e) {
      showToast("Error updating schedule");
    }
  }

  function renderSchedule(main) {
    const today = new Date();
    const isToday = isSameDay(selectedDate, today);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const isTomorrow = isSameDay(selectedDate, tomorrow);
    const key = dateKey(selectedDate);
    const allSlots = scheduleData.slots || [];

    // Filter by time of day
    const filteredSlots = allSlots.filter(it => {
      const rawT = it.slotTime || it.time || '05:00';
      const h = parseInt(rawT.split(':')[0]) || 5;
      if (timeFilter === 'morning') return h >= 5 && h < 12;
      if (timeFilter === 'afternoon') return h >= 12 && h < 17;
      if (timeFilter === 'evening') return h >= 17 && h <= 23;
      return true;
    });

    const bookedCount = allSlots.filter(i => !i.free && i.isPrimary !== false).length;
    const freeCount = allSlots.filter(i => i.free).length;
    const activeBatches = scheduleData.activeBatches || [];

    let html = `
      ${renderNotificationBannerIfNeeded()}
      <div class="datenav">
        <button class="arrow" id="prevDay">‹</button>
        <div class="dateinfo">
          <div class="big">${fmtDateLong(selectedDate)}</div>
          <div class="small">${isToday ? "Today" : isTomorrow ? "Tomorrow" : DAY_SHORT[selectedDate.getDay()]}${activeBatches.length ? " · " + activeBatches.map(b => b.name).join(" & ") : " · No regular batch"}</div>
        </div>
        <button class="arrow" id="nextDay">›</button>
      </div>

      <div class="quickjump">
        <button class="chip ${isToday ? 'active' : ''}" id="jumpToday">Today</button>
        <button class="chip ${isTomorrow ? 'active' : ''}" id="jumpTomorrow">Tomorrow</button>
        <input type="date" id="jumpDate" style="background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;outline:none;" value="${key}"/>
      </div>

      <!-- Time of Day Filter (5 AM to 11 PM) -->
      <div class="quickjump" style="margin-top:-4px;margin-bottom:12px;">
        <button class="chip ${timeFilter === 'all' ? 'active' : ''}" data-tf="all">All (5 AM–11 PM)</button>
        <button class="chip ${timeFilter === 'morning' ? 'active' : ''}" data-tf="morning">Morning (5–12)</button>
        <button class="chip ${timeFilter === 'afternoon' ? 'active' : ''}" data-tf="afternoon">Afternoon (12–5)</button>
        <button class="chip ${timeFilter === 'evening' ? 'active' : ''}" data-tf="evening">Evening (5–11)</button>
      </div>

      <div class="row between" style="margin-bottom:12px;align-items:center;">
        <div class="summary" style="margin:0;flex:1;margin-right:8px;">
          <div class="s"><div class="num">${allSlots.length}</div><div class="lbl">1-Hr Slots</div></div>
          <div class="s"><div class="num" style="color:var(--accent)">${bookedCount}</div><div class="lbl">Classes</div></div>
          <div class="s"><div class="num" style="color:var(--good)">${freeCount}</div><div class="lbl">Free Hours</div></div>
        </div>
        <div class="row gap6">
          <button class="btn warn sm" id="btnTopBlockSlot" style="white-space:nowrap;padding:10px 12px;font-weight:800;background:linear-gradient(180deg,#F59E0B 0%,#D97706 100%);color:#fff;border:none;box-shadow:0 2px 8px rgba(245,158,11,0.3);">🚫 Block Classes</button>
          <button class="btn primary sm" id="btnTopBookSlot" style="white-space:nowrap;padding:10px 12px;font-weight:700;">+ Book Slot</button>
        </div>
      </div>`;

    html += filteredSlots.length === 0
      ? `<div class="empty">No slots in this time window.</div>`
      : filteredSlots.map(it => renderSlotCard(it, key)).join("");

    main.innerHTML = html;

    const notifBtn = document.getElementById("btnEnableNotifBanner");
    if (notifBtn) {
      notifBtn.onclick = () => requestPushPermissionAndSubscribe(currentUser);
    }

    const topBlockBtn = document.getElementById("btnTopBlockSlot");
    if (topBlockBtn) {
      topBlockBtn.onclick = () => openStudioBlockModal(key);
    }
    const topBookBtn = document.getElementById("btnTopBookSlot");
    if (topBookBtn) {
      const firstFree = allSlots.find(s => s.free);
      topBookBtn.onclick = () => openBookSheet('16:00', key);
    }

    document.getElementById("prevDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() - 1); refreshSchedule(); };
    document.getElementById("nextDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpToday").onclick = () => { selectedDate = new Date(); refreshSchedule(); };
    document.getElementById("jumpTomorrow").onclick = () => { selectedDate = new Date(); selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpDate").onchange = (e) => {
      if (e.target.value) {
        const [y, m, d] = e.target.value.split("-").map(Number);
        selectedDate = new Date(y, m - 1, d);
        refreshSchedule();
      }
    };

    const schSearch = document.getElementById("schSearchInput");
    if (schSearch) {
      schSearch.oninput = () => {
        const query = schSearch.value.trim().toLowerCase();
        main.querySelectorAll(".slot").forEach(slotEl => {
          if (!query) {
            slotEl.style.display = "";
          } else {
            const text = slotEl.textContent.toLowerCase();
            slotEl.style.display = text.includes(query) ? "" : "none";
          }
        });
      };
    }
    main.querySelectorAll("[data-tf]").forEach(btn => {
      btn.onclick = () => {
        timeFilter = btn.getAttribute("data-tf");
        renderCoachTab();
      };
    });

    main.querySelectorAll("[data-book-slot]").forEach(btn => btn.onclick = () => openBookSheet(btn.getAttribute("data-book-slot"), key));
    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });
    main.querySelectorAll("[data-msg]").forEach(btn => btn.onclick = () => openMessageSheet(btn.getAttribute("data-msg"), btn.getAttribute("data-msg-mobile")));
    main.querySelectorAll("[data-perf-slot]").forEach(btn => btn.onclick = () => openPerformanceModal(btn.getAttribute("data-perf-slot")));
    main.querySelectorAll("[data-edit-student]").forEach(btn => btn.onclick = () => openEditStudentSheet(btn.getAttribute("data-edit-student")));

    // Solo Student Attendance
    main.querySelectorAll("[data-mark]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-mark");
      const statusToSet = btn.getAttribute("data-status");
      const currentStatus = btn.getAttribute("data-current");
      const newStatus = (currentStatus === statusToSet) ? null : statusToSet;
      try {
        await api.post('/api/attendance', { date: key, studentId, status: newStatus });
        refreshSchedule();
      } catch (e) {
        showToast("Failed to record attendance");
      }
    });

    // Sibling Group Combined Attendance
    main.querySelectorAll("[data-group-all-present]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-present");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'present');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'present', memberStatuses });
        showToast("✓ All siblings marked present");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-all-absent]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-absent");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'absent');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'absent', memberStatuses });
        showToast("✕ All siblings marked absent");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-partial]").forEach(btn => btn.onclick = () => {
      const studentId = btn.getAttribute("data-group-partial");
      const item = scheduleData.slots.find(s => s.id === studentId);
      if (item) openGroupAttendanceSheet(item, key);
    });

    main.querySelectorAll("[data-cancel-booking]").forEach(btn => btn.onclick = async () => {
      const bid = btn.getAttribute("data-cancel-booking");
      if (confirm("Cancel this booking?")) {
        try {
          await api.delete('/api/bookings/' + bid);
          refreshSchedule();
          showToast("Booking cancelled");
        } catch (e) {
          showToast("Error cancelling booking");
        }
      }
    });
  }

  function renderSlotCard(it, key) {
    if (it.isBlocked) {
      return `<div class="slot" style="background:linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);border:2px dashed #F59E0B;box-shadow:0 4px 14px rgba(245,158,11,0.15);margin-bottom:12px;">
        <div class="row between">
          <div class="time" style="color:#B45309;font-weight:800;">${fmtTime(it.slotTime)}</div>
          <span class="badge warn" style="background:#F59E0B;color:#ffffff;font-weight:800;font-size:10px;padding:3px 8px;">🚫 STUDIO BLOCKED</span>
        </div>
        <div style="margin:8px 0 4px;font-weight:800;font-size:15px;color:#92400E;">
          🔒 ${escapeHtml(it.blockReason || 'Studio Closed / Holiday')}
        </div>
        <div class="muted" style="font-size:11.5px;color:#B45309;line-height:1.4;">
          Studio is closed during this time. Classes are suspended &amp; online booking is locked.
        </div>
        <div class="actionrow" style="margin-top:10px;">
          <button class="btn ghost sm" data-remove-block="${it.blockId}" style="border-color:#F59E0B;color:#B45309;font-weight:700;padding:5px 12px;">🔓 Unlock &amp; Open Slot</button>
        </div>
      </div>`;
    }

    if (it.free) {
      return `<div class="slot free">
        <div class="row between"><div class="time">${fmtTime(it.slotTime)}</div><span class="badge present">Open Slot</span></div>
        <div class="actionrow"><button class="btn primary sm" data-book-slot="${it.slotTime}">+ Book Slot (Regular / Flexible)</button></div>
      </div>`;
    }

    // Continuation card for 2nd or 3rd hour of a multi-hour class
    if (it.isPrimary === false) {
      return `<div class="slot slot-continuation">
        <div class="row between">
          <div class="time" style="font-size:13.5px;color:var(--muted);">${fmtTime(it.slotTime)}</div>
          <span class="badge duration">↳ Hour ${it.hourIndex} of ${it.durationHours}</span>
        </div>
        <div style="font-size:13px;margin-top:2px;"><b>${escapeHtml(it.name)}</b> <span class="muted">(Continued from ${fmtTime(it.primarySlotTime)})</span></div>
      </div>`;
    }

    const template = scheduleData.template || "Hi {name} 🎵 Reminder: you have class at {time}.";
    const msgText = template.replace("{name}", it.name).replace("{time}", fmtTime(it.slotTime)).replace("{date}", fmtDateLong(selectedDate));
    const isGroup = it.slotType && it.slotType !== 'solo';
    
    // Status Badge calculation
    let statusBadge = "";
    if (it.status === 'present') {
      statusBadge = `<span class="badge present" style="margin-left:6px;">${isGroup ? '✓ All Present' : '✓ Present'}</span>`;
    } else if (it.status === 'absent') {
      statusBadge = `<span class="badge absent" style="margin-left:6px;">${isGroup ? '✕ All Absent' : '✕ Not coming'}</span>`;
    } else if (it.status === 'partial') {
      const absentMems = Object.entries(it.memberStatuses || {}).filter(([k,v]) => v === 'absent').map(([k]) => k);
      const totalMems = (it.groupMembers && it.groupMembers.length) || Object.keys(it.memberStatuses || {}).length || 2;
      const presentCount = totalMems - absentMems.length;
      statusBadge = `<span class="badge partial" style="margin-left:6px;">🟡 ${presentCount} Present, ${absentMems.length} Absent${absentMems.length > 0 ? ' (' + absentMems.join(', ') + ')' : ''}</span>`;
    }

    let attendanceButtons = "";
    if (it.type === 'regular') {
      if (!isGroup) {
        attendanceButtons = `
          <button class="btn ${it.status === 'present' ? 'good' : 'ghost'}" data-mark="${it.id}" data-status="present" data-current="${it.status || ''}">✓ Present</button>
          <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-mark="${it.id}" data-status="absent" data-current="${it.status || ''}">Not coming</button>`;
      } else {
        attendanceButtons = `
          <button class="btn ${it.status === 'present' ? 'good' : 'ghost'}" data-group-all-present="${it.id}">✓ All Present</button>
          <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-group-all-absent="${it.id}">✕ All Absent</button>
          <button class="btn ${it.status === 'partial' ? 'good' : 'ghost'}" data-group-partial="${it.id}">👥 Sibling Attendance</button>`;
      }
    }

    let outOfBatchBadge = (it.isOutOfBatch || it.studentId) ? '<span class="badge warn" style="background:#F59E0B;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;">⚡ Out-of-Batch</span>' : '';
    let outOfBatchAttendance = "";
    if (it.type === 'occasional' && it.studentId) {
      attendanceButtons = `
        <button class="btn ${it.status === 'present' ? 'good' : 'ghost'}" data-mark="${it.studentId}" data-status="present" data-current="${it.status || ''}">✓ Present</button>
        <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-mark="${it.studentId}" data-status="absent" data-current="${it.status || ''}">Not coming</button>`;
    }
    const cancelBtn = (it.type === 'occasional' || it.type === 'makeup') ? `<button class="btn warn" data-cancel-booking="${it.id}">Cancel</button>` : "";
    const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(it.slotType)}</span>` : '';

        ${it.type === 'regular' ? `
          <button class="btn primary" data-perf-slot="${it.id}">⭐ Evaluate</button>

  // ═════════════════════════════════════════════════════════════════════════════
  // ⏰ AUTOMATIC UNMARKED ATTENDANCE ALARM & SOUND ENGINE
  // ═════════════════════════════════════════════════════════════════════════════
  let alarmAudioElement = null;
  let isAlarmRinging = false;
  let activeAlarmData = null;
  const dismissedSlotAlarms = new Set();

  
  // ═══════════ UNIVERSAL BROWSER AUDIO & SOUND UNLOCK ENGINE ═══════════
  let globalAudioCtx = null;
  let isAudioUnlocked = false;

  function unlockAudioEngine() {
    if (isAudioUnlocked) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        if (!globalAudioCtx) globalAudioCtx = new AudioContextClass();
        if (globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }
        // Play silent 1-sample buffer to permanently unlock mobile audio
        const buffer = globalAudioCtx.createBuffer(1, 1, 22050);
        const source = globalAudioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(globalAudioCtx.destination);
        source.start(0);
      }

      // Pre-warm alarm audio element
      getAlarmAudio();
      if (alarmAudioElement) {
        alarmAudioElement.volume = 1.0;
      }

      isAudioUnlocked = true;
      console.log('Browser Audio & Speaker Engine permanently unlocked!');
    } catch (e) {
      console.warn('Audio unlock notice:', e);
    }
  }

  window.addEventListener('pointerdown', unlockAudioEngine, { passive: true });
  window.addEventListener('touchstart', unlockAudioEngine, { passive: true });
  window.addEventListener('click', unlockAudioEngine, { passive: true });

  // Standalone Test Alarm Sound Player
  let isTestAlarmPlaying = false;
  let testAlarmTimeout = null;

  function toggleTestAlarmSound(btnEl) {
    unlockAudioEngine();
    if (isTestAlarmPlaying) {
      // Stop test sound
      if (testAlarmTimeout) clearTimeout(testAlarmTimeout);
      stopAlarmSound();
      isTestAlarmPlaying = false;
      if (btnEl) {
        btnEl.textContent = "🔊 Test Alarm Sound";
        btnEl.className = "btn ghost sm";
      }
      showToast("Alarm sound stopped");
      return;
    }

    isTestAlarmPlaying = true;
    if (btnEl) {
      btnEl.textContent = "⏹️ Stop Alarm Sound";
      btnEl.className = "btn warn sm";
    }

    showToast("🔊 Playing alarm test sound (Speaker active)");
    
    // Play sound
    try {
      const audio = getAlarmAudio();
      audio.currentTime = 0;
      audio.volume = 1.0;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => playSynthAlarmTone());
      }
    } catch (e) {
      playSynthAlarmTone();
    }

    if (navigator.vibrate) {
      try { navigator.vibrate([300, 150, 300, 150, 400]); } catch(e) {}
    }

    testAlarmTimeout = setTimeout(() => {
      stopAlarmSound();
      isTestAlarmPlaying = false;
      if (btnEl) {
        btnEl.textContent = "🔊 Test Alarm Sound";
        btnEl.className = "btn ghost sm";
      }
    }, 4500);
  }

  function getAlarmAudio() {
    if (!alarmAudioElement) {
      alarmAudioElement = new Audio('/alarm.mp3');
      alarmAudioElement.loop = true;
      alarmAudioElement.preload = 'auto';
    }
    return alarmAudioElement;
  }

  let alarmSynthInterval = null;

  function playSynthAlarmBeep() {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, now); // A5
      osc.frequency.setValueAtTime(1174.66, now + 0.15); // D6
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.35);
    } catch(e) {}
  }

  function startAlarmSound() {
    isAlarmRinging = true;
    const audio = getAlarmAudio();
    audio.play().catch(e => {
      console.log("Audio autoplay waiting for user interaction:", e.message);
      playSynthAlarmBeep();
      if (!alarmSynthInterval) {
        alarmSynthInterval = setInterval(() => {
          if (isAlarmRinging) playSynthAlarmBeep();
        }, 1000);
      }
    });
  }

  function stopAlarmSound() {
    isAlarmRinging = false;
    if (alarmSynthInterval) {
      clearInterval(alarmSynthInterval);
      alarmSynthInterval = null;
    }
    if (alarmAudioElement) {
      alarmAudioElement.pause();
      alarmAudioElement.currentTime = 0;
    }
    const modal = document.getElementById("activeAlarmModalOverlay");
    if (modal) modal.remove();
  }

  function checkAttendanceAlarm() {
    if (isAlarmRinging) return;
    const today = new Date();
    const todayKey = dateKey(today);
    const nowMinutes = today.getHours() * 60 + today.getMinutes();

    if (currentRole === 'coach') {
      if (!scheduleData || !scheduleData.slots) return;
      const curSelectedKey = dateKey(selectedDate);
      if (curSelectedKey !== todayKey) return;

      for (const slot of scheduleData.slots) {
        if (slot.free || slot.isPrimary === false) continue;
        const [sh, sm] = (slot.slotTime || '00:00').split(':').map(Number);
        const slotStartMins = sh * 60 + sm;
        const dur = slot.durationHours || 1;
        const slotEndMins = slotStartMins + (dur * 60);

        const isSlotTimeNow = (nowMinutes >= slotStartMins && nowMinutes < slotEndMins);
        const alarmKey = `${todayKey}_${slot.id}_${slot.slotTime}`;
        const isUnmarked = (!slot.status || (slot.status !== 'present' && slot.status !== 'absent' && slot.status !== 'partial'));

        if (isSlotTimeNow && isUnmarked && !dismissedSlotAlarms.has(alarmKey)) {
          triggerSlotAlarm({
            role: 'coach',
            alarmKey,
            studentId: slot.id,
            name: slot.name,
            mobile: slot.mobile,
            time: slot.slotTime,
            durationHours: dur,
            slotType: slot.slotType,
            groupMembers: slot.groupMembers,
            instruments: slot.instruments,
            dateStr: todayKey
          });
          break;
        }
      }
    } else if (currentRole === 'student' && currentUser && currentUser.status === 'active') {
      const b = batchById(currentUser.batchId);
      const isTodayBatch = b && b.days && b.days.includes(today.getDay());
      if (!isTodayBatch) return;

      const [sh, sm] = (currentUser.time || '00:00').split(':').map(Number);
      const slotStartMins = sh * 60 + sm;
      const dur = currentUser.durationHours || 1;
      const slotEndMins = slotStartMins + (dur * 60);

      const isSlotTimeNow = (nowMinutes >= slotStartMins && nowMinutes < slotEndMins);
      const alarmKey = `${todayKey}_student_${currentUser.id}_${currentUser.time}`;
      const todayAtt = attStatuses[todayKey];
      const isUnmarked = (!todayAtt || (todayAtt !== 'present' && todayAtt !== 'absent' && todayAtt !== 'partial'));

      if (isSlotTimeNow && isUnmarked && !dismissedSlotAlarms.has(alarmKey)) {
        triggerSlotAlarm({
          role: 'student',
          alarmKey,
          studentId: currentUser.id,
          name: currentUser.name,
          mobile: currentUser.mobile,
          time: currentUser.time,
          durationHours: dur,
          slotType: currentUser.slotType,
          groupMembers: currentUser.groupMembers,
          dateStr: todayKey
        });
      }
    }
  }

          </div>
        `}

        <button class="btn ghost block" id="btnAlarmDismiss" style="font-size:12.5px;padding:9px;color:var(--muted);">🔇 Mute &amp; Dismiss Alarm</button>
      </div>`;

    document.body.appendChild(overlay);

    const dismissBtn = overlay.querySelector("#btnAlarmDismiss");

      };

    if (data.role === 'coach') {

            dismissedSlotAlarms.add(data.alarmKey);

          } catch (e) {
            showToast("Error updating attendance");

      if (absBtn) {

          try {

      const absBtn = overlay.querySelector("#btnAlarmStudentAbsent");

      if (attBtn) {

            renderStudentView();
          } catch (e) {
            showToast("Error updating status");
          }
        };
      }

      if (absBtn) {
        absBtn.onclick = async () => {
          try {
            await api.post('/api/attendance', { date: data.dateStr, studentId: data.studentId, status: 'absent' });
            dismissedSlotAlarms.add(data.alarmKey);
            stopAlarmSound();
            showToast("Coach notified of absence.");
            renderStudentView();
          } catch (e) {
            showToast("Error updating status");
          }
        };
      }
    }
  }

  setInterval(checkAttendanceAlarm, 10000);

  // ---------- SIBLING GROUP INDIVIDUAL ATTENDANCE MODAL ----------
  function openGroupAttendanceSheet(item, dateStr) {
    const members = (item.groupMembers && item.groupMembers.length > 0)
      ? item.groupMembers
      : [{ name: item.name }];

    const currentStatuses = { ...(item.memberStatuses || {}) };
    members.forEach(m => {
      if (!currentStatuses[m.name]) {
        currentStatuses[m.name] = (item.status === 'absent') ? 'absent' : 'present';
      }
    });

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">👥 Combined Sibling Attendance</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="student-row" style="background:var(--bg-deep);margin-bottom:12px;">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="phone">${dateStr} · ${fmtTimeRange(item.slotTime || item.time, item.durationHours || 1)}</div>
      </div>

      <div class="row gap8" style="margin-bottom:14px;">
        <button class="btn good" id="btnGroupAllPres" style="flex:1;justify-content:center;">✓ All Present</button>
        <button class="btn warn" id="btnGroupAllAbs" style="flex:1;justify-content:center;">✕ All Absent</button>
      </div>

      <label style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:8px;display:block;">
        Individual Sibling / Member Status:
      </label>

      <div id="memberAttList">
        ${members.map(m => `
          <div class="member-att-row" data-member="${escapeHtml(m.name)}">
            <div style="font-weight:600;font-size:14px;">${escapeHtml(m.name)}</div>
            <div class="pill-group">
              <button class="pill-btn pill-present ${currentStatuses[m.name] === 'present' ? 'active' : ''}" data-act="present">✓ Present</button>
              <button class="pill-btn pill-absent ${currentStatuses[m.name] === 'absent' ? 'active' : ''}" data-act="absent">✕ Absent</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div id="attSummaryText" style="background:rgba(210,162,76,0.12);border:1px solid var(--accent);padding:10px 12px;border-radius:10px;margin:12px 0;font-size:12.5px;text-align:center;">
        Loading status…
      </div>

      <button class="btn primary block" id="btnSaveGroupAtt">Save Sibling Attendance</button>`;

    openSheet(html, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      function updateSummaryText() {
        const total = members.length;
        const absentList = members.filter(m => currentStatuses[m.name] === 'absent').map(m => m.name);
        const presentCount = total - absentList.length;
        const sumEl = ov.querySelector("#attSummaryText");

        if (absentList.length === 0) {
          sumEl.innerHTML = `<span style="color:var(--good);font-weight:700;">🟢 All ${total} siblings attending</span>`;
        } else if (absentList.length === total) {
          sumEl.innerHTML = `<span style="color:var(--bad);font-weight:700;">🔴 All ${total} siblings absent</span>`;
        } else {
          sumEl.innerHTML = `<span style="color:var(--accent);font-weight:700;">🟡 ${presentCount} Present · ${absentList.length} Absent: <i>${escapeHtml(absentList.join(', '))}</i></span>`;
        }
      }

      function refreshPillUI() {
        ov.querySelectorAll(".member-att-row").forEach(row => {
          const mName = row.getAttribute("data-member");
          const st = currentStatuses[mName];
          row.querySelector(".pill-present").classList.toggle("active", st === 'present');
          row.querySelector(".pill-absent").classList.toggle("active", st === 'absent');
        });
        updateSummaryText();
      }

      ov.querySelectorAll(".member-att-row").forEach(row => {
        const mName = row.getAttribute("data-member");
        row.querySelector(".pill-present").onclick = () => {
          currentStatuses[mName] = 'present';
          refreshPillUI();
        };
        row.querySelector(".pill-absent").onclick = () => {
          currentStatuses[mName] = 'absent';
          refreshPillUI();
        };
      });

      ov.querySelector("#btnGroupAllPres").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'present');
        refreshPillUI();
      };

      ov.querySelector("#btnGroupAllAbs").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'absent');
        refreshPillUI();
      };

      refreshPillUI();

      ov.querySelector("#btnSaveGroupAtt").onclick = async () => {
        const total = members.length;
        const absentCount = members.filter(m => currentStatuses[m.name] === 'absent').length;

        let finalStatus = 'present';
        if (absentCount === total) finalStatus = 'absent';
        else if (absentCount > 0) finalStatus = 'partial';

        try {
          await api.post('/api/attendance', {
            date: dateStr,
            studentId: item.id,
            status: finalStatus,
            memberStatuses: currentStatuses
          });
          ov.remove();
          showToast(`Attendance recorded (${finalStatus})!`);
          if (currentUser.role === 'coach') refreshSchedule();
          else renderStudentView();
        } catch (err) {
          showToast(err.message || "Failed to save attendance");
        }
      };
    });
  }

  // ---------- AVAILABLE SLOTS HELPER (HIDES ALREADY BOOKED/OCCUPIED TIMES IN BATCH) ----------
  
  function getAvailableSlotsForCustomDays(daysArray, durationHours = 1, excludeStudentId = null) {
    const allSlots = (configData.slots || DEFAULT_HOURLY_SLOTS).slice().sort();
    if (!Array.isArray(daysArray) || daysArray.length === 0) return allSlots.map(t => ({ time: t, label: fmtTime(t) }));

    const occupiedSet = new Set();
    for (const s of (studentsData || [])) {
      if (s.id === excludeStudentId) continue;
      let sDays = [];
      if (s.customDays) {
        try { sDays = typeof s.customDays === 'string' ? JSON.parse(s.customDays) : s.customDays; } catch(e) {}
      } else {
        const b = batchById(s.batchId);
        if (b && b.days) sDays = b.days;
      }
      const overlaps = sDays.some(d => daysArray.includes(d));
      if (overlaps) {
        const dur = s.durationHours || 1;
        const occ = getOccupiedSlotList(s.time || s.time_slot, dur);
        for (const t of occ) occupiedSet.add(t);
      }
    }

    const available = [];
    for (const t of allSlots) {
      const needed = getOccupiedSlotList(t, durationHours);
      const isOutOfBounds = needed.some(slotT => !allSlots.includes(slotT));
      const conflict = needed.find(slotT => occupiedSet.has(slotT));
      if (!isOutOfBounds && !conflict) {
        available.push({ time: t, label: fmtTime(t) });
      }
    }
    return available;
  }

  function getAvailableSlotsForBatch(batchId, durationHours = 1, excludeStudentId = null) {
    const allSlots = (configData.slots || DEFAULT_HOURLY_SLOTS).slice().sort();
    const batchStudents = (studentsData || []).filter(s => s.batchId === batchId && s.id !== excludeStudentId);
    
    const occupiedMap = {};
    for (const s of batchStudents) {
      const dur = s.durationHours || 1;
      const occ = getOccupiedSlotList(s.time, dur);
      for (const t of occ) {
        occupiedMap[t] = s.name;
      }
    }

    const availableSlots = [];
    for (const t of allSlots) {
      const needed = getOccupiedSlotList(t, durationHours);
      const isOutOfBounds = needed.some(slotT => !allSlots.includes(slotT));
      const conflict = needed.find(slotT => occupiedMap[slotT]);
      
      if (!isOutOfBounds && !conflict) {
        availableSlots.push({ time: t, label: fmtTime(t) });
      }
    }
    return availableSlots;
  }

      function getEffectiveDays() {
        if (schMode === '3days') {
          return chosenBatch === 'batchB' ? [2, 4, 6] : [1, 3, 5];
        } else if (schMode === '2days') {
          return selectedCustomDays;
        } else {
          return selectedCustomDays.slice(0, 1);
        }
      }

      function updateTimeSlots() {
        const dur = parseInt(ov.querySelector("#asDuration").value) || 1;
        const effDays = getEffectiveDays();
        const available = getAvailableSlotsForCustomDays(effDays, dur);
        const sel = ov.querySelector("#asTime");
        const confirmBtn = ov.querySelector("#asConfirm");
        if (available.length === 0) {
          sel.innerHTML = `<option value="">⚠️ No free ${dur}h slots in this schedule</option>`;
          confirmBtn.disabled = true;
        } else {
          sel.innerHTML = available.map(a => `<option value="${a.time}">${a.label}</option>`).join("");

              selectedCustomDays = selectedCustomDays.filter(x => x !== d);
              btn.classList.remove("active");

              const removed = selectedCustomDays.shift();
              ov.querySelector(`#as2DayChips .as-d-btn[data-d="${removed}"]`)?.classList.remove("active");

          const txtEl = ov.querySelector("#as2DaysText");
          if (txtEl) {
            const names = selectedCustomDays.map(x => dayNamesMap[x]).join(' & ');

        try {
          const effDays = getEffectiveDays();

            batchId: schMode === '3days' ? chosenBatch : (schMode === '2days' ? 'custom_2days' : 'custom_1day'),
            customDays: schMode !== '3days' ? effDays : null,
            time,
            durationHours: dur,
            slotType: req.slotType,
            groupName,
            groupMembers: req.groupMembers,
            instruments: req.instruments
          });
          ov.remove();
          requestsData = requestsData.filter(r => r.id !== req.id);
          showToast(`${groupName || req.name} enrolled for ${dur}h successfully!`);
          await loadDataForRole();
          renderCoachTab();

          showToast(err.message || "Failed to assign student");
          btn.disabled = false;
          btn.textContent = isGroup ? "Confirm & Create Sibling Profiles in Roster" : "Confirm & Enroll Solo Student in Roster";
        }
      };
    });
  }

    });

      return b && b.days && b.days.length === 2;

      const gKey = s.groupId || s.groupName || (s.time + '_' + s.batchId) || s.id;

        groupMap.set(gKey, {
          ...s,
          cardTitle: s.groupName || s.name,
          isConsolidatedGroup: true
        });
      }

    const distinctGroups = Array.from(groupMap.values());

    else if (studentViewMode === 'regular') displayedList = regularStudents;
    else if (studentViewMode === 'flexible') displayedList = flexibleStudents;
    else if (studentViewMode === 'twice_a_week') displayedList = twiceWeekStudents;
