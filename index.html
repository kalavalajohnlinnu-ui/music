  function openMakeupBookingModal() {
    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">🔄 Available Make-up Slots</h3>
        <button class="close" data-close>✕</button>
      </div>
      <div class="muted" style="font-size:12.5px;margin-bottom:12px;">
        When other students are absent, their slot opens for make-up/compensation classes:
      </div>
      <div id="makeupSlotList"><div class="loading">Finding open slots…</div></div>`;

    openSheet(html, async (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();
      const listEl = ov.querySelector("#makeupSlotList");

      try {
        const res = await api.get('/api/makeup-slots');
        const slots = res.makeupSlots || [];

        if (slots.length === 0) {
          listEl.innerHTML = `
            <div class="empty" style="padding:24px 10px;">
              <div class="big">🎼</div>
              <div style="font-weight:600;font-size:14px;">No open make-up slots right now</div>
              <div class="muted" style="font-size:12px;margin-top:4px;">As soon as someone marks "Can't make it", their slot will appear here!</div>
            </div>`;
          return;
        }

        listEl.innerHTML = slots.map(mk => `
          <div class="slot makeup-open" style="margin-bottom:8px;">
            <div class="row between">
              <div>
                <div class="time" style="color:var(--makeup);">${mk.date_key} · ${fmtTimeRange(mk.time_slot, mk.duration_hours || 1)}</div>
                <div class="muted" style="font-size:11.5px;margin-top:2px;">Vacated by: ${escapeHtml(mk.vacated_by_name)}</div>
              </div>
              <button class="btn makeup" data-claim-mk="${mk.id}" data-date="${mk.date_key}" data-time="${mk.time_slot}">
                Claim Slot
              </button>
            </div>
          </div>`).join("");

        listEl.querySelectorAll("[data-claim-mk]").forEach(btn => {
          btn.onclick = async () => {
            const mkId = btn.getAttribute("data-claim-mk");
            const date = btn.getAttribute("data-date");
            const time = btn.getAttribute("data-time");

            if (confirm(`Book this make-up class on ${date} at ${fmtTime(time)}?`)) {
              try {
                btn.disabled = true;
                btn.textContent = "Reserving…";
                await api.post('/api/makeup-slots/claim', { makeupId: mkId });
                showToast("Make-up class booked successfully!");
                ov.remove();
                await loadDataForRole();
                render();
              } catch (e) {
                showToast(e.message || "Failed to book make-up slot");
                btn.disabled = false;
                btn.textContent = "Claim Slot";
              }
            }
          };
        });

      } catch (e) {
        listEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load make-up slots</div>`;
      }
    });
  }

          await requestPushPermissionAndSubscribe(currentUser);

    const testAlarmBtn = document.getElementById("btnTestAlarmSound");
    if (testAlarmBtn) {

    document.getElementById("changePinBtn").onclick = async () => {

      const newPin = document.getElementById("newPin").value.trim();
      if (!currentPin || !newPin) { showToast("Please fill both PIN fields"); return; }
      try {
        await api.post('/api/auth/coach/change-pin', { currentPin, newPin });
        showToast("Passcode updated!");
      } catch (err) {
        showToast(err.message || "Failed to update PIN");
      }
    };

    const restoreBtn = document.getElementById("btnRestoreJson");
    const restoreInput = document.getElementById("restoreJsonInput");
    if (restoreBtn && restoreInput) {
      restoreBtn.onclick = () => restoreInput.click();
      restoreInput.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (re) => {
          try {
            const parsed = JSON.parse(re.target.result);
            if (!parsed.students) { showToast("Invalid backup JSON file"); return; }
            if (confirm(`Restore ${parsed.students.length} students & attendance records from this backup?`)) {
              const res = await api.post('/api/admin/restore-json', parsed);
              showToast(res.message || "Backup restored successfully! 🎉");
              await loadDataForRole();
              renderCoachTab();
            }
          } catch (err) {
            showToast("Failed to restore backup: " + err.message);
          }
        };
        reader.readAsText(file);
      };
    }

    


    document.getElementById("resetBtn").onclick = async () => {
      if (confirm("Erase all students, bookings, requests, attendance and performance logs?")) {
        await api.post('/api/settings/reset', {});
        showToast("All data reset");
        await loadDataForRole();
        renderCoachTab();
      }
    };
  }

    // Sheets & Autocomplete
  function openSheet(innerHtml, onMount) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.innerHTML = `<div class="sheet"><div class="ios-grabber"></div>${innerHtml}</div>`;
    
    // Auto-bind click to close on backdrop
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) overlay.remove();
    });

    // Auto-bind ANY and ALL close buttons inside the sheet (.close, [data-close], etc.)
    overlay.querySelectorAll(".close, [data-close], .btn-close").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        overlay.remove();
      });
    });

    document.body.appendChild(overlay);
    if (onMount) onMount(overlay);
    return overlay;
  }

      const nameInput = ov.querySelector("#bkName");
      const mobileInput = ov.querySelector("#bkMobile");
      const timeSlotInput = ov.querySelector("#bkTimeSlotInput");
      const durSelect = ov.querySelector("#bkDuration");
      const slotTypeSelect = ov.querySelector("#bkSlotType");
      const dateInput = ov.querySelector("#bkDate");
      const lessonInput = ov.querySelector("#bkLesson");
      const confirmBtn = ov.querySelector("#bkConfirm");
      const bkPhotoWrap = ov.querySelector("#bkPhotoWrap");
      const bkPhotoInput = ov.querySelector("#bkPhotoInput");
      const bkPhotoPreview = ov.querySelector("#bkPhotoPreview");
      const bkPhotoLabelText = ov.querySelector("#bkPhotoLabelText");
      const bkPhotoHelpText = ov.querySelector("#bkPhotoHelpText");
      const stuSelectDropdown = ov.querySelector("#bkStudentSelectDropdown");
      const noteEl = ov.querySelector("#outOfBatchNote");

      // Quick time chip setters
      ov.querySelectorAll("[data-set-time]").forEach(btn => {
        btn.onclick = () => {
          const t = btn.getAttribute("data-set-time");
          timeSlotInput.value = `${fmtTime(t)} (${t})`;
        };
      });

      if (bkPhotoWrap) {
        bkPhotoWrap.onclick = () => {
          if (bkPhotoInput) bkPhotoInput.click();
        };
      }

      if (bkPhotoInput) {
        bkPhotoInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          openPhotoCropModal(file, (croppedDataUrl) => {
            bkPhotoBase64 = croppedDataUrl;
            if (bkPhotoPreview) bkPhotoPreview.src = croppedDataUrl;
          });
        };
      }

      tabFlex.onclick = () => {
        bookingType = "flexible";
        tabFlex.className = "active";
        tabReg.className = "";
        if (regFields) regFields.style.display = "none";
        if (dateFieldWrap) dateFieldWrap.style.display = "block";
        if (bkPhotoLabelText) bkPhotoLabelText.innerHTML = 'Student Photo (Optional)';
        if (bkPhotoHelpText) bkPhotoHelpText.textContent = 'Upload photo (Optional for flexible)';
        confirmBtn.textContent = "Confirm Flexible Session Booking";
      };

      tabReg.onclick = () => {
        bookingType = "regular";
        tabReg.className = "active";
        tabFlex.className = "";
        if (regFields) regFields.style.display = "block";
        if (dateFieldWrap) dateFieldWrap.style.display = "none";
        if (bkPhotoLabelText) bkPhotoLabelText.innerHTML = 'Student Photo <span style="color:#EF4444;">* (Compulsory)</span>';
        if (bkPhotoHelpText) bkPhotoHelpText.textContent = 'Mandatory photo for regular enrollment';
        confirmBtn.textContent = "Enroll as Fixed Regular Batch Student";
      };

      if (stuSelectDropdown) {
        stuSelectDropdown.onchange = () => {
          const sId = stuSelectDropdown.value;
          if (!sId) {
            selectedStudentId = null;
            isOutOfBatchBooking = false;
            if (noteEl) noteEl.style.display = "none";
            return;
          }
          const foundStu = (studentsData || []).find(s => s.id === sId);
          if (foundStu) {
            selectedStudentId = foundStu.id;
            nameInput.value = foundStu.name;
            mobileInput.value = foundStu.mobile;
            if (foundStu.photo) {
              bkPhotoBase64 = foundStu.photo;
              if (bkPhotoPreview) bkPhotoPreview.src = foundStu.photo;
            }
            if (foundStu.durationHours) durSelect.value = foundStu.durationHours.toString();
            if (foundStu.slotType) slotTypeSelect.value = foundStu.slotType;
            if (foundStu.instruments && Array.isArray(foundStu.instruments)) {
              selectedInstruments.clear();
              foundStu.instruments.forEach(i => selectedInstruments.add(i));
              ov.querySelectorAll("#bkInstGrid .tag-item").forEach(tag => {
                const inst = tag.getAttribute("data-inst");
                tag.classList.toggle("selected", selectedInstruments.has(inst));
              });
            }
            isOutOfBatchBooking = true;
            if (noteEl) noteEl.style.display = "block";
          }
        };
      }

      ov.querySelectorAll("#bkInstGrid .tag-item").forEach(tag => {
        tag.onclick = () => {
          const inst = tag.getAttribute("data-inst");
          if (selectedInstruments.has(inst)) {
            selectedInstruments.delete(inst);
            tag.classList.remove("selected");
          } else {
            selectedInstruments.add(inst);
            tag.classList.add("selected");
          }
        };
      });

      ov.querySelectorAll("#bkBatchPicker .batchcard").forEach(b => {
        b.onclick = () => {
          ov.querySelectorAll("#bkBatchPicker .batchcard").forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          chosenBatch = b.getAttribute("data-batch");
        };
      });

      confirmBtn.onclick = async () => {
        const name = nameInput.value.trim();
        const mobile = mobileInput.value.trim();
        const chosenTimeSlot = parseFlexibleTimeInput(timeSlotInput.value, defaultTime);
        const dur = parseInt(durSelect.value) || 1;
        const sType = slotTypeSelect.value;
        const bookingDate = dateInput.value;
        const instArray = Array.from(selectedInstruments);

        if (!name) { showToast("Please enter student name"); nameInput.focus(); return; }
        if (!mobile || normalizePhone(mobile).length < 10) { showToast("Please enter a valid 10-digit mobile"); mobileInput.focus(); return; }

        // Mandatory photo check ONLY for regular batch enrollment
        if (bookingType === "regular" && (!bkPhotoBase64 || bkPhotoBase64.length < 30)) {
          showToast("Student photo is COMPULSORY for regular batch enrollment!");
          const wrap = ov.querySelector("#bkPhotoWrap");
          if (wrap) {
            wrap.style.border = "3px solid #EF4444";
            wrap.style.borderRadius = "50%";
            setTimeout(() => { wrap.style.border = "none"; }, 2500);
          }
          return;
        }

        try {
          confirmBtn.disabled = true;
          confirmBtn.textContent = "Processing...";

          if (bookingType === "flexible") {
            await api.post('/api/bookings', {
              name,
              mobile,
              photo: bkPhotoBase64 || '',
              date: bookingDate,
              time: chosenTimeSlot,
              durationHours: dur,
              slotType: sType,
              instruments: instArray,
              studentId: selectedStudentId || null,
              isOutOfBatch: Boolean(selectedStudentId || isOutOfBatchBooking)
            });
            showToast("✓ Flexible slot booked successfully at " + fmtTime(chosenTimeSlot) + "!");
          } else {
            const lesson = lessonInput ? lessonInput.value.trim() : '';
            await api.post('/api/students', {
              name,
              mobile,
              photo: bkPhotoBase64,
              batchId: stSchMode === '3days' ? chosenBatch : (stSchMode === '2days' ? 'custom_2days' : 'custom_1day'),
          customDays: stSchMode !== '3days' ? getStEffectiveDays() : null,
              time: chosenTimeSlot,
              durationHours: dur,
              slotType: sType,
              studentType: 'regular',
              instruments: instArray,
              currentLesson: lesson,
              timezone: 'Asia/Kolkata',
              country: 'India'
            });
            showToast("✓ Enrolled new student into " + chosenBatch + " at " + fmtTime(chosenTimeSlot));
          }

          ov.remove();
          refreshSchedule();
          if (typeof loadStudentsList === 'function') loadStudentsList();
        } catch (e) {
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Confirm & Reserve Slot";
          showToast(e.message || "Failed to book slot");
        }
      };
    });
  }

      }

      document.getElementById("viewBrochureStuBtn").onclick = openFeeStructureModal;
      document.getElementById("openContactSirBtn").onclick = openContactSirSheet;

      document.getElementById("viewMyReportBtn").onclick = () => {
        openAttendanceReportModal(currentUser.id, false);
      };

      main.querySelectorAll("[data-group-modal]").forEach(btn => {
        btn.onclick = () => {
          const dk = btn.getAttribute("data-group-modal");
          openGroupAttendanceSheet({
            id: currentUser.id,
            name: currentUser.name,
            time: currentUser.time,
            durationHours: currentUser.durationHours,
            groupMembers: currentUser.groupMembers,
            memberStatuses: memberAttStatuses[dk] || {},
            status: attStatuses[dk]
          }, dk);
        };
      });

      main.querySelectorAll("[data-notcoming]").forEach(btn => btn.onclick = async () => {
        const dk = btn.getAttribute("data-notcoming");
        const current = attStatuses[dk];
        const newStatus = (current === 'absent') ? null : 'absent';
        try {
          await api.post('/api/attendance', { date: dk, studentId: currentUser.id, status: newStatus });
          showToast(newStatus === 'absent' ? "Music Teacher notified about student absence." : "Marked attending");
          renderStudentView();
        } catch (e) {
          showToast("Failed to update status");
        }
      });

      // One-time 1-minute setup modal for new student devices
      const onboardKey = 'sur_onboarded_' + (currentUser.id || currentUser.mobile);
      const stTzSelect = document.getElementById("stuTimezoneSelect");
      if (stTzSelect) {
        stTzSelect.onchange = (e) => {
          currentUser.timezone = e.target.value;
          selectedUserTimezone = e.target.value;
          renderStudentView();
        };
      }
      if (!localStorage.getItem(onboardKey)) {
        setTimeout(() => openStudentOnboardingModal(onboardKey), 400);
      }

      applyScrollTriggers(main);
      return;
    }

    if (currentUser.status === 'pending') {
      main.innerHTML = `
        <div class="empty" style="padding:40px 10px;">
          <div class="big">⏳</div>
          <h2 style="font-size:20px;margin-bottom:8px;">Enrollment Under Review</h2>
          <div class="muted" style="font-size:13.5px;line-height:1.5;">
            Hi <b>${escapeHtml(currentUser.name || 'there')}</b>!<br/>
            Your enrollment application (${durationLabel(currentUser.durationHours)}) has been received.<br/>
            <b>Music Sir will review and assign your confirmed class time slot soon.</b><br/>
            Your weekly schedule will appear here automatically.
          </div>
        </div>
        <button class="btn ghost block" id="viewBrochurePending" style="margin-bottom:8px;">📋 View 9 Studio Instruments &amp; Fee Structure</button>
        <button class="btn ghost block" id="openContactSirPending" style="margin-bottom:8px;">📞 Contact Sir (9848173025)</button>
        <button class="btn primary block" id="refreshReqBtn">↻ Check Status</button>`;

      document.getElementById("viewBrochurePending").onclick = openFeeStructureModal;
      document.getElementById("openContactSirPending").onclick = openContactSirSheet;
      document.getElementById("refreshReqBtn").onclick = async () => {
        await loadDataForRole();
        render();
        showToast("Checked status");
      };
      applyScrollTriggers(main);
      return;
    }

    // New Student / Sibling Join Form
    const allInstruments = configData.instruments || STUDIO_INSTRUMENTS;
    const initialName = currentUser.name || '';
    const initialMobile = currentUser.mobile || '';

    main.innerHTML = `
      <div class="empty" style="padding:20px 4px 10px;">
        <div class="big">🎵</div>
        <h2 style="font-size:20px;">Join Music Classes</h2>
        <div class="muted" style="font-size:13px;">10 Studio Instruments · Solo &amp; Sibling Group Slots</div>
      </div>

      <button class="btn ghost block" id="btnViewBrochureJoin" style="margin-bottom:14px;border-color:var(--accent);color:var(--accent);">
        📋 View Official Fee Chart &amp; Course Details
      </button>

      <!-- Primary Applicant Info (Top Section) -->
      <div class="card" style="padding:14px;background:var(--card-solid);border:1.5px solid var(--accent);border-radius:12px;margin-bottom:14px;">
        <div style="font-weight:700;font-size:14px;color:var(--accent-deep);margin-bottom:10px;">👤 Applicant Contact Information</div>
        
        <!-- Applicant Profile Photo Upload (COMPULSORY) -->
        <div id="reqPhotoBox" style="text-align:center;margin-bottom:16px;padding:14px;background:linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%);border:2px dashed var(--accent);border-radius:16px;box-shadow:0 4px 14px rgba(2,132,199,0.12);transition:all 0.3s ease;">
          <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;">
            <span style="font-weight:800;font-size:13px;color:var(--accent-deep);">Applicant Profile Photo</span>
            <span style="background:#EF4444;color:#FFFFFF;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:10px;">* REQUIRED</span>
          </div>
          <div style="position:relative;display:inline-block;margin-bottom:8px;">
            <img id="joinPhotoPreview" src="${DEFAULT_STUDENT_AVATAR}" style="width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 4px 14px rgba(2,132,199,0.25);background:#FFFFFF;display:block;margin:0 auto;" onerror="this.src=DEFAULT_STUDENT_AVATAR" />
          </div>
          <div>
            <label style="background:linear-gradient(180deg, #38BDF8 0%, #0284C7 100%);color:#ffffff;padding:7px 18px;border-radius:22px;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(2,132,199,0.3);">
              📷 Take or Choose Photo (Mandatory)
              <input type="file" id="joinPhotoInput" accept="image/*" style="display:none;" />
            </label>
          </div>
        </div>

        <div class="field">
          <label>Your Full Name</label>
          <input type="text" id="mainApplicantName" value="${escapeHtml(initialName)}" placeholder="e.g. Rahul Sharma" />
        </div>

        <div class="field">
          <label>Primary 10-Digit Mobile Number</label>
          <input type="tel" id="mainApplicantMobile" value="${escapeHtml(initialMobile)}" placeholder="10-digit mobile number" />
        </div>

        <div class="field" style="margin-bottom:0;">
          <label style="font-size:12px;font-weight:700;color:var(--accent-deep);display:flex;align-items:center;justify-content:space-between;">
            <span>🌍 Country &amp; Timezone (International)</span>
            <span style="font-size:10px;color:var(--muted);font-weight:400;">Auto-Detected</span>
          </label>
          <select id="reqTimezone" style="font-size:12.5px;padding:9px 12px;width:100%;border-radius:8px;border:1px solid var(--line);">
            ${renderTimezoneOptions(selectedUserTimezone, false)}
          </select>
        </div>
      </div>

      <div class="field">
        <label>Class Slot Format *</label>
        <select id="reqSlotType">
          <option value="" disabled selected>-- Select Class Slot Format --</option>
          <option value="solo">👤 Individual Student (Solo 1-on-1)</option>
          <option value="sibling_duo">👫 Sibling Duo (2 Members / Brothers &amp; Sisters)</option>
          <option value="sibling_trio">👨‍👩‍👧 Sibling Trio (3 Members)</option>
        </select>
      </div>

      <div class="field">
        <label>Class Duration (Hours per class) *</label>
        <select id="reqDuration">
          <option value="" disabled selected>-- Select Duration (Hours per class) --</option>
          <option value="1">⏱️ 1 Hour (Standard Class Slot)</option>
          <option value="2">⏱️ 2 Hours (Double Slot — Recommended for Siblings)</option>
          <option value="3">⏱️ 3 Hours (Triple Slot)</option>
        </select>
      </div>

      <!-- Solo Section (Shown when Solo is selected) -->
      <div id="reqSoloWrap" style="display:none;">
        <div class="field">
          <label>What instrument(s) do you want to learn? (Select from 9 Studio Instruments)</label>
          <div class="tag-select-grid" id="reqSoloInstGrid">
            ${allInstruments.map(i => `<span class="tag-item" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
          </div>
        </div>
      </div>

      <!-- Sibling Duo / Trio Section (Shown when Sibling Duo or Trio is selected) -->
      <div id="reqSiblingWrap" style="display:none;">
        <div class="field">
          <label>Family / Sibling Group Name (Optional)</label>
          <input type="text" id="reqGroupName" placeholder="e.g. Sharma Siblings / Rahul &amp; Priya Duo" />
        </div>

        <!-- Sibling 1 (Automatically filled from Applicant) -->
        <div class="card" style="padding:14px;background:var(--card-solid);border:1.5px solid var(--accent);border-radius:12px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div style="font-weight:700;font-size:14px;color:var(--accent-deep);" id="sib1HeaderLabel">👤 Sibling 1 (You: ${escapeHtml(initialName || 'Applicant')})</div>
            <span class="badge regular" style="font-size:11px;">Primary Applicant</span>
          </div>
          <div class="muted" style="font-size:12px;margin-bottom:10px;" id="sib1SubLabel">
            Name: <b>${escapeHtml(initialName || '—')}</b> · Mobile: <b>${escapeHtml(initialMobile || '—')}</b>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label style="font-size:12px;font-weight:600;">What instrument(s) does Sibling 1 learn?</label>
            <div class="tag-select-grid" id="reqMem1InstGrid">
              ${allInstruments.map(i => `<span class="tag-item" data-mem-inst="1" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
            </div>
          </div>
        </div>

        <!-- Sibling 2 (Second Sibling) -->
        <div class="card" style="padding:14px;background:var(--card-solid);border:1.5px solid var(--accent);border-radius:12px;margin-bottom:12px;">
          <div style="font-weight:700;font-size:14px;color:var(--accent-deep);margin-bottom:8px;">👤 Sibling 2 (Brother / Sister)</div>
          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11.5px;">Sibling 2 Full Name *</label>
            <input type="text" id="reqMem2Name" placeholder="Enter Sibling's Full Name" />
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11.5px;">Sibling 2 Mobile (Optional — defaults to Primary Contact)</label>
            <input type="tel" id="reqMem2Mobile" placeholder="Optional 10-digit mobile" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label style="font-size:12px;font-weight:600;">What instrument(s) does Sibling 2 learn?</label>
            <div class="tag-select-grid" id="reqMem2InstGrid">
              ${allInstruments.map(i => `<span class="tag-item" data-mem-inst="2" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
            </div>
          </div>
        </div>

        <!-- Sibling 3 (Trio Only) -->
        <div id="reqMem3Card" class="card" style="display:none;padding:14px;background:var(--card-solid);border:1.5px solid var(--accent);border-radius:12px;margin-bottom:12px;">
          <div style="font-weight:700;font-size:14px;color:var(--accent-deep);margin-bottom:8px;">👤 Sibling 3 (Third Member)</div>
          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11.5px;">Sibling 3 Full Name *</label>
            <input type="text" id="reqMem3Name" placeholder="Enter 3rd Sibling's Full Name" />
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label style="font-size:11.5px;">Sibling 3 Mobile (Optional — defaults to Primary Contact)</label>
            <input type="tel" id="reqMem3Mobile" placeholder="Optional 10-digit mobile" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label style="font-size:12px;font-weight:600;">What instrument(s) does Sibling 3 learn?</label>
            <div class="tag-select-grid" id="reqMem3InstGrid">
              ${allInstruments.map(i => `<span class="tag-item" data-mem-inst="3" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
            </div>
          </div>
        </div>
      </div>

      <div id="reqRemainingForm" style="display:none;">
        <div class="field">
          <label>Preferred Days &amp; Note for Music Sir (Optional)</label>
          <textarea id="reqNote" placeholder="e.g. Prefer Mon/Wed/Fri evening slots between 5-8 PM, prior musical background"></textarea>
        </div>

        <div class="muted" style="font-size:12px;background:rgba(14, 165, 233,0.08);padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-bottom:14px;line-height:1.4;text-align:left;">
          ℹ️ <b>Individual Profiles:</b> Each sibling will have their own separate profile, attendance record, and certificate in the roster. Music Sir will review your application and assign your confirmed regular class timing.
        </div>

        <button class="btn primary block" id="reqSend">Submit Application to Music Teacher</button>
      </div>`;

    document.getElementById("btnViewBrochureJoin").onclick = openFeeStructureModal;

    let joinPhotoBase64 = '';
    const joinPhotoInput = document.getElementById("joinPhotoInput");
    if (joinPhotoInput) {
      joinPhotoInput.onchange = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        openPhotoCropModal(file, (compressedBase64) => {
          joinPhotoBase64 = compressedBase64;
          const prevEl = document.getElementById("joinPhotoPreview");
          if (prevEl) prevEl.src = joinPhotoBase64;
          showToast("Photo positioned & attached! 📷");
        });
      };
    }

    const mainNameInput = document.getElementById("mainApplicantName");
    const mainMobileInput = document.getElementById("mainApplicantMobile");
    const reqType = document.getElementById("reqSlotType");
    const reqDur = document.getElementById("reqDuration");
    const reqSoloWrap = document.getElementById("reqSoloWrap");
    const reqSibWrap = document.getElementById("reqSiblingWrap");
    const reqMem3Card = document.getElementById("reqMem3Card");
    const sib1Header = document.getElementById("sib1HeaderLabel");
    const sib1Sub = document.getElementById("sib1SubLabel");

    const updateSib1Display = () => {
      const curN = mainNameInput.value.trim() || 'Applicant';
      const curM = mainMobileInput.value.trim() || '—';
      if (sib1Header) sib1Header.textContent = `👤 Sibling 1 (You: ${curN})`;
      if (sib1Sub) sib1Sub.innerHTML = `Name: <b>${escapeHtml(curN)}</b> · Mobile: <b>${escapeHtml(curM)}</b>`;
    };

    mainNameInput.addEventListener("input", updateSib1Display);
    mainMobileInput.addEventListener("input", updateSib1Display);

    const reqSoloInst = new Set();
    const reqMem1Inst = new Set();
    const reqMem2Inst = new Set();
    const reqMem3Inst = new Set();

    function updateStudentJoinSections() {
      const val = reqType.value;
      const dur = reqDur.value;
      const remForm = document.getElementById("reqRemainingForm");

      if (!val || !dur) {
        reqSoloWrap.style.display = 'none';
        reqSibWrap.style.display = 'none';
        if (remForm) remForm.style.display = 'none';
        return;
      }
      if (val === 'solo') {
        reqSoloWrap.style.display = 'block';
        reqSibWrap.style.display = 'none';
      } else {
        reqSoloWrap.style.display = 'none';
        reqSibWrap.style.display = 'block';
        reqMem3Card.style.display = (val === 'sibling_trio') ? 'block' : 'none';
      }
      if (remForm) remForm.style.display = 'block';
    }

    reqType.onchange = () => {
      updateStudentJoinSections();
    };

    reqDur.onchange = () => {
      updateStudentJoinSections();
    };

    // Initialize dropdowns to unselected prompt
    reqType.value = "";
    reqDur.value = "";
    updateStudentJoinSections();

    // Solo tag click handler
    document.querySelectorAll("#reqSoloInstGrid .tag-item").forEach(item => {
      item.onclick = () => {
        const inst = item.getAttribute("data-inst");
        if (reqSoloInst.has(inst)) {
          reqSoloInst.delete(inst);
          item.classList.remove("selected");
        } else {
          reqSoloInst.add(inst);
          item.classList.add("selected");
        }
      };
    });

    // Sibling 1 tag click handler
    document.querySelectorAll("#reqMem1InstGrid .tag-item").forEach(item => {
      item.onclick = () => {
        const inst = item.getAttribute("data-inst");
        if (reqMem1Inst.has(inst)) {
          reqMem1Inst.delete(inst);
          item.classList.remove("selected");
        } else {
          reqMem1Inst.add(inst);
          item.classList.add("selected");
        }
      };
    });

    // Sibling 2 tag click handler
    document.querySelectorAll("#reqMem2InstGrid .tag-item").forEach(item => {
      item.onclick = () => {
        const inst = item.getAttribute("data-inst");
        if (reqMem2Inst.has(inst)) {
          reqMem2Inst.delete(inst);
          item.classList.remove("selected");
        } else {
          reqMem2Inst.add(inst);
          item.classList.add("selected");
        }
      };
    });

    // Sibling 3 tag click handler
    document.querySelectorAll("#reqMem3InstGrid .tag-item").forEach(item => {
      item.onclick = () => {
        const inst = item.getAttribute("data-inst");
        if (reqMem3Inst.has(inst)) {
          reqMem3Inst.delete(inst);
          item.classList.remove("selected");
        } else {
          reqMem3Inst.add(inst);
          item.classList.add("selected");
        }
      };
    });

    document.getElementById("reqSend").onclick = async () => {
      const applicantName = mainNameInput.value.trim();
      const applicantMobile = mainMobileInput.value.trim();
      const slotType = reqType.value;
      const durationHours = parseInt(reqDur.value) || 0;
      const note = document.getElementById("reqNote").value.trim();

      if (!joinPhotoBase64) {
        const photoBox = document.getElementById("reqPhotoBox");
        if (photoBox) {
          photoBox.style.borderColor = "#EF4444";
          photoBox.style.background = "#FEF2F2";
          if (typeof gsap !== 'undefined') {
            gsap.fromTo(photoBox, { x: -8 }, { x: 8, duration: 0.06, repeat: 5, yoyo: true, onComplete: () => gsap.to(photoBox, { x: 0 }) });
          }
          photoBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (window.navigator && window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
        showToast("⚠️ Student Photo is COMPULSORY! Please tap 'Take or Choose Photo'.");
        return;
      }
      if (!applicantName) { showToast("Please enter your full name"); return; }
      if (normalizePhone(applicantMobile).length < 10) { showToast("Please enter a valid 10-digit mobile number"); return; }
      if (!slotType) { showToast("Please select Class Slot Format"); return; }
      if (!durationHours) { showToast("Please select Class Duration"); return; }

      let name = applicantName;
      let mobile = applicantMobile;
      let groupName = '';
      const groupMembers = [];
      let allSelectedInst = [];

      if (slotType === 'solo') {
        allSelectedInst = Array.from(reqSoloInst);
      } else {
        const m1Name = applicantName;
        const m1Mob = applicantMobile;
        const m2Name = document.getElementById("reqMem2Name").value.trim();
        const m2Mob = document.getElementById("reqMem2Mobile").value.trim() || applicantMobile;
        groupName = document.getElementById("reqGroupName").value.trim() || `${m1Name} & ${m2Name} Duo`;

        if (!m2Name) {
          showToast("Please enter Sibling 2's Full Name");
          return;
        }

        name = groupName;
        mobile = m1Mob;

        groupMembers.push({
          name: m1Name,
          mobile: m1Mob,
          instruments: Array.from(reqMem1Inst)
        });

        groupMembers.push({
          name: m2Name,
          mobile: m2Mob,
          instruments: Array.from(reqMem2Inst)
        });

        if (slotType === 'sibling_trio') {
          const m3Name = document.getElementById("reqMem3Name").value.trim();
          const m3Mob = document.getElementById("reqMem3Mobile").value.trim() || applicantMobile;
          if (!m3Name) { showToast("Please enter Sibling 3's Full Name"); return; }
          groupMembers.push({
            name: m3Name,
            mobile: m3Mob,
            instruments: Array.from(reqMem3Inst)
          });
        }

        allSelectedInst = Array.from(new Set([...reqMem1Inst, ...reqMem2Inst, ...reqMem3Inst]));
      }

      const sendBtn = document.getElementById("reqSend");
      sendBtn.disabled = true;
      sendBtn.textContent = "Submitting…";

      try {
        const studentTZ = document.getElementById("reqTimezone") ? document.getElementById("reqTimezone").value : selectedUserTimezone;
        await api.post('/api/requests', {
          name,
          mobile,
          timezone: studentTZ,
          photo: joinPhotoBase64 || null,
          note,
          durationHours,
          slotType,
          groupName,
          groupMembers,
          instruments: allSelectedInst
        });
        showToast(`Application submitted successfully! Music Teacher will assign your confirmed regular slot.`);
        await loadDataForRole();
        render();
      } catch (err) {
        showToast(err.message || "Failed to submit application");
        sendBtn.disabled = false;
        sendBtn.textContent = "Submit Application to Music Teacher";
      }
    };

    applyScrollTriggers(main);
  }

  // Start App
  
  // Force Service Worker cache update
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let reg of registrations) {
        reg.update();
      }
    });
  }

  initApp();

  // Safety Fallback: Guarantee screen renders within 1.2s under any network condition
  setTimeout(() => {
    const app = document.getElementById("app");
    if (app && app.innerHTML.includes("Connecting to Music Slot")) {
      renderLoginScreen();
    }
  }, 1200);
})();
</script>
</body>
</html>
