  // ---------- ATTENDANCE REPORT & PDF ----------
  async function openAttendanceReportModal(studentId, isCoach) {
    const now = new Date();
    let fromDate = new Date(now.getFullYear(), now.getMonth(), 1);
    let toDate = new Date(now.getFullYear(), now.getMonth() + 1, 0);

    const formatISO = d => dateKey(d);

    const sheetHtml = `
      <div class="sheethead"><h3 style="margin:0;">📊 Student Report</h3><button class="close" data-close>✕</button></div>

      <div class="row gap8" style="margin-bottom:12px;">
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">From</label>
          <input type="date" id="repFrom" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(fromDate)}" />
        </div>
        <div style="flex:1;">
          <label style="font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:600;display:block;margin-bottom:4px;">To</label>
          <input type="date" id="repTo" style="width:100%;background:var(--bg-deep);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;" value="${formatISO(toDate)}" />
        </div>
      </div>

      <div class="quickjump" style="margin-bottom:12px;">
        <button class="chip active" id="chipThisMonth">This Month</button>
        <button class="chip" id="chipLastMonth">Last Month</button>
        <button class="chip" id="chipLast30">Last 30 Days</button>
      </div>

      <div id="reportContent"><div class="loading">Generating report…</div></div>

      <div class="actionrow" style="margin-top:16px;">
        <button class="btn primary" id="btnDownloadPdf" style="flex:1;justify-content:center;padding:12px;">📄 Download PDF</button>
        ${isCoach ? `<button class="btn good" id="btnSendWa" style="flex:1;justify-content:center;padding:12px;">💬 Send on WhatsApp</button>` : ''}
      </div>`;

    let reportData = null;

    openSheet(sheetHtml, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      const repFromInput = ov.querySelector("#repFrom");
      const repToInput = ov.querySelector("#repTo");
      const contentEl = ov.querySelector("#reportContent");

      async function fetchAndRenderReport() {
        contentEl.innerHTML = '<div class="loading">Generating report…</div>';
        try {
          const from = repFromInput.value;
          const to = repToInput.value;
          const res = await api.get(`/api/students/${studentId}/attendance-report?from=${from}&to=${to}`);
          reportData = res;

          const s = res.student;
          const sum = res.summary;
          const classes = res.classes || [];

          contentEl.innerHTML = `
            <div class="student-row" style="margin-bottom:10px;background:var(--bg-deep);">
              <div class="name">${escapeHtml(s.name)}</div>
              <div class="phone">${s.mobile} · ${s.batchName} · ${fmtTimeRange(s.time, s.durationHours || 1)}</div>
              ${s.instruments && s.instruments.length > 0 ? `<div style="margin-top:4px;">${s.instruments.map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ")}</div>` : ''}
            </div>

            <div class="stat-grid">
              <div class="stat-box">
                <div class="val" style="color:var(--text);">${sum.totalClasses}</div>
                <div class="lbl">Classes</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--good);">${sum.presentCount}</div>
                <div class="lbl">Attended</div>
              </div>
              <div class="stat-box">
                <div class="val" style="color:var(--accent);">${sum.attendancePct}%</div>
                <div class="lbl">Attendance</div>
              </div>
            </div>

            ${sum.avgRating ? `<div style="background:var(--card-2);padding:10px;border-radius:10px;margin-bottom:10px;text-align:center;">
              <span style="font-size:13px;color:var(--accent);">⭐ Average Performance Rating: <b>${sum.avgRating} / 5.0</b></span>
            </div>` : ''}

            <h4 style="margin:14px 0 8px;">Class Breakdown</h4>
            <div style="background:var(--bg-deep);border:1px solid var(--line);border-radius:10px;max-height:220px;overflow-y:auto;">
              ${classes.length === 0 ? '<div class="muted" style="padding:16px;text-align:center;">No scheduled classes in this period.</div>' :
                classes.map(c => {
                  let statusTxt = c.status === 'present' ? '✓ Present' : c.status === 'absent' ? '✕ Absent' : 'Unmarked';
                  let memberBreakdown = '';
                  if (c.status === 'partial' && c.memberStatuses) {
                    const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
                    statusTxt = `Partial (${abs.length} Absent)`;
                    memberBreakdown = `<div style="font-size:11px;color:var(--accent);margin-top:2px;">Absent: ${abs.join(', ')}</div>`;
                  }

                  return `
                    <div class="history-item">
                      <div class="row between">
                        <div>
                          <div style="font-weight:600;font-size:13px;">${c.date} (${c.dayName.slice(0,3)})</div>
                          <div class="muted" style="font-size:11px;">Slot: ${fmtTimeRange(c.time, c.durationHours || 1)}</div>
                          ${memberBreakdown}
                        </div>
                        <div class="row gap6">
                          <span class="badge ${c.status}">${statusTxt}</span>
                          ${isCoach ? `
                            <button class="btn ${c.status === 'present' ? 'good' : 'ghost'}" data-rep-mark="present" data-rep-date="${c.date}" title="Mark Present" style="padding:5px 8px;font-size:11px;">✓</button>
                            <button class="btn ${c.status === 'absent' ? 'warn' : 'ghost'}" data-rep-mark="absent" data-rep-date="${c.date}" title="Mark Absent" style="padding:5px 8px;font-size:11px;">✕</button>
                          ` : ''}
                        </div>
                      </div>
                      ${c.performance ? `<div style="font-size:11.5px;color:var(--accent);margin-top:4px;">Rating: ${'★'.repeat(c.performance.ratingOverall)} ${c.performance.remarks ? `— "${escapeHtml(c.performance.remarks)}"` : ''}</div>` : ''}
                    </div>`;
                }).join("")}
            </div>`;

          if (isCoach) {
            contentEl.querySelectorAll("[data-rep-mark]").forEach(btn => {
              btn.onclick = async () => {
                const date = btn.getAttribute("data-rep-date");
                const st = btn.getAttribute("data-rep-mark");
                try {
                  await api.post('/api/attendance', { date, studentId, status: st });
                  showToast(`${st === 'present' ? '✓ Present' : '✕ Absent'} recorded for ${date}`);
                  fetchAndRenderReport();
                  await loadDataForRole();
                  renderCoachTab();
                } catch (e) {
                  showToast("Failed to update attendance");
                }
              };
            });
          }
        } catch (err) {
          contentEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load report: ${escapeHtml(err.message)}</div>`;
        }
      }

      ov.querySelector("#chipThisMonth").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipThisMonth").classList.add("active");
        repFromInput.value = formatISO(new Date(now.getFullYear(), now.getMonth(), 1));
        repToInput.value = formatISO(new Date(now.getFullYear(), now.getMonth() + 1, 0));
        fetchAndRenderReport();
      };

      ov.querySelector("#chipLastMonth").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipLastMonth").classList.add("active");
        repFromInput.value = formatISO(new Date(now.getFullYear(), now.getMonth() - 1, 1));
        repToInput.value = formatISO(new Date(now.getFullYear(), now.getMonth(), 0));
        fetchAndRenderReport();
      };

      ov.querySelector("#chipLast30").onclick = () => {
        ov.querySelectorAll(".quickjump .chip").forEach(c => c.classList.remove("active"));
        ov.querySelector("#chipLast30").classList.add("active");
        const d30 = new Date(now);
        d30.setDate(d30.getDate() - 30);
        repFromInput.value = formatISO(d30);
        repToInput.value = formatISO(now);
        fetchAndRenderReport();
      };

      repFromInput.onchange = fetchAndRenderReport;
      repToInput.onchange = fetchAndRenderReport;

      function generatePdfDocument() {
        if (!reportData || !window.jspdf) {
          showToast("PDF generator loading, try again in a moment");
          return null;
        }
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const s = reportData.student;
        const sum = reportData.summary;
        const range = reportData.range;

        // Header
        doc.setFillColor(18, 48, 43);
        doc.rect(0, 0, 210, 36, 'F');
        doc.setTextColor(243, 238, 221);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(20);
        doc.text('Sir Slot — Music Academy', 14, 18);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(159, 189, 178);
        doc.text('STUDENT PROGRESS & ATTENDANCE REPORT (5 AM - 11 PM)', 14, 26);

        // Details
        doc.setTextColor(30, 30, 30);
        doc.setFontSize(12);
        doc.setFont('helvetica', 'bold');
        doc.text(`Student: ${s.name}`, 14, 48);

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.text(`Mobile: +91 ${s.mobile} · Sir Helpline: +91 ${COACH_PRIMARY_MOBILE}`, 14, 55);
        doc.text(`Batch: ${s.batchName} (${s.batchSub})`, 14, 62);
        doc.text(`Class Slot: ${fmtTimeRange(s.time, s.durationHours || 1)} · ${slotTypeLabel(s.slotType)}`, 14, 69);
        if (s.instruments && s.instruments.length > 0) {
          doc.text(`Instruments Learning: ${s.instruments.join(', ')}`, 14, 76);
        }

        // Summary Box
        doc.setFillColor(240, 245, 243);
        doc.roundedRect(120, 46, 76, 34, 3, 3, 'F');
        doc.setTextColor(18, 48, 43);
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.text(`Attendance Rate: ${sum.attendancePct}%`, 124, 54);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.text(`Attended: ${sum.presentCount} / ${sum.totalClasses} classes`, 124, 61);
        doc.text(`Missed: ${sum.absentCount} classes`, 124, 67);
        if (sum.avgRating) {
          doc.setFont('helvetica', 'bold');
          doc.text(`Performance: ${sum.avgRating} / 5.0 Stars`, 124, 74);
        }

        // Table
        const tableRows = (reportData.classes || []).map((c, idx) => {
          let stLabel = c.status === 'present' ? 'Present (✓)' : c.status === 'absent' ? 'Absent (✕)' : 'Unmarked';
          if (c.status === 'partial' && c.memberStatuses) {
            const abs = Object.entries(c.memberStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
            stLabel = `Partial (${abs.join(', ')} absent)`;
          }

          return [
            idx + 1,
            c.date,
            c.dayName,
            fmtTimeRange(c.time, c.durationHours || 1),
            stLabel,
            c.performance ? `${c.performance.ratingOverall}★ (${c.performance.remarks || 'Evaluated'})` : '—'
          ];
        });

        doc.autoTable({
          startY: 85,
          head: [['#', 'Date', 'Day', 'Class Slot', 'Attendance', 'Performance / Remarks']],
          body: tableRows,
          theme: 'striped',
          headStyles: { fillColor: [28, 64, 56], textColor: [243, 238, 221], fontStyle: 'bold' },
          alternateRowStyles: { fillColor: [248, 250, 249] },
          styles: { fontSize: 8.5, cellPadding: 3 }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
          doc.setPage(i);
          doc.setFontSize(8);
          doc.setTextColor(130);
          doc.text(`Sir Slot Studio Progress Report • Page ${i} of ${pageCount}`, 14, 288);
        }

        return doc;
      }

      ov.querySelector("#btnDownloadPdf").onclick = () => {
        const doc = generatePdfDocument();
        if (doc) {
          const fileName = `SirSlot_Report_${reportData.student.name.replace(/\s+/g, '_')}.pdf`;
          doc.save(fileName);
          showToast("PDF report downloaded!");
        }
      };

      if (isCoach && ov.querySelector("#btnSendWa")) {
        ov.querySelector("#btnSendWa").onclick = () => {
          if (!reportData) return;
          const s = reportData.student;
          const sum = reportData.summary;
          const range = reportData.range;

          const doc = generatePdfDocument();
          if (doc) doc.save(`SirSlot_Report_${s.name.replace(/\s+/g, '_')}.pdf`);

          const msg = `🎼 *Sir Slot — Student Progress Report*\n\n` +
            `👤 *Student:* ${s.name}\n` +
            `📅 *Period:* ${range.from} to ${range.to}\n` +
            `🎹 *Batch:* ${s.batchName} (${fmtTimeRange(s.time, s.durationHours || 1)})\n` +
            (s.instruments && s.instruments.length > 0 ? `🎵 *Learning:* ${s.instruments.join(', ')}\n\n` : '\n') +
            `📊 *Progress Summary:*\n` +
            `• Attendance: *${sum.attendancePct}%* (${sum.presentCount}/${sum.totalClasses} classes attended)\n` +
            (sum.avgRating ? `• Performance Rating: *${sum.avgRating} / 5.0 ⭐*\n` : '') +
            (s.currentLesson ? `• Active Lesson: _${s.currentLesson}_\n\n` : '\n') +
            `📄 _The detailed PDF report is downloaded and attached._ Keep practicing music with joy! 🎶`;

          window.open(waLink(s.mobile, msg), '_blank');
          showToast("PDF downloaded & WhatsApp opened!");
        };
      }

      fetchAndRenderReport();
    });
  }

  function openSheet(innerHtml, onMount) {
    const overlay = document.createElement("div");
    overlay.className = "overlay";

    return overlay;
  }

  // ---------- STUDENT PORTAL VIEW ----------
  async function renderStudentView() {
    const main = document.getElementById("main");
    if (!currentUser || currentUser.role !== 'student') return;

    if (currentUser.status === 'enrolled') {
      const batch = batchById(currentUser.batchId);
      const today = new Date();
      const upcoming = [];

      if (batch && batch.days) {
        for (let i = 0; i < 14 && upcoming.length < 6; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() + i);
          if (batch.days.includes(d.getDay())) upcoming.push(d);
        }
      }

      const attStatuses = {};
      const memberAttStatuses = {};
      await Promise.all(upcoming.map(async d => {
        const dk = dateKey(d);
        try {
          const sch = await api.get('/api/schedule?date=' + dk);
          const meInSlot = (sch.slots || []).find(s => s.id === currentUser.id);
          if (meInSlot) {
            attStatuses[dk] = meInSlot.status;
            memberAttStatuses[dk] = meInSlot.memberStatuses || {};
          }
        } catch (e) {}
      }));

      // Fetch student's latest performance
      let perfData = null;
      try {
        perfData = await api.get(`/api/students/${currentUser.id}/performance`);
      } catch (e) {}

      const latestLog = (perfData && perfData.logs && perfData.logs.length > 0) ? perfData.logs[0] : null;
      const isGroup = currentUser.slotType && currentUser.slotType !== 'solo';
      const instBadges = (currentUser.instruments || []).map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ");

      let membersListHtml = "";
      if (isGroup && currentUser.groupMembers && currentUser.groupMembers.length > 0) {
        membersListHtml = `<div style="font-size:12px;color:var(--accent);margin-top:5px;">
          👥 Sibling Members: <b>${currentUser.groupMembers.map(m=>escapeHtml(m.name)).join(", ")}</b>
        </div>`;
      }

      let html = `
        ${renderNotificationBannerIfNeeded()}
        <div class="student-row" style="margin-top:14px;background:var(--card-2);border-color:var(--accent);">
          <div class="row between">
            <div class="name" style="font-size:18px;">${escapeHtml(currentUser.name)}</div>
            <div>
              ${(currentUser.durationHours && currentUser.durationHours > 1) ? `<span class="badge duration">⏱️ ${currentUser.durationHours}h Class</span>` : ''}
              ${isGroup ? `<span class="badge group">${slotTypeLabel(currentUser.slotType)}</span>` : ''}
            </div>
          </div>
          <div class="phone" style="font-size:13px;color:var(--text);margin-top:2px;">
            🎼 ${batch ? batch.name + ' (' + batch.sub + ')' : 'Regular'} · <b>${fmtTimeRange(currentUser.time, currentUser.durationHours || 1)}</b>
          </div>
          ${membersListHtml}
          ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
        </div>

        ${currentUser.currentLesson || currentUser.homework || latestLog ? `
          <div class="slot" style="background:rgba(210,162,76,0.08);border-color:var(--accent);margin-top:14px;">
            <div class="row between" style="margin-bottom:8px;">
              <div style="font-weight:700;color:var(--accent);font-size:14px;">⭐ Music Lessons &amp; Homework</div>
              ${latestLog ? `<span style="font-size:12px;color:var(--accent);">${'★'.repeat(latestLog.rating_overall || 5)}</span>` : ''}
            </div>
            ${currentUser.currentLesson ? `<div style="font-size:13px;margin-bottom:6px;"><b>Current Lesson:</b> ${escapeHtml(currentUser.currentLesson)}</div>` : ''}
            ${currentUser.homework ? `<div style="font-size:13px;color:var(--text);background:var(--bg-deep);padding:8px 10px;border-radius:8px;margin-top:6px;"><b>📝 Homework:</b> ${escapeHtml(currentUser.homework)}</div>` : ''}
            ${latestLog && latestLog.remarks ? `<div class="muted" style="font-size:12px;margin-top:6px;"><b>Sir's Feedback:</b> "${escapeHtml(latestLog.remarks)}"</div>` : ''}
          </div>
        ` : ''}

        <div class="section-title"><h3 style="margin:0;">Your Upcoming Scheduled Classes</h3><div class="line"></div></div>
        ${upcoming.length === 0 ? `<div class="empty"><div class="big">📅</div>No upcoming classes scheduled.</div>` : ''}
        ${upcoming.map(d => {
          const dk = dateKey(d);
          const isT = isSameDay(d, today);
          const st = attStatuses[dk];
          const mStatuses = memberAttStatuses[dk] || {};

          let badgeHtml = "";
          if (st === 'present') badgeHtml = '<span class="badge present">✓ Attending</span>';
          else if (st === 'absent') badgeHtml = '<span class="badge absent">✕ Not coming</span>';
          else if (st === 'partial') {
            const abs = Object.entries(mStatuses).filter(([k,v]) => v === 'absent').map(([k]) => k);
            badgeHtml = `<span class="badge partial">🟡 Partial (${abs.join(', ')} absent)</span>`;
          }

          let actionButtonsHtml = "";
          if (!isGroup) {
            actionButtonsHtml = `
              <button class="btn ${st === 'absent' ? 'warn' : 'ghost'}" data-notcoming="${dk}">
                ${st === 'absent' ? "✓ Marked: Not Coming (Click to Undo)" : "Can't make it (Mark Absent)"}
              </button>`;
          } else {
            actionButtonsHtml = `
              <button class="btn ${st === 'absent' ? 'warn' : 'ghost'}" data-notcoming="${dk}">
                ${st === 'absent' ? "✓ Marked: None Coming" : "✕ All Absent"}
              </button>
              <button class="btn ${st === 'partial' ? 'primary' : 'ghost'}" data-group-modal="${dk}">
                👥 Sibling Attendance
              </button>`;
          }

          return `
            <div class="slot">
              <div class="row between">
                <div>
                  <div class="time">${fmtDateLong(d)} ${isT ? '<span class="badge regular" style="font-size:9px;">Today</span>' : ''}</div>
                  <div class="muted" style="font-size:12px;">Class timing: <b>${fmtTimeRange(currentUser.time, currentUser.durationHours || 1)}</b></div>
                </div>
                ${badgeHtml}
              </div>
              <div class="actionrow" style="margin-top:12px;">
                ${actionButtonsHtml}
              </div>
            </div>`;
        }).join("")}

        <div class="section-title"><h3 style="margin:0;">🔄 Smart Make-up Slots</h3><div class="line"></div></div>
        <div class="slot" style="background:rgba(93,173,226,0.09);border:1px solid var(--makeup);">
          <div class="row between">
            <div>
              <div style="font-weight:700;color:var(--makeup);font-size:14px;">Missed a class? Book a Make-up Slot</div>
              <div class="muted" style="font-size:12px;margin-top:3px;">Claim available slots opened by other absent students</div>
            </div>
          </div>
          <div class="actionrow" style="margin-top:10px;">
            <button class="btn makeup block" id="openMakeupBtn">🔍 Check &amp; Book Make-up Slots</button>
          </div>
        </div>

        <div class="section-title"><h3 style="margin:0;">Studio Details &amp; Reports</h3><div class="line"></div></div>
        <div class="row gap8">
          <button class="btn ghost" id="viewBrochureStuBtn" style="flex:1;justify-content:center;padding:12px;border-color:var(--accent);color:var(--accent);">📋 Fee &amp; Instruments</button>
          <button class="btn primary" id="viewMyReportBtn" style="flex:1;justify-content:center;padding:12px;">📊 My Report</button>
        </div>

        <div class="section-title"><h3 style="margin:0;">Contact Music Sir</h3><div class="line"></div></div>
        <button class="btn ghost block" id="openContactSirBtn" style="padding:13px;">📞 Contact Sir (9848173025 / 8919545774)</button>`;

      main.innerHTML = html;

      const notifBtn = document.getElementById("btnEnableNotifBanner");
      if (notifBtn) {
        notifBtn.onclick = () => requestPushPermissionAndSubscribe(currentUser);
      }

      document.getElementById("openMakeupBtn").onclick = openMakeupBookingModal;
      document.getElementById("viewBrochureStuBtn").onclick = openFeeStructureModal;
      document.getElementById("openContactSirBtn").onclick = openContactSirSheet;

      document.getElementById("viewMyReportBtn").onclick = () => {
        openAttendanceReportModal(currentUser.id, false);
      };

      main.querySelectorAll("[data-group-modal]").forEach(btn => {
        btn.onclick = () => {
          const dk = btn.getAttribute("data-group-modal");
          openGroupAttendanceSheet({
            id: currentUser.id,
            name: currentUser.name,
            time: currentUser.time,
            durationHours: currentUser.durationHours,
            groupMembers: currentUser.groupMembers,
            memberStatuses: memberAttStatuses[dk] || {},
            status: attStatuses[dk]
          }, dk);
        };
      });

      main.querySelectorAll("[data-notcoming]").forEach(btn => btn.onclick = async () => {
        const dk = btn.getAttribute("data-notcoming");
        const current = attStatuses[dk];
        const newStatus = (current === 'absent') ? null : 'absent';
        try {
          await api.post('/api/attendance', { date: dk, studentId: currentUser.id, status: newStatus });
          showToast(newStatus === 'absent' ? "Coach notified. Slot opened for make-up!" : "Marked attending");
          renderStudentView();
        } catch (e) {
          showToast("Failed to update status");
        }
      });
      return;
    }

    if (currentUser.status === 'pending') {
      main.innerHTML = `
        <div class="empty" style="padding:40px 10px;">
          <div class="big">⏳</div>
          <h2 style="font-size:20px;margin-bottom:8px;">Request Pending</h2>
          <div class="muted" style="font-size:13.5px;line-height:1.5;">
            Hi <b>${escapeHtml(currentUser.name || 'there')}</b>!<br/>
            Your join request (${durationLabel(currentUser.durationHours)}) is awaiting Music Sir's approval.<br/>
            Your class schedule and music lessons will appear here soon.
          </div>
        </div>
        <button class="btn ghost block" id="viewBrochurePending" style="margin-bottom:8px;">📋 View 10 Instruments &amp; Fee Structure</button>
        <button class="btn ghost block" id="openContactSirPending" style="margin-bottom:8px;">📞 Contact Sir (9848173025)</button>
        <button class="btn primary block" id="refreshReqBtn">↻ Check Status</button>`;

      document.getElementById("viewBrochurePending").onclick = openFeeStructureModal;
      document.getElementById("openContactSirPending").onclick = openContactSirSheet;
      document.getElementById("refreshReqBtn").onclick = async () => {
        await loadDataForRole();
        render();
        showToast("Checked status");
      };
      return;
    }

    // New Student / Sibling Join Form
    const allInstruments = configData.instruments || STUDIO_INSTRUMENTS;
    main.innerHTML = `
      <div class="empty" style="padding:20px 4px 10px;">
        <div class="big">🎵</div>
        <h2 style="font-size:20px;">Join Music Classes</h2>
        <div class="muted" style="font-size:13px;">10 Studio Instruments · 1 to 3 Hour Solo &amp; Sibling Slots</div>
      </div>

      <button class="btn ghost block" id="btnViewBrochureJoin" style="margin-bottom:14px;border-color:var(--accent);color:var(--accent);">
        📋 View Official Fee Chart &amp; Course Details
      </button>
      
      <div class="field">
        <label>Applying For</label>
        <select id="reqSlotType">
          <option value="solo">👤 Individual (Solo 1-on-1)</option>
          <option value="sibling_duo">👫 Sibling Duo (2 Brothers / Sisters)</option>
          <option value="sibling_trio">👨‍👩‍👧 Sibling Trio (3 Members)</option>
        </select>
      </div>

      <div class="field">
        <label>Class Duration (Hours per class)</label>
        <select id="reqDuration">
          <option value="1">⏱️ 1 Hour (Standard Slot)</option>
          <option value="2">⏱️ 2 Hours (Double Slot — Recommended for 2 Siblings)</option>
          <option value="3">⏱️ 3 Hours (Triple Slot — Recommended for 3 Siblings)</option>
        </select>
      </div>

      <div class="field"><label>Your Full Name / Primary Contact</label><input type="text" id="reqName" placeholder="e.g. Rahul &amp; Priya Sharma" autofocus /></div>

      <div id="reqSiblingWrap" style="display:none;background:var(--bg-deep);padding:12px;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;">
        <label style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:6px;display:block;">Sibling Member Names</label>
        <div class="field" style="margin-bottom:8px;"><input type="text" id="reqMem1" placeholder="Sibling 1 Name" /></div>
        <div class="field" style="margin-bottom:8px;"><input type="text" id="reqMem2" placeholder="Sibling 2 Name" /></div>
        <div class="field" id="reqMem3Field" style="margin-bottom:8px;display:none;"><input type="text" id="reqMem3" placeholder="Sibling 3 Name" /></div>
      </div>

      <div class="field">
        <label>Instruments You Want to Learn (Select 1, 2, or 3+ from 10 Studio Instruments)</label>
        <div class="tag-select-grid" id="reqInstGrid">
          ${allInstruments.map(i => `<span class="tag-item" data-inst="${escapeHtml(i)}">${i}</span>`).join("")}
        </div>
      </div>

      <div class="field">
        <label>Preferred Fee Package Plan</label>
        <select id="reqFeePlan">
          ${STUDIO_FEE_PLANS.map(p => `<option value="${p.classes}">📅 ${p.label}</option>`).join("")}
        </select>
      </div>

      <div class="field"><label>Note for Music Sir (Optional)</label><textarea id="reqNote" placeholder="e.g. Preferred 5-9 AM morning slots or evening slots, prior musical background"></textarea></div>
      <button class="btn primary block" id="reqSend">Send Join Request</button>`;

    document.getElementById("btnViewBrochureJoin").onclick = openFeeStructureModal;

    const reqType = document.getElementById("reqSlotType");
    const reqDur = document.getElementById("reqDuration");
    const reqSibWrap = document.getElementById("reqSiblingWrap");
    const reqMem3 = document.getElementById("reqMem3Field");
    const reqSelectedInst = new Set();

    reqType.onchange = () => {
      const val = reqType.value;
      if (val === 'solo') {
        reqSibWrap.style.display = 'none';
      } else {
        reqSibWrap.style.display = 'block';
        reqMem3.style.display = (val === 'sibling_trio') ? 'block' : 'none';
        if (val === 'sibling_duo' && reqDur.value === '1') reqDur.value = '2';
        if (val === 'sibling_trio' && (reqDur.value === '1' || reqDur.value === '2')) reqDur.value = '3';
      }
    };

    document.querySelectorAll("#reqInstGrid .tag-item").forEach(item => {
      item.onclick = () => {
        const inst = item.getAttribute("data-inst");
        if (reqSelectedInst.has(inst)) {
          reqSelectedInst.delete(inst);
          item.classList.remove("selected");
        } else {
          reqSelectedInst.add(inst);
          item.classList.add("selected");
        }
      };
    });

    document.getElementById("reqSend").onclick = async () => {
      const name = document.getElementById("reqName").value.trim();
      const note = document.getElementById("reqNote").value.trim();
      const slotType = reqType.value;
      const durationHours = parseInt(reqDur.value) || 1;

      if (!name) { showToast("Please enter your name"); return; }

      const groupMembers = [];
      if (slotType !== 'solo') {
        const m1 = document.getElementById("reqMem1").value.trim();
        const m2 = document.getElementById("reqMem2").value.trim();
        const m3 = document.getElementById("reqMem3").value.trim();
        if (m1) groupMembers.push({ name: m1 });
        if (m2) groupMembers.push({ name: m2 });
        if (m3 && slotType === 'sibling_trio') groupMembers.push({ name: m3 });
      }

      try {
        await api.post('/api/requests', {
          name,
          mobile: currentUser.mobile,
          note,
          durationHours,
          slotType,
          groupMembers,
          instruments: Array.from(reqSelectedInst)
        });
        showToast(`Join request for ${durationHours}h class sent!`);
        await loadDataForRole();
        render();
      } catch (err) {
        showToast(err.message || "Failed to send request");
      }
    };
  }

  // Start App
  initApp();
})();
</script>
</body>
</html>
