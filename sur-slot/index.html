<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Sur Slot — Music Class Booking &amp; Academy Management</title>
<meta name="theme-color" content="#B8860B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sur Slot" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- jsPDF & AutoTable for client-side PDF Generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" async></script>
<style>
  /* ═══════════ ULTRA-LUXURY BRIGHT DAYLIGHT DESIGN SYSTEM ═══════════ */
  :root{
    --bg:#FAF8F3;
    --bg-deep:#F2ECE0;
    --card:rgba(255,255,255,0.94);
    --card-solid:#FFFFFF;
    --card-2:rgba(247,243,234,0.96);
    --line:rgba(184,134,11,0.16);
    --line-strong:rgba(184,134,11,0.32);
    --line-gold:linear-gradient(90deg, rgba(184,134,11,0), rgba(184,134,11,0.4), rgba(184,134,11,0));
    --text:#181612;
    --text-secondary:#454035;
    --muted:#756E5F;
    --accent:#B8860B;
    --accent-warm:#D4AF37;
    --accent-gold-light:#F3E5AB;
    --accent-deep:#876203;
    --accent-ink:#FFFFFF;
    --accent2:#C05621;
    --good:#167338;
    --good-bg:rgba(22,115,56,0.10);
    --good-border:rgba(22,115,56,0.25);
    --bad:#C53030;
    --bad-bg:rgba(197,48,48,0.10);
    --bad-border:rgba(197,48,48,0.25);
    --makeup:#1565C0;
    --makeup-bg:rgba(21,101,192,0.10);
    --makeup-border:rgba(21,101,192,0.25);
    --group-color:#6F42C1;
    --group-bg:rgba(111,66,193,0.10);
    --group-border:rgba(111,66,193,0.25);
    --radius:18px;
    --radius-lg:24px;
    --radius-sm:10px;
    --glass:rgba(255,255,255,0.88);
    --glass-border:rgba(184,134,11,0.18);
    --glow:0 2px 20px rgba(184,134,11,0.08);
    --glow-accent:0 6px 24px rgba(184,134,11,0.3);
    --shadow-card:0 2px 4px rgba(60,45,20,0.03), 0 8px 24px -4px rgba(60,45,20,0.07), 0 18px 40px -8px rgba(184,134,11,0.05);
    --shadow-hover:0 4px 8px rgba(60,45,20,0.04), 0 14px 32px -4px rgba(60,45,20,0.10), 0 24px 48px -6px rgba(184,134,11,0.12);
    --shadow-sheet:0 -12px 48px rgba(50,35,15,0.16), 0 -2px 16px rgba(184,134,11,0.08);
    --ease-spring:cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-fluid:cubic-bezier(0.16, 1, 0.3, 1);
    --ease-bounce:cubic-bezier(0.68, -0.6, 0.32, 1.6);
    --transition-fast:180ms var(--ease-fluid);
    --transition-smooth:320ms var(--ease-fluid);
    --transition-spring:450ms var(--ease-spring);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; scroll-behavior:smooth; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Jost', 'Inter', system-ui, sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }

  /* ═══════════ LUMINOUS AMBIENT LIGHT MESH ═══════════ */
  body::before{
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(212,175,55,0.14) 0%, transparent 65%),
      radial-gradient(ellipse 70% 50% at 90% 95%, rgba(220,160,80,0.10) 0%, transparent 55%),
      radial-gradient(ellipse 60% 45% at 10% 80%, rgba(184,134,11,0.08) 0%, transparent 50%),
      radial-gradient(ellipse 50% 30% at 50% 50%, rgba(243,229,171,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  #particles-canvas{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.85;
  }

  #app{
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }

  /* ═══════════ ULTRA-LUXURY HEADER ═══════════ */
  header.top{
    padding: 20px 18px 14px;
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(180deg, rgba(250,248,243,0.98) 70%, rgba(250,248,243,0.85) 90%, transparent);
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    border-bottom: 1px solid var(--line);
  }

  .brand{
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 3px;
  }

  .brand .mark{
    font-family: 'Bodoni Moda', 'Fraunces', serif;
    font-weight: 700;
    font-size: 26px;
    background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 45%, var(--accent-warm) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
    filter: drop-shadow(0 2px 8px rgba(184,134,11,0.15));
  }

  .brand .tag{
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .whoami{
    font-size: 11.5px;
    color: var(--text-secondary);
    margin-top: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
  }

  .whoami button{
    background: rgba(184,134,11,0.06);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    position: relative;
    transition: all var(--transition-spring);
  }

  .whoami button:hover{
    background: rgba(184,134,11,0.14);
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  /* ═══════════ ANIMATED MUSICAL EQUALIZER ═══════════ */
  .equalizer{
    display: flex;
    align-items: flex-end;
    gap: 3.5px;
    height: 22px;
    margin: 10px 0 2px;
    padding: 0 2px;
  }

  .eq-bar{
    width: 4px;
    border-radius: 4px 4px 1.5px 1.5px;
    background: rgba(184,134,11,0.14);
    transition: background 0.4s ease, height 0.6s var(--ease-spring);
    position: relative;
  }

  .eq-bar.filled-regular{
    background: linear-gradient(180deg, var(--accent-warm), var(--accent));
    box-shadow: 0 0 6px rgba(184,134,11,0.35);
    animation: eqHarmonic 2.4s ease-in-out infinite alternate;
  }

  .eq-bar:nth-child(2).filled-regular{ animation-delay: 0.2s; }
  .eq-bar:nth-child(3).filled-regular{ animation-delay: 0.4s; }
  .eq-bar:nth-child(4).filled-regular{ animation-delay: 0.15s; }
  .eq-bar:nth-child(5).filled-regular{ animation-delay: 0.5s; }
  .eq-bar:nth-child(6).filled-regular{ animation-delay: 0.3s; }
  .eq-bar:nth-child(7).filled-regular{ animation-delay: 0.6s; }

  @keyframes eqHarmonic{
    0%{ transform: scaleY(0.75); opacity: 0.8; }
    100%{ transform: scaleY(1.15); opacity: 1; filter: brightness(1.08); }
  }

  .eq-bar.filled-occasional{
    background: linear-gradient(180deg, var(--accent2), #9A451A);
  }

  .eq-bar.filled-makeup{
    background: linear-gradient(180deg, var(--makeup), #0D47A1);
  }

  /* ═══════════ MAIN CONTENT ═══════════ */
  main{ flex: 1; padding: 6px 16px 110px; }

  /* ═══════════ LUXURY TYPOGRAPHY ═══════════ */
  h1, h2, h3, h4{
    font-family: 'Bodoni Moda', 'Fraunces', serif;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .muted{ color: var(--muted); }

  /* ═══════════ LAYOUT HELPERS ═══════════ */
  .row{ display: flex; align-items: center; }
  .between{ justify-content: space-between; }
  .gap6{ gap: 6px; } .gap8{ gap: 8px; } .gap12{ gap: 12px; }

  /* ═══════════ DATE NAVIGATOR (Luminous Luxury Card) ═══════════ */
  .datenav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 12px 10px;
    margin: 12px 0 14px;
    box-shadow: var(--shadow-card);
    position: relative;
    overflow: hidden;
    transition: all var(--transition-smooth);
  }

  .datenav:hover{
    box-shadow: var(--shadow-hover);
    border-color: var(--line-strong);
  }

  .datenav button.arrow{
    background: rgba(184,134,11,0.06);
    border: 1px solid var(--line);
    color: var(--accent-deep);
    font-size: 20px;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    cursor: pointer;
    transition: all var(--transition-spring);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(60,45,20,0.03);
  }

  .datenav button.arrow:hover{
    background: rgba(184,134,11,0.16);
    border-color: var(--accent);
    transform: scale(1.08);
    box-shadow: 0 4px 12px rgba(184,134,11,0.2);
  }

  .datenav button.arrow:active{
    transform: scale(0.92);
  }

  .datenav .dateinfo{ text-align: center; flex: 1; position: relative; z-index: 1; }
  .datenav .dateinfo .big{
    font-family: 'Bodoni Moda', serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  .datenav .dateinfo .small{
    font-size: 10.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ CHIP / FILTER PILLS ═══════════ */
  .quickjump{ display: flex; gap: 6px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }

  .chip{
    border: 1px solid var(--line);
    background: #FFFFFF;
    color: var(--text-secondary);
    padding: 7px 15px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all var(--transition-spring);
    font-weight: 500;
    box-shadow: 0 2px 6px rgba(60,45,20,0.03);
  }

  .chip:hover{
    border-color: var(--accent);
    color: var(--accent-deep);
    transform: translateY(-1.5px);
    box-shadow: 0 4px 12px rgba(184,134,11,0.15);
  }
  .chip:active{ transform: scale(0.95); }

  .chip.active{
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-warm) 100%);
    color: #FFFFFF;
    border-color: var(--accent);
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(184,134,11,0.35);
  }

  /* ═══════════ SUMMARY STATS ═══════════ */
  .summary{ display: flex; gap: 8px; margin-bottom: 16px; }

  .summary .s{
    flex: 1;
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 12px;
    text-align: center;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
  }

  .summary .s:hover{
    border-color: var(--line-strong);
    transform: translateY(-2.5px);
    box-shadow: var(--shadow-hover);
  }

  .summary .s .num{
    font-family: 'Bodoni Moda', serif;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-deep);
  }
  .summary .s .lbl{
    font-size: 9.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 3px;
    font-weight: 600;
  }

  /* ═══════════ LUXURY SLOT & CLASS CARD ═══════════ */
  .slot{
    background: var(--card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-card);
    transition: all var(--transition-smooth);
    position: relative;
    overflow: hidden;
    animation: cardSlideIn 0.45s var(--ease-spring) both;
  }

  .slot:hover{
    border-color: var(--line-strong);
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px) scale(1.006);
  }

  @keyframes cardSlideIn{
    from{ opacity: 0; transform: translateY(16px) scale(0.97); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }

  .slot.free{
    border-style: dashed;
    border-color: rgba(184,134,11,0.32);
    background: rgba(255,255,255,0.78);
  }

  .slot.free:hover{
    border-color: var(--accent);
    background: #FFFFFF;
  }

  .slot.makeup-open{
    border-style: dashed;
    border-color: rgba(21,101,192,0.4);
    background: rgba(21,101,192,0.04);
  }

  .slot.slot-continuation{
    background: rgba(247,243,234,0.9);
    border-left: 4px solid var(--accent);
    margin-top: -6px;
  }

  .slot .time{
    font-family: 'Bodoni Moda', serif;
    font-size: 17px;
    color: var(--accent-deep);
    min-width: 70px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  /* ═══════════ BADGE SYSTEM ═══════════ */
  .badge{
    font-size: 9.5px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 3.5px;
    font-family: 'Jost', sans-serif;
    transition: all var(--transition-fast);
  }

  .badge.regular{
    background: rgba(184,134,11,0.12);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.26);
  }

  .badge.occasional{
    background: rgba(192,86,33,0.12);
    color: var(--accent2);
    border: 1px solid rgba(192,86,33,0.26);
  }

  .badge.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .badge.group{
    background: var(--group-bg);
    color: var(--group-color);
    border: 1px solid var(--group-border);
  }

  .badge.duration{
    background: rgba(184,134,11,0.12);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.26);
  }

  .badge.absent{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .badge.present{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .badge.partial{
    background: rgba(184,134,11,0.15);
    color: var(--accent-deep);
    border: 1px solid rgba(184,134,11,0.3);
  }

  .badge.pending{
    background: rgba(184,134,11,0.14);
    color: var(--accent-deep);
  }

  .badge.tagchip{
    background: #FFFFFF;
    color: var(--text-secondary);
    border: 1px solid var(--line);
    font-size: 10.5px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0.02em;
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  /* ═══════════ TEXT ELEMENTS ═══════════ */
  .name{
    font-size: 16.5px;
    font-weight: 700;
    margin: 6px 0 2px;
    color: var(--text);
    letter-spacing: 0.01em;
  }

  .phone{
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  /* ═══════════ ACTION ROW ═══════════ */
  .actionrow{ display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }

  /* ═══════════ ULTRA-LUXURY BUTTONS ═══════════ */
  .btn{
    border: none;
    border-radius: 13px;
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all var(--transition-spring);
    font-family: 'Jost', sans-serif;
    letter-spacing: 0.02em;
    position: relative;
    overflow: hidden;
  }

  .btn:active{ transform: translateY(1.5px) scale(0.96); }
  .btn:disabled{ opacity: 0.4; cursor: default; transform: none; }

  .btn.primary{
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-warm) 50%, var(--accent) 100%);
    background-size: 200% auto;
    color: #FFFFFF;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(184,134,11,0.3), 0 2px 4px rgba(184,134,11,0.15);
  }

  .btn.primary:hover{
    box-shadow: 0 6px 24px rgba(184,134,11,0.42);
    transform: translateY(-1.5px);
  }

  .btn.ghost{
    background: rgba(184,134,11,0.07);
    color: var(--text);
    border: 1px solid var(--line);
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  .btn.ghost:hover{
    background: rgba(184,134,11,0.15);
    border-color: var(--accent);
    transform: translateY(-1.5px);
    box-shadow: 0 3px 10px rgba(184,134,11,0.12);
  }

  .btn.warn{
    background: var(--bad-bg);
    color: var(--bad);
    border: 1px solid var(--bad-border);
  }

  .btn.warn:hover{ border-color: var(--bad); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(197,48,48,0.15); }

  .btn.good{
    background: var(--good-bg);
    color: var(--good);
    border: 1px solid var(--good-border);
  }

  .btn.good:hover{ border-color: var(--good); transform: translateY(-1.5px); box-shadow: 0 3px 10px rgba(22,115,56,0.15); }

  .btn.makeup{
    background: var(--makeup-bg);
    color: var(--makeup);
    border: 1px solid var(--makeup-border);
  }

  .btn.block{ width: 100%; justify-content: center; padding: 14px; font-size: 15px; font-weight: 700; }

  /* ═══════════ FORM FIELDS (Crisp Luxury Inputs) ═══════════ */
  .field{ margin-bottom: 15px; }

  .field label{
    display: block;
    font-size: 11px;
    color: var(--accent-deep);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
  }

  .field input, .field select, .field textarea{
    width: 100%;
    background: #FFFFFF;
    border: 1.5px solid var(--line-strong);
    color: var(--text);
    padding: 12px 15px;
    border-radius: 13px;
    font-size: 14.5px;
    font-family: 'Jost', sans-serif;
    outline: none;
    transition: all var(--transition-smooth);
    box-shadow: 0 1px 3px rgba(60,45,20,0.03);
  }

  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px rgba(184,134,11,0.18);
  }

  .field textarea{ resize: vertical; min-height: 80px; }

  /* ═══════════ BOTTOM NAVIGATION ═══════════ */
  nav.bottom{
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(28px) saturate(1.5);
    -webkit-backdrop-filter: blur(28px) saturate(1.5);
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -4px 28px rgba(60,45,20,0.09);
  }

  nav.bottom button{
    flex: 1;
    background: none;
    border: none;
    color: var(--muted);
    padding: 12px 4px 10px;
    font-size: 10.5px;
    font-family: 'Jost', sans-serif;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    transition: all var(--transition-smooth);

<!-- Interactive Musical & Champagne Gold Particle Canvas -->
<canvas id="particles-canvas"></canvas>
<div id="app"><div class="loading">Connecting to Sir Slot studio…</div></div>

<!-- Interactive Musical Notes + Champagne Gold Particle System -->
<script>
(function(){
  const c = document.getElementById('particles-canvas');
  if (!c) return;
  const ctx = c.getContext('2d');
  let w, h, particles = [];
  const PARTICLE_COUNT = 40;
  const MUSIC_SYMBOLS = ['♪', '♫', '♬', '𝄞', '♩', '✨', '✦'];
  let mouse = { x: -1000, y: -1000, radius: 120 };

  window.addEventListener('mousemove', (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      mouse.x = e.touches[0].clientX;
      mouse.y = e.touches[0].clientY;
    }
  }, { passive: true });

  window.addEventListener('touchend', () => {
    mouse.x = -1000;
    mouse.y = -1000;
  });

  function resize(){
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }

  function createParticle(initial = false){
    const isNote = Math.random() < 0.35; // 35% are musical symbols
    return {
      isNote,
      symbol: isNote ? MUSIC_SYMBOLS[Math.floor(Math.random() * MUSIC_SYMBOLS.length)] : null,
      fontSize: Math.random() * 8 + 12,
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + 20,
      size: Math.random() * 2.2 + 0.6,
      speedX: (Math.random() - 0.5) * 0.4,
      speedY: -(Math.random() * 0.5 + 0.15),
      opacity: Math.random() * 0.45 + 0.15,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: Math.random() * 0.02 + 0.01,
      angle: Math.random() * Math.PI * 2,
      angleSpeed: (Math.random() - 0.5) * 0.015
    };
  }

  function init(){
    resize();
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(createParticle(true));
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (const p of particles){
      p.x += p.speedX;
      p.y += p.speedY;
      p.pulse += p.pulseSpeed;
      p.angle += p.angleSpeed;

      // Mouse interactive force field (gentle push)
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouse.radius && dist > 0){
        const force = (mouse.radius - dist) / mouse.radius;
        p.x += (dx / dist) * force * 1.8;
        p.y += (dy / dist) * force * 1.8;
      }

      const op = p.opacity * (0.65 + 0.35 * Math.sin(p.pulse));

      if (p.y < -30 || p.x < -30 || p.x > w + 30){
        Object.assign(p, createParticle(false));
      }

      if (p.isNote) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.font = `${p.fontSize}px 'Jost', serif`;
        ctx.fillStyle = `rgba(184, 134, 11, ${op * 0.75})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.symbol, 0, 0);
        ctx.restore();
      } else {
        // Glowing champagne orb
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(184, 134, 11, ${op})`;
        ctx.fill();

        // Soft halo
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 2.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(212, 175, 55, ${op * 0.16})`;
        ctx.fill();
      }
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  init();
  draw();
})();
</script>

      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (authToken) headers['Authorization'] = 'Bearer ' + authToken;
      try {
        const res = await fetch(url, { ...options, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Server request failed');
        return data;
      } catch (err) {
        console.error('API error:', err);
        throw err;
      }
    },
    get(url) { return this.request(url, { method: 'GET' }); },
    post(url, body) { return this.request(url, { method: 'POST', body: JSON.stringify(body) }); },
    put(url, body) { return this.request(url, { method: 'PUT', body: JSON.stringify(body) }); },
    delete(url) { return this.request(url, { method: 'DELETE' }); }
  };

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  async function syncPushSubscription(swReg, user) {
    try {

      if (sub && user) {

          subscription: sub,
          userId: user.id || '',

  async function requestPushPermissionAndSubscribe(user) {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) {
      showToast('Push notifications not supported on this browser');
      return false;
    }

    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        localStorage.setItem('sur_notif_pref', 'denied');
        showToast('Notification permission was not granted');
        return false;
      }

      localStorage.setItem('sur_notif_pref', 'enabled');
      const swReg = await navigator.serviceWorker.ready;
      let subscription = await swReg.pushManager.getSubscription();

      if (!subscription) {
        subscription = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }

      if (subscription) {
        await api.post('/api/push/subscribe', {
          subscription: subscription,
          userId: user ? (user.id || '') : '',
          name: user ? (user.name || '') : '',
          mobile: user ? (user.mobile || '') : '',
          role: user ? (user.role || 'student') : 'student'
        });
        showToast('🔔 Class reminders & alerts enabled!');
        const banner = document.getElementById('notifPromptBanner');
        if (banner) banner.remove();
        return true;
      }
    } catch (err) {
      console.error('Subscription error:', err);
      showToast('Could not enable push: ' + err.message);
      return false;
    }
  }

    document.getElementById("flexJumpTomorrow").onclick = () => { flexSelectedDate = new Date(); flexSelectedDate.setDate(flexSelectedDate.getDate() + 1); renderFlexibleSlotViewerInContainer(container); };
    document.getElementById("flexJumpDate").onchange = (e) => {
      if (e.target.value) {
        const [y, m, d] = e.target.value.split("-").map(Number);
        flexSelectedDate = new Date(y, m - 1, d);
        renderFlexibleSlotViewerInContainer(container);
      }
    };

    container.querySelectorAll("[data-ftf]").forEach(btn => {
      btn.onclick = () => {
        flexTimeFilter = btn.getAttribute("data-ftf");
        renderFlexibleSlotViewerInContainer(container);
      };
    });

    try {
      const sch = await api.get('/api/schedule?date=' + key);
      const allSlots = sch.slots || [];
      
      const freeSlots = allSlots.filter(s => {
        if (!s.free) return false;
        const h = parseInt(s.slotTime.split(':')[0]);
        if (flexTimeFilter === 'morning') return h >= 5 && h < 12;
        if (flexTimeFilter === 'afternoon') return h >= 12 && h < 17;
        if (flexTimeFilter === 'evening') return h >= 17 && h <= 23;
        return true;
      });

      const listEl = document.getElementById("flexSlotListContainer");
      if (!listEl) return;

      if (freeSlots.length === 0) {
        listEl.innerHTML = `
          <div class="empty" style="padding:24px 10px;">
            <div class="big">🎹</div>
            <div style="font-weight:600;font-size:14px;color:var(--accent);">No free slots in this time window</div>
            <div class="muted" style="font-size:12px;margin-top:4px;">Try switching to Tomorrow or another date above!</div>
          </div>`;
        return;
      }

      listEl.innerHTML = `
        <div style="font-size:12px;color:var(--good);font-weight:600;margin-bottom:8px;text-align:left;">
          🟢 ${freeSlots.length} Free Slots Available (${fmtDateLong(flexSelectedDate)})
        </div>
        ${freeSlots.map(s => `
          <div class="slot free" style="text-align:left;margin-bottom:8px;background:#FFFFFF;border:1.5px dashed rgba(27,122,62,0.35);">
            <div class="row between">
              <div>
                <div class="time" style="color:var(--good);font-weight:700;">${fmtTime(s.slotTime)}</div>
                <div class="muted" style="font-size:11.5px;">Available for 1 to 3 hour class</div>
              </div>
              <span class="badge present">🟢 Open Slot</span>
            </div>
            <div class="actionrow" style="margin-top:10px;">
              <button class="btn ghost" data-flex-call="${s.slotTime}">📞 Call Sir to Block</button>
              <button class="btn primary" data-flex-wa="${s.slotTime}">💬 WhatsApp Sir</button>
            </div>
          </div>
        `).join("")}`;

      listEl.querySelectorAll("[data-flex-call]").forEach(btn => {
        btn.onclick = () => { window.location.href = telLink(COACH_PRIMARY_MOBILE); };
      });

      listEl.querySelectorAll("[data-flex-wa]").forEach(btn => {
        btn.onclick = () => {
          const t = btn.getAttribute("data-flex-wa");
          const msg = `Hi Sir, I would like to book the available music class slot on ${fmtDateLong(flexSelectedDate)} at ${fmtTime(t)}. Please confirm and block this slot for me! 🎵`;
          window.open(waLink(COACH_PRIMARY_MOBILE, msg), "_blank");
        };
      });

    } catch (e) {
      const listEl = document.getElementById("flexSlotListContainer");
      if (listEl) listEl.innerHTML = `<div class="empty" style="color:var(--bad);">Failed to load schedule</div>`;
    }
  }

  function logOut() {
    api.post('/api/auth/logout', {}).catch(() => {});
    authToken = null;
    currentUser = null;
    localStorage.removeItem('sir_token');
    renderLoginScreen();
    showToast("Signed out");

  function renderCoachTab() {
    const main = document.getElementById("main");
    const eqBar = document.getElementById("eqBar");
    if (eqBar && scheduleData && scheduleData.slots) {
      eqBar.innerHTML = scheduleData.slots.map(it => {
        let cls = "eq-bar", h = 5;
        if (it.type === 'regular') { cls += " filled-regular"; h = 18; }
        else if (it.type === 'occasional') { cls += " filled-occasional"; h = 14; }
        else if (it.type === 'makeup' || (it.makeup && it.makeup.status === 'claimed')) { cls += " filled-makeup"; h = 16; }
        return `<div class="${cls}" style="height:${h}px"></div>`;
      }).join("");
    }

    if (activeTab === "schedule") renderSchedule(main);
    else if (activeTab === "requests") renderRequests(main);
    else if (activeTab === "students") renderStudents(main);
    else renderSettings(main);
  }

  // ---------- SCHEDULE TAB ----------
  async function refreshSchedule() {
    try {
      scheduleData = await api.get('/api/schedule?date=' + dateKey(selectedDate));
      renderCoachTab();
    } catch (e) {
      showToast("Error updating schedule");
    }
  }

  function renderSchedule(main) {
    const today = new Date();
    const isToday = isSameDay(selectedDate, today);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);
    const isTomorrow = isSameDay(selectedDate, tomorrow);
    const key = dateKey(selectedDate);
    const allSlots = scheduleData.slots || [];

    // Filter by time of day
    const filteredSlots = allSlots.filter(it => {
      const h = parseInt(it.slotTime.split(':')[0]);
      if (timeFilter === 'morning') return h >= 5 && h < 12;
      if (timeFilter === 'afternoon') return h >= 12 && h < 17;
      if (timeFilter === 'evening') return h >= 17 && h <= 23;
      return true;
    });

    const bookedCount = allSlots.filter(i => !i.free && i.isPrimary !== false).length;
    const freeCount = allSlots.filter(i => i.free).length;
    const activeBatches = scheduleData.activeBatches || [];

    let html = `
      ${renderNotificationBannerIfNeeded()}
      <div class="datenav">
        <button class="arrow" id="prevDay">‹</button>
        <div class="dateinfo">
          <div class="big">${fmtDateLong(selectedDate)}</div>
          <div class="small">${isToday ? "Today" : isTomorrow ? "Tomorrow" : DAY_SHORT[selectedDate.getDay()]}${activeBatches.length ? " · " + activeBatches.map(b => b.name).join(" & ") : " · No regular batch"}</div>
        </div>
        <button class="arrow" id="nextDay">›</button>
      </div>

      <div class="quickjump">
        <button class="chip ${isToday ? 'active' : ''}" id="jumpToday">Today</button>
        <button class="chip ${isTomorrow ? 'active' : ''}" id="jumpTomorrow">Tomorrow</button>
        <input type="date" id="jumpDate" style="background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12px;outline:none;" value="${key}"/>
      </div>

      <!-- Time of Day Filter (5 AM to 11 PM) -->
      <div class="quickjump" style="margin-top:-4px;margin-bottom:12px;">
        <button class="chip ${timeFilter === 'all' ? 'active' : ''}" data-tf="all">All (5 AM–11 PM)</button>
        <button class="chip ${timeFilter === 'morning' ? 'active' : ''}" data-tf="morning">🌅 Morning (5–12)</button>
        <button class="chip ${timeFilter === 'afternoon' ? 'active' : ''}" data-tf="afternoon">☀️ Afternoon (12–5)</button>
        <button class="chip ${timeFilter === 'evening' ? 'active' : ''}" data-tf="evening">🌙 Evening (5–11)</button>
      </div>

      <div class="summary">
        <div class="s"><div class="num">${allSlots.length}</div><div class="lbl">1-Hr Slots</div></div>
        <div class="s"><div class="num" style="color:var(--accent)">${bookedCount}</div><div class="lbl">Classes</div></div>
        <div class="s"><div class="num" style="color:var(--good)">${freeCount}</div><div class="lbl">Free Hours</div></div>
      </div>`;

    html += filteredSlots.length === 0
      ? `<div class="empty"><div class="big">🎹</div>No slots in this time window.</div>`
      : filteredSlots.map(it => renderSlotCard(it, key)).join("");

    main.innerHTML = html;

    const notifBtn = document.getElementById("btnEnableNotifBanner");
    if (notifBtn) {
      notifBtn.onclick = () => requestPushPermissionAndSubscribe(currentUser);
    }

    document.getElementById("prevDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() - 1); refreshSchedule(); };
    document.getElementById("nextDay").onclick = () => { selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpToday").onclick = () => { selectedDate = new Date(); refreshSchedule(); };
    document.getElementById("jumpTomorrow").onclick = () => { selectedDate = new Date(); selectedDate.setDate(selectedDate.getDate() + 1); refreshSchedule(); };
    document.getElementById("jumpDate").onchange = (e) => {
      if (e.target.value) {
        const [y, m, d] = e.target.value.split("-").map(Number);
        selectedDate = new Date(y, m - 1, d);
        refreshSchedule();
      }
    };

    main.querySelectorAll("[data-tf]").forEach(btn => {
      btn.onclick = () => {
        timeFilter = btn.getAttribute("data-tf");
        renderCoachTab();
      };
    });

    main.querySelectorAll("[data-book-slot]").forEach(btn => btn.onclick = () => openBookSheet(btn.getAttribute("data-book-slot"), key));
    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });
    main.querySelectorAll("[data-msg]").forEach(btn => btn.onclick = () => openMessageSheet(btn.getAttribute("data-msg"), btn.getAttribute("data-msg-mobile")));
    main.querySelectorAll("[data-perf-slot]").forEach(btn => btn.onclick = () => openPerformanceModal(btn.getAttribute("data-perf-slot")));
    main.querySelectorAll("[data-edit-student]").forEach(btn => btn.onclick = () => openEditStudentSheet(btn.getAttribute("data-edit-student")));

    // Solo Student Attendance
    main.querySelectorAll("[data-mark]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-mark");
      const statusToSet = btn.getAttribute("data-status");
      const currentStatus = btn.getAttribute("data-current");
      const newStatus = (currentStatus === statusToSet) ? null : statusToSet;
      try {
        await api.post('/api/attendance', { date: key, studentId, status: newStatus });
        refreshSchedule();
      } catch (e) {
        showToast("Failed to record attendance");
      }
    });

    // Sibling Group Combined Attendance
    main.querySelectorAll("[data-group-all-present]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-present");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'present');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'present', memberStatuses });
        showToast("✓ All siblings marked present");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-all-absent]").forEach(btn => btn.onclick = async () => {
      const studentId = btn.getAttribute("data-group-all-absent");
      const item = scheduleData.slots.find(s => s.id === studentId);
      const members = (item && item.groupMembers) || [];
      const memberStatuses = {};
      members.forEach(m => memberStatuses[m.name] = 'absent');
      try {
        await api.post('/api/attendance', { date: key, studentId, status: 'absent', memberStatuses });
        showToast("✕ All siblings marked absent");
        refreshSchedule();
      } catch (e) {
        showToast("Failed to update attendance");
      }
    });

    main.querySelectorAll("[data-group-partial]").forEach(btn => btn.onclick = () => {
      const studentId = btn.getAttribute("data-group-partial");
      const item = scheduleData.slots.find(s => s.id === studentId);
      if (item) openGroupAttendanceSheet(item, key);
    });

    main.querySelectorAll("[data-cancel-booking]").forEach(btn => btn.onclick = async () => {
      const bid = btn.getAttribute("data-cancel-booking");
      if (confirm("Cancel this booking?")) {
        try {
          await api.delete('/api/bookings/' + bid);
          refreshSchedule();
          showToast("Booking cancelled");
        } catch (e) {
          showToast("Error cancelling booking");
        }
      }
    });
  }

  function renderSlotCard(it, key) {
    if (it.free) {
      return `<div class="slot free">
        <div class="row between"><div class="time">${fmtTime(it.slotTime)}</div><span class="muted" style="font-size:12px;">Available (1h slot)</span></div>
        <div class="actionrow"><button class="btn primary" data-book-slot="${it.slotTime}">+ Book 1–3h slot</button></div>
      </div>`;
    }

    // Continuation card for 2nd or 3rd hour of a multi-hour class
    if (it.isPrimary === false) {
      return `<div class="slot slot-continuation">
        <div class="row between">
          <div class="time" style="font-size:13.5px;color:var(--muted);">${fmtTime(it.slotTime)}</div>
          <span class="badge duration">↳ Hour ${it.hourIndex} of ${it.durationHours}</span>
        </div>
        <div style="font-size:13px;margin-top:2px;"><b>${escapeHtml(it.name)}</b> <span class="muted">(Continued from ${fmtTime(it.primarySlotTime)})</span></div>
      </div>`;
    }

    const template = scheduleData.template || "Hi {name} 🎵 Reminder: you have class at {time}.";
    const msgText = template.replace("{name}", it.name).replace("{time}", fmtTime(it.slotTime)).replace("{date}", fmtDateLong(selectedDate));
    const isGroup = it.slotType && it.slotType !== 'solo';
    
    // Status Badge calculation
    let statusBadge = "";
    if (it.status === 'present') {
      statusBadge = `<span class="badge present" style="margin-left:6px;">${isGroup ? '✓ All Present' : '✓ Present'}</span>`;
    } else if (it.status === 'absent') {
      statusBadge = `<span class="badge absent" style="margin-left:6px;">${isGroup ? '✕ All Absent' : '✕ Not coming'}</span>`;
    } else if (it.status === 'partial') {
      const absentMems = Object.entries(it.memberStatuses || {}).filter(([k,v]) => v === 'absent').map(([k]) => k);
      const totalMems = (it.groupMembers && it.groupMembers.length) || Object.keys(it.memberStatuses || {}).length || 2;
      const presentCount = totalMems - absentMems.length;
      statusBadge = `<span class="badge partial" style="margin-left:6px;">🟡 ${presentCount} Present, ${absentMems.length} Absent${absentMems.length > 0 ? ' (' + absentMems.join(', ') + ')' : ''}</span>`;
    }

    let attendanceButtons = "";
    if (it.type === 'regular') {
      if (!isGroup) {
        attendanceButtons = `
          <button class="btn ${it.status === 'present' ? 'good' : 'ghost'}" data-mark="${it.id}" data-status="present" data-current="${it.status || ''}">✓ Present</button>
          <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-mark="${it.id}" data-status="absent" data-current="${it.status || ''}">Not coming</button>`;
      } else {
        attendanceButtons = `
          <button class="btn ${it.status === 'present' ? 'good' : 'ghost'}" data-group-all-present="${it.id}">✓ All Present</button>
          <button class="btn ${it.status === 'absent' ? 'warn' : 'ghost'}" data-group-all-absent="${it.id}">✕ All Absent</button>
          <button class="btn ${it.status === 'partial' ? 'good' : 'ghost'}" data-group-partial="${it.id}">👥 Sibling Attendance</button>`;
      }
    }

    const cancelBtn = (it.type === 'occasional' || it.type === 'makeup') ? `<button class="btn warn" data-cancel-booking="${it.id}">Cancel</button>` : "";
    const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(it.slotType)}</span>` : '';
    const durBadge = (it.durationHours && it.durationHours > 1) ? `<span class="badge duration">⏱️ ${it.durationHours} Hours</span>` : '';
    const instBadges = (it.instruments || []).map(inst => `<span class="badge tagchip">${escapeHtml(inst)}</span>`).join(" ");

    let membersText = "";
    if (isGroup && it.groupMembers && it.groupMembers.length > 0) {
      const memberStatusChips = it.groupMembers.map(m => {
        const mst = (it.memberStatuses && it.memberStatuses[m.name]) || (it.status === 'present' ? 'present' : it.status === 'absent' ? 'absent' : null);
        let tagColor = 'var(--text)';
        let tagIcon = '';
        if (mst === 'present') { tagColor = 'var(--good)'; tagIcon = ' ✓'; }
        else if (mst === 'absent') { tagColor = 'var(--bad)'; tagIcon = ' ✕'; }
        return `<span style="display:inline-block;background:var(--bg-deep);padding:2px 7px;border-radius:6px;border:1px solid var(--line);font-size:11.5px;margin:2px 4px 2px 0;color:${tagColor};"><b>${escapeHtml(m.name)}</b>${tagIcon}</span>`;
      }).join("");

      membersText = `<div style="margin:4px 0 2px;">${memberStatusChips}</div>`;
    }

    // Smart Make-up Slot Alert
    let makeupNotice = "";
    if (it.status === 'absent') {
      if (it.makeup && it.makeup.status === 'claimed') {
        makeupNotice = `<div style="background:rgba(93,173,226,0.14);border:1px solid var(--makeup);padding:8px 10px;border-radius:8px;margin-top:6px;font-size:12px;color:var(--makeup);">
          <b>🔄 Claimed Make-up Class:</b> ${escapeHtml(it.makeup.claimed_by_name)} (${it.makeup.claimed_by_mobile})
        </div>`;
      } else {
        makeupNotice = `<div style="background:rgba(93,173,226,0.1);border:1px dashed var(--makeup);padding:7px 10px;border-radius:8px;margin-top:6px;font-size:12px;color:var(--makeup);">
          <b>🔄 Open Make-up Slot (${it.durationHours || 1}h):</b> Vacated by regular class
        </div>`;
      }
    }

    return `<div class="slot ${it.status === 'absent' ? 'makeup-open' : ''}">
      <div class="row between">
        <div class="time">${fmtTimeRange(it.slotTime, it.durationHours || 1)}</div>
        <div>
          ${durBadge}
          ${it.type === 'makeup' ? '<span class="badge makeup">Make-up</span>' : ''}
          ${groupBadge}
          <span class="badge ${it.type}">${it.type === 'regular' ? '🎓 Fixed Batch' : it.type === 'makeup' ? '🔄 Make-up' : '⚡ Flexible Session'}</span>
        </div>
      </div>
      <div class="name">${escapeHtml(it.name)} ${statusBadge}</div>
      ${membersText}
      <div class="phone">${it.mobile}</div>
      ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
      ${it.currentLesson ? `<div class="muted" style="font-size:11.5px;margin-top:4px;">🎼 Lesson: <i>${escapeHtml(it.currentLesson)}</i></div>` : ''}
      ${makeupNotice}
      <div class="actionrow">
        <button class="btn ghost" data-call="${it.mobile}">📞 Call</button>
        <button class="btn ghost" data-msg="${msgText.replace(/"/g, '&quot;')}" data-msg-mobile="${it.mobile}">💬 Message</button>
        ${it.type === 'regular' ? `
          <button class="btn primary" data-perf-slot="${it.id}">⭐ Evaluate</button>
          <button class="btn ghost" data-edit-student="${it.id}">🕒 Change Timing</button>
        ` : ''}
        ${attendanceButtons}
        ${cancelBtn}
      </div>
    </div>`;
  }

  // ---------- SIBLING GROUP INDIVIDUAL ATTENDANCE MODAL ----------
  function openGroupAttendanceSheet(item, dateStr) {
    const members = (item.groupMembers && item.groupMembers.length > 0)
      ? item.groupMembers
      : [{ name: item.name }];

    const currentStatuses = { ...(item.memberStatuses || {}) };
    members.forEach(m => {
      if (!currentStatuses[m.name]) {
        currentStatuses[m.name] = (item.status === 'absent') ? 'absent' : 'present';
      }
    });

    const html = `
      <div class="sheethead">
        <h3 style="margin:0;">👥 Combined Sibling Attendance</h3>
        <button class="close" data-close>✕</button>
      </div>

      <div class="student-row" style="background:var(--bg-deep);margin-bottom:12px;">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="phone">${dateStr} · ${fmtTimeRange(item.slotTime || item.time, item.durationHours || 1)}</div>
      </div>

      <div class="row gap8" style="margin-bottom:14px;">
        <button class="btn good" id="btnGroupAllPres" style="flex:1;justify-content:center;">✓ All Present</button>
        <button class="btn warn" id="btnGroupAllAbs" style="flex:1;justify-content:center;">✕ All Absent</button>
      </div>

      <label style="font-size:11px;color:var(--accent);font-weight:600;text-transform:uppercase;margin-bottom:8px;display:block;">
        Individual Sibling / Member Status:
      </label>

      <div id="memberAttList">
        ${members.map(m => `
          <div class="member-att-row" data-member="${escapeHtml(m.name)}">
            <div style="font-weight:600;font-size:14px;">${escapeHtml(m.name)}</div>
            <div class="pill-group">
              <button class="pill-btn pill-present ${currentStatuses[m.name] === 'present' ? 'active' : ''}" data-act="present">✓ Present</button>
              <button class="pill-btn pill-absent ${currentStatuses[m.name] === 'absent' ? 'active' : ''}" data-act="absent">✕ Absent</button>
            </div>
          </div>
        `).join("")}
      </div>

      <div id="attSummaryText" style="background:rgba(210,162,76,0.12);border:1px solid var(--accent);padding:10px 12px;border-radius:10px;margin:12px 0;font-size:12.5px;text-align:center;">
        Loading status…
      </div>

      <button class="btn primary block" id="btnSaveGroupAtt">Save Sibling Attendance</button>`;

    openSheet(html, (ov) => {
      ov.querySelector("[data-close]").onclick = () => ov.remove();

      function updateSummaryText() {
        const total = members.length;
        const absentList = members.filter(m => currentStatuses[m.name] === 'absent').map(m => m.name);
        const presentCount = total - absentList.length;
        const sumEl = ov.querySelector("#attSummaryText");

        if (absentList.length === 0) {
          sumEl.innerHTML = `<span style="color:var(--good);font-weight:700;">🟢 All ${total} siblings attending</span>`;
        } else if (absentList.length === total) {
          sumEl.innerHTML = `<span style="color:var(--bad);font-weight:700;">🔴 All ${total} siblings absent</span>`;
        } else {
          sumEl.innerHTML = `<span style="color:var(--accent);font-weight:700;">🟡 ${presentCount} Present · ${absentList.length} Absent: <i>${escapeHtml(absentList.join(', '))}</i></span>`;
        }
      }

      function refreshPillUI() {
        ov.querySelectorAll(".member-att-row").forEach(row => {
          const mName = row.getAttribute("data-member");
          const st = currentStatuses[mName];
          row.querySelector(".pill-present").classList.toggle("active", st === 'present');
          row.querySelector(".pill-absent").classList.toggle("active", st === 'absent');
        });
        updateSummaryText();
      }

      ov.querySelectorAll(".member-att-row").forEach(row => {
        const mName = row.getAttribute("data-member");
        row.querySelector(".pill-present").onclick = () => {
          currentStatuses[mName] = 'present';
          refreshPillUI();
        };
        row.querySelector(".pill-absent").onclick = () => {
          currentStatuses[mName] = 'absent';
          refreshPillUI();
        };
      });

      ov.querySelector("#btnGroupAllPres").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'present');
        refreshPillUI();
      };

      ov.querySelector("#btnGroupAllAbs").onclick = () => {
        members.forEach(m => currentStatuses[m.name] = 'absent');
        refreshPillUI();
      };

      refreshPillUI();

      ov.querySelector("#btnSaveGroupAtt").onclick = async () => {
        const total = members.length;
        const absentCount = members.filter(m => currentStatuses[m.name] === 'absent').length;

        let finalStatus = 'present';
        if (absentCount === total) finalStatus = 'absent';
        else if (absentCount > 0) finalStatus = 'partial';

        try {
          await api.post('/api/attendance', {
            date: dateStr,
            studentId: item.id,
            status: finalStatus,
            memberStatuses: currentStatuses
          });
          ov.remove();
          showToast(`Attendance recorded (${finalStatus})!`);
          if (currentUser.role === 'coach') refreshSchedule();
          else renderStudentView();
        } catch (err) {
          showToast(err.message || "Failed to save attendance");
        }
      };
    });
  }

  // ---------- REQUESTS TAB ----------
  async function refreshRequests() {
    try {
      const res = await api.get('/api/requests');
      requestsData = res.requests || [];
      renderCoachTab();

    } else {
      html += pending.map(r => {
        const isGroup = r.slotType && r.slotType !== 'solo';
        const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(r.slotType)}</span>` : '';
        const durBadge = (r.durationHours && r.durationHours > 1) ? `<span class="badge duration">⏱️ ${r.durationHours}h Class</span>` : '';
        const instBadges = (r.instruments || []).map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ");
        const mems = (isGroup && r.groupMembers && r.groupMembers.length > 0) ? `<div class="muted" style="font-size:12px;margin-top:4px;">Members: <b>${r.groupMembers.map(m=>escapeHtml(m.name)).join(", ")}</b></div>` : '';

        return `

            <div class="row between">

                <div class="name">${escapeHtml(r.name)}</div>

              <div>${durBadge} ${groupBadge} <span class="badge pending">Pending</span></div>
            </div>
            ${mems}
            ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
            ${r.note ? `<div class="muted" style="font-size:12px;margin-top:8px;background:var(--bg-deep);padding:8px 10px;border-radius:8px;">"${escapeHtml(r.note)}"</div>` : ""}
            <div class="actionrow">
              <button class="btn ghost" data-call="${r.mobile}">📞 Call</button>
              <button class="btn primary" data-approve="${r.id}">✓ Accept &amp; assign batch</button>
              <button class="btn warn" data-decline="${r.id}">Decline</button>
            </div>
          </div>`;
      }).join("");
    }

    main.innerHTML = html;
    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });

    main.querySelectorAll("[data-decline]").forEach(btn => btn.onclick = async () => {
      const id = btn.getAttribute("data-decline");
      if (confirm("Decline this join request?")) {
        try {
          await api.post(`/api/requests/${id}/decline`, {});

          refreshRequests();
        } catch (e) {
          showToast("Error declining request");
        }
      }
    });

    main.querySelectorAll("[data-approve]").forEach(btn => btn.onclick = () => {
      const id = btn.getAttribute("data-approve");
      const req = requestsData.find(r => r.id === id);

  function openAssignBatchSheet(req) {
    const cfg = configData;
    const allSlots = (cfg.slots || []).slice().sort();

    const html = `
      <div class="sheethead"><h3 style="margin:0;">Assign ${escapeHtml(req.name)}</h3><button class="close" data-close>✕</button></div>
      <div class="field"><label>Select Recurring Batch</label>
        <div id="batchPicker">${(cfg.batches || []).map((b, i) => `
          <div class="batchcard ${i === 0 ? 'selected' : ''}" data-batch="${b.id}">
            <div class="name" style="margin:0;">${b.name}</div>
            <div class="muted" style="font-size:12px;">${b.sub}</div>
          </div>`).join("")}
        </div>
      </div>
      <div class="field">
        <label>Class Duration (Hours)</label>
        <select id="asDuration">
          <option value="1" ${req.durationHours == 1 ? 'selected' : ''}>⏱️ 1 Hour (Standard Slot)</option>
          <option value="2" ${req.durationHours == 2 ? 'selected' : ''}>⏱️ 2 Hours (Double Slot — 2 Siblings / Extended)</option>
          <option value="3" ${req.durationHours == 3 ? 'selected' : ''}>⏱️ 3 Hours (Triple Slot — 3 Siblings / Deep Study)</option>
        </select>
      </div>
      <div class="field"><label>Starting Time Slot (5 AM – 11 PM)</label>
        <select id="asTime">${allSlots.map(t => `<option value="${t}">${fmtTime(t)}</option>`).join("")}</select>
      </div>

          ov.querySelectorAll(".batchcard").forEach(x => x.classList.remove("selected"));

        const time = ov.querySelector("#asTime").value;

        try {
          await api.post(`/api/requests/${req.id}/approve`, { batchId: chosenBatch, time, durationHours });
          ov.remove();
          showToast(`${req.name} enrolled for ${durationHours}h successfully!`);

  // ---------- STUDENTS TAB ----------
  async function refreshStudents() {
    try {
      const res = await api.get('/api/students');
      studentsData = res.students || [];
      renderCoachTab();
    } catch (e) {
      showToast("Error refreshing students");
    }
  }

  function renderStudents(main) {
    const todayWeekday = (new Date()).getDay();
    const todayName = DAY_NAMES[todayWeekday];

    const todayStudents = studentsData.filter(s => {
      const b = batchById(s.batchId);
      return b && b.days && b.days.includes(todayWeekday);
    });
    const soloStudents = studentsData.filter(s => !s.slotType || s.slotType === 'solo');
    const groupStudents = studentsData.filter(s => s.slotType && s.slotType !== 'solo');

    let displayedList = studentsData;
    if (studentViewMode === 'today') displayedList = todayStudents;
    else if (studentViewMode === 'solo') displayedList = soloStudents;
    else if (studentViewMode === 'group') displayedList = groupStudents;

    let html = `
      <div class="row between" style="margin:16px 0 8px;">
        <h2 style="margin:0;">Student Roster</h2>
        <button class="btn primary" id="addStudentBtn">+ Enroll Student</button>
      </div>

      <!-- Segmented Tabs with Class Timing Order -->
      <div class="segmented" style="margin:8px 0 14px;">
        <button class="${studentViewMode === 'today' ? 'active' : ''}" data-svm="today">📅 Today (${todayName.slice(0,3)} · ${todayStudents.length})</button>
        <button class="${studentViewMode === 'all' ? 'active' : ''}" data-svm="all">🕒 All by Time (${studentsData.length})</button>
        <button class="${studentViewMode === 'solo' ? 'active' : ''}" data-svm="solo">👤 Solo (${soloStudents.length})</button>
        <button class="${studentViewMode === 'group' ? 'active' : ''}" data-svm="group">👫 Groups (${groupStudents.length})</button>
      </div>`;

    if (displayedList.length === 0) {
      if (studentViewMode === 'today') {
        html += `<div class="empty"><div class="big">📅</div>No batch classes scheduled for today (${todayName}).<br/><span class="muted" style="font-size:12px;">Switch to "All by Time" to see all enrolled students.</span></div>`;
      } else if (studentViewMode === 'solo') {
        html += `<div class="empty"><div class="big">👤</div>No individual solo students enrolled yet.</div>`;
      } else if (studentViewMode === 'group') {
        html += `<div class="empty"><div class="big">👫</div>No combined sibling or group classes enrolled yet.<br/><span class="muted" style="font-size:12px;">Click "+ Enroll Student" and select Sibling Duo / Trio.</span></div>`;
      } else {
        html += `<div class="empty"><div class="big">🎻</div>No students enrolled yet.</div>`;
      }
    } else {
      // Strict chronological sorting by class time slot (05:00 AM -> 11:00 PM)
      const sorted = displayedList.slice().sort((a, b) => {
        const timeDiff = (a.time || '').localeCompare(b.time || '');
        if (timeDiff !== 0) return timeDiff;
        return (a.name || '').localeCompare(b.name || '');
      });

      html += sorted.map(s => {
        const b = batchById(s.batchId);
        const att = s.attendance || { total: 0, present: 0, pct: null };
        const isGroup = s.slotType && s.slotType !== 'solo';
        const groupBadge = isGroup ? `<span class="badge group">${slotTypeLabel(s.slotType)}</span>` : '<span class="badge regular">Solo (1-on-1)</span>';
        const durBadge = (s.durationHours && s.durationHours > 1) ? `<span class="badge duration">⏱️ ${s.durationHours} Hours</span>` : '';
        const instBadges = (s.instruments || []).map(i => `<span class="badge tagchip">${escapeHtml(i)}</span>`).join(" ");
        
        let mems = "";
        if (isGroup && s.groupMembers && s.groupMembers.length > 0) {
          mems = `<div style="background:var(--bg-deep);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:12px;border:1px solid var(--line);">
            <span style="color:var(--accent);font-weight:600;">👥 Sibling Members:</span> <b>${s.groupMembers.map(m=>escapeHtml(m.name)).join(", ")}</b>
          </div>`;
        }

        return `
          <div class="student-row">
            <div class="row between">
              <div>
                <div class="name">${escapeHtml(s.name)}</div>
                <div class="phone" style="color:var(--accent-warm);font-weight:600;font-size:13px;margin:2px 0;">
                  ⏱️ ${fmtTimeRange(s.time, s.durationHours || 1)} · <span class="muted" style="font-weight:400;">${b ? b.name + ' (' + b.sub + ')' : '—'}</span>
                </div>
                <div class="phone">${s.mobile}</div>
              </div>
              <div>${durBadge} ${groupBadge}</div>
            </div>
            ${mems}
            ${instBadges ? `<div style="margin-top:6px;">${instBadges}</div>` : ''}
            ${s.currentLesson ? `<div class="muted" style="font-size:12px;margin-top:6px;">🎼 Active Lesson: <b>${escapeHtml(s.currentLesson)}</b></div>` : ''}
            ${(att.conducted > 0) ? `
              <div class="attendance-bar"><div class="attendance-fill" style="width:${att.pct}%"></div></div>
              <div class="muted" style="font-size:11px;margin-top:5px;">
                📅 <b>${att.month || 'This Month'}:</b> ${att.pct}% attendance (${att.present}/${att.conducted} conducted attended · ${att.totalScheduled} total classes in ${att.month || 'month'})
              </div>`
              : `<div class="muted" style="font-size:11px;margin-top:8px;">📅 <b>${att.month || 'This Month'}:</b> 0/${att.totalScheduled || 12} classes attended so far</div>`}
            <div class="actionrow">
              <button class="btn ghost" data-call="${s.mobile}">📞 Call</button>
              <button class="btn good" data-att-student="${s.id}">📅 Mark Attendance</button>
              <button class="btn primary" data-perf-student="${s.id}">⭐ Performance</button>
              <button class="btn ghost" data-edit-student="${s.id}">🕒 Change Timing</button>
              <button class="btn ghost" data-report-student="${s.id}">📊 Report</button>
              <button class="btn warn" data-del-student="${s.id}" data-name="${escapeHtml(s.name)}">Remove</button>
            </div>
          </div>`;
      }).join("");
    }

    main.innerHTML = html;
    document.getElementById("addStudentBtn").onclick = openAddStudentSheet;

    main.querySelectorAll("[data-svm]").forEach(btn => {
      btn.onclick = () => {
        studentViewMode = btn.getAttribute("data-svm");
        renderCoachTab();
      };
    });

    main.querySelectorAll("[data-call]").forEach(btn => btn.onclick = () => { window.location.href = telLink(btn.getAttribute("data-call")); });
    main.querySelectorAll("[data-att-student]").forEach(btn => btn.onclick = () => openMarkStudentAttendanceModal(btn.getAttribute("data-att-student")));
    main.querySelectorAll("[data-perf-student]").forEach(btn => btn.onclick = () => openPerformanceModal(btn.getAttribute("data-perf-student")));
    main.querySelectorAll("[data-report-student]").forEach(btn => btn.onclick = () => openAttendanceReportModal(btn.getAttribute("data-report-student"), true));
    main.querySelectorAll("[data-edit-student]").forEach(btn => btn.onclick = () => openEditStudentSheet(btn.getAttribute("data-edit-student")));

    main.querySelectorAll("[data-del-student]").forEach(btn => btn.onclick = async () => {
      const id = btn.getAttribute("data-del-student");
      const name = btn.getAttribute("data-name");
      if (confirm(`Remove student "${name}"? Slot will become free.`)) {
        try {
          await api.delete('/api/students/' + id);
          showToast(`${name} removed`);
          refreshStudents();
        } catch (e) {
          showToast("Error removing student");
        }
      }
    });
  }

      <div class="field"><label>Current Active Lesson</label><input type="text" id="editLessonInput" value="${escapeHtml(student.currentLesson || '')}" placeholder="e.g. Raga Bhairav - Alankars" /></div>

      <button class="btn primary block" id="btnSaveStudentChanges">Save &amp; Update Class Timings</button>`;

    openSheet(html, (ov) => {
      let chosenBatch = student.batchId || ((cfg.batches && cfg.batches[0]) ? cfg.batches[0].id : 'batchA');
      const typeSelect = ov.querySelector("#editSlotType");
      const sibWrap = ov.querySelector("#editSiblingNamesWrap");
      const mem3Field = ov.querySelector("#editMem3Field");

      typeSelect.onchange = () => {
        const val = typeSelect.value;
        if (val === 'solo') {
          sibWrap.style.display = 'none';
        } else {
          sibWrap.style.display = 'block';
          mem3Field.style.display = (val === 'sibling_trio' || val === 'group') ? 'block' : 'none';
        }
      };

      ov.querySelectorAll("#editInstGrid .tag-item").forEach(item => {
        item.onclick = () => {
          const inst = item.getAttribute("data-inst");
          if (selectedInstruments.has(inst)) {
            selectedInstruments.delete(inst);
            item.classList.remove("selected");
          } else {
            selectedInstruments.add(inst);
            item.classList.add("selected");
          }
        };
      });

      ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(c => {
        c.onclick = () => {
          ov.querySelectorAll("#batchPickerEdit .batchcard").forEach(x => x.classList.remove("selected"));
          c.classList.add("selected");
          chosenBatch = c.getAttribute("data-batch");
        };
      });

      ov.querySelector("[data-close]").onclick = () => ov.remove();
      ov.querySelector("#btnSaveStudentChanges").onclick = async () => {
        const time = ov.querySelector("#editTime").value;
        const durationHours = parseInt(ov.querySelector("#editDuration").value) || 1;
        const currentLesson = ov.querySelector("#editLessonInput").value.trim();
        const slotType = typeSelect.value;

        const groupMembers = [];
        if (slotType !== 'solo') {
          const m1 = ov.querySelector("#editMem1").value.trim();
          const m2 = ov.querySelector("#editMem2").value.trim();
          const m3 = ov.querySelector("#editMem3").value.trim();
          if (m1) groupMembers.push({ name: m1 });
          if (m2) groupMembers.push({ name: m2 });
          if (m3 && (slotType === 'sibling_trio' || slotType === 'group')) groupMembers.push({ name: m3 });
        }

        try {
          await api.put('/api/students/' + studentId, {
            batchId: chosenBatch,
            time,
            durationHours,
            slotType,
            groupMembers,
            instruments: Array.from(selectedInstruments),
            currentLesson
          });
          ov.remove();
          showToast(`Class timing updated to ${fmtTimeRange(time, durationHours)}!`);
          await loadDataForRole();
          renderCoachTab();
        } catch (err) {
          showToast(err.message || "Failed to update class timing");
        }
      };
    });
  }
