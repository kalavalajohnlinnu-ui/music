<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Offline — International Thomas Music Academy</title>
<link rel="icon" type="image/png" href="/itma-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #030712;
    background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.22) 0%, transparent 60%),
                      linear-gradient(180deg, #030712 0%, #080E21 100%);
    color: #FFFFFF;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(28px);
    border-radius: 28px;
    padding: 36px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
  }
  .logo-img {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid #F59E0B;
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    margin-bottom: 16px;
    background: #FFFFFF;
  }
  .academy-name {
    font-size: 16px;
    font-weight: 800;
    color: #FFFFFF;
    margin-bottom: 4px;
  }
  .scripture {
    font-size: 11px;
    color: #FDE68A;
    font-style: italic;
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .offline-icon {
    width: 72px;
    height: 72px;
    background: rgba(239, 68, 68, 0.15);
    border: 2px solid rgba(239, 68, 68, 0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    margin: 0 auto 16px;
    box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
  }
  .offline-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .offline-desc {
    font-size: 13px;
    color: #94A3B8;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .btn-retry {
    background: linear-gradient(135deg, #0284C7, #0369A1);
    color: #FFFFFF;
    border: none;
    padding: 12px 28px;
    border-radius: 25px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
    width: 100%;
    transition: transform 0.2s ease;
  }
  .btn-retry:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="card">
    <img src="/itma-logo.png" alt="ITMA Logo" class="logo-img" onerror="this.src='/logo.png'">
    <div class="academy-name">International Thomas Music Academy</div>
    <div class="scripture">“Sing and make music from your heart to the Lord.” — Eph 5:19</div>

    <div class="offline-icon">📡</div>
    <div class="offline-title">You're Offline</div>
    <div class="offline-desc">
      No internet connection detected. Please check your network and reconnect.
    </div>

    <button class="btn-retry" onclick="window.location.reload()">
      🔄 Check Connection &amp; Retry
    </button>
  </div>
</body>
</html>
